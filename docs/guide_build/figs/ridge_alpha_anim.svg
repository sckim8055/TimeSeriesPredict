1" fill="#1c2027" text-anchor="start" font-weight="normal">alpha 100: w = 5 ÷ 102 = 0.049 → 거의 평균선. 'alpha 가 크면 재료를 덜 믿는다' (sklearn Ridge 결과와 같음)</text></g></svg>