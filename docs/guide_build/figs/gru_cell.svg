<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>GRU 셀</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30.0" y="40.0" width="150.0" height="50.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="105.0" y="61.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">재설정 r = σ(0)</text><text x="105.0" y="75.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= 0.5000</text><rect x="30.0" y="130.0" width="150.0" height="50.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="105.0" y="151.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">갱신 z = σ(1)</text><text x="105.0" y="165.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= 0.7311</text><rect x="250.0" y="40.0" width="210.0" height="50.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="355.0" y="61.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">후보 n = tanh(0.6 + r×0.8)</text><text x="355.0" y="75.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= tanh(1.0) = 0.7616</text><rect x="250.0" y="130.0" width="210.0" height="50.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="355.0" y="158.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">지난 은닉 h = 0.2</text><rect x="520.0" y="80.0" width="170.0" height="60.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="605.0" y="99.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">새 h = (1−z)·n + z·h</text><text x="605.0" y="113.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= 0.2048 + 0.1462</text><text x="605.0" y="127.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= 0.3510</text><line x1="180.0" y1="65.0" x2="248.0" y2="65.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="460.0" y1="65.0" x2="518.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="460.0" y1="155.0" x2="518.0" y2="122.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="180.0" y1="155.0" x2="248.0" y2="155.0" stroke="#8f98a6" stroke-width="1" stroke-dasharray="4 3"/><text x="360.0" y="215.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">z 가 클수록 지난 기억을 많이 유지: 1 − z = 0.2689 만큼만 새 후보</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>