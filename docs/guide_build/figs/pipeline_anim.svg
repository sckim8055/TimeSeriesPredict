<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>결정일 하루의 흐름 (움직이는 그림)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="40.0" y1="300.0" x2="760.0" y2="300.0" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="294.0" x2="90.0" y2="306.0" stroke="#5b6372" stroke-width="1.2"/><text x="90.0" y="324.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">t-1</text><line x1="250.0" y1="294.0" x2="250.0" y2="306.0" stroke="#5b6372" stroke-width="1.2"/><text x="250.0" y="324.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">t</text><line x1="410.0" y1="294.0" x2="410.0" y2="306.0" stroke="#5b6372" stroke-width="1.2"/><text x="410.0" y="324.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">t+1</text><line x1="570.0" y1="294.0" x2="570.0" y2="306.0" stroke="#5b6372" stroke-width="1.2"/><text x="570.0" y="324.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">t+2</text><line x1="710.0" y1="294.0" x2="710.0" y2="306.0" stroke="#5b6372" stroke-width="1.2"/><text x="710.0" y="324.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">t+1+k</text><text x="40.0" y="346.0" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">거래일 → (일간 기준. 주간·월간은 같은 순서를 주·월 단위로)</text><g opacity="1"><rect x="20.0" y="20.0" width="220.0" height="60.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="130.0" y="46.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">① 원자료</text><text x="130.0" y="60.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">가격(종가·시가) · 변수(발표일이 각자 다름)</text></g><g opacity="1"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1182" values="0;1"/><rect x="20.0" y="96.0" width="220.0" height="66.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="130.0" y="118.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">② 발표시차 맞춤</text><text x="130.0" y="132.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">변수 값은 '실제로 알려진 날'부터 씀</text><text x="130.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">(변수 사전 lag_days 만큼 뒤로)</text><path d="M90,290 Q160,240 244,288" fill="none" stroke="#d6a63c" stroke-width="2" marker-end="url(#ah)"/><text x="160.0" y="252.0" font-size="10" fill="#d6a63c" text-anchor="middle" font-weight="normal">발표 → 알려진 날</text></g><g opacity="1"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2365" values="0;1"/><rect x="260.0" y="20.0" width="230.0" height="66.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="375.0" y="43.5" font-size="10" fill="#1c2027" text-anchor="middle" font-weight="bold">③ 결정일 t 의 한 행</text><text x="375.0" y="56.5" font-size="10" fill="#1c2027" text-anchor="middle" font-weight="normal">기술지표(t 종가까지) + 변수(t 까지 알려진 값)</text><text x="375.0" y="69.5" font-size="10" fill="#1c2027" text-anchor="middle" font-weight="normal">→ 학습 구간 통계로 눈금 맞춤(표준화·BIVA 는 0~1)</text><circle cx="250.0" cy="300.0" r="7" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="260.0" y="316.0" font-size="10" fill="#3b6fb6" text-anchor="start" font-weight="bold">장 마감 후 결정</text></g><g opacity="1"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3547" values="0;1"/><rect x="260.0" y="100.0" width="230.0" height="60.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="375.0" y="126.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">④ 모델 → 예측 ŷ</text><text x="375.0" y="140.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">(폴드의 학습 창으로 배운 모델)</text><rect x="510.0" y="20.0" width="250.0" height="60.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="635.0" y="46.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">⑤ 결정: ŷ &gt; 임계치 → 보유(1)</text><text x="635.0" y="60.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">분류면 확률 &gt; 0.5 + 임계치</text><line x1="490.0" y1="130.0" x2="508.0" y2="60.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4729" values="0;1"/><rect x="410.0" y="262.0" width="160.0" height="22.0" rx="2" fill="#2f8f5b" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="490.0" y="277.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">보유 1기간</text><circle cx="410.0" cy="300.0" r="7" fill="#d07a1a" stroke="#d07a1a" stroke-width="1.5"/><text x="410.0" y="250.0" font-size="10" fill="#d07a1a" text-anchor="middle" font-weight="bold">t+1 시가 체결</text><rect x="510.0" y="96.0" width="250.0" height="66.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="635.0" y="118.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">⑥ 매매 회계(엔진 backtest)</text><text x="635.0" y="132.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">수익 = 포지션 × (시가ₜ₊₂ ÷ 시가ₜ₊₁ − 1)</text><text x="635.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">− 포지션이 바뀔 때만 비용</text></g><g opacity="1"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5911" values="0;1"/><path d="M410,334 Q560.0,390 710,334" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)"/><text x="560.0" y="384.0" font-size="10" fill="#b3261e" text-anchor="middle" font-weight="bold">정답 y = 시가ₜ₊₁₊ₖ ÷ 시가ₜ₊₁ − 1 (모델이 맞히는 값)</text><rect x="260.0" y="176.0" width="500.0" height="50.0" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="1" /><text x="510.0" y="204.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">⑦ 채점: ŷ 와 y 비교(오차·DM) · 수익을 쌓아 성과(샤프·MDD) — 다음 날 t+1 이 새 결정일</text></g><g opacity="0"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1182" values="1;0"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">원자료: 가격과 변수. 변수마다 '언제 발표되나'가 다름</text></g><g opacity="0"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1182;0.2365" values="0;1;0"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">발표시차: 변수 값은 발표되어 알려진 날부터 씀(그 전 날짜에는 직전 값) — 미래 정보 누출 방지</text></g><g opacity="0"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2365;0.3547" values="0;1;0"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">결정일 t 장 마감 후, t 까지 알 수 있는 값만으로 한 행(창 모델은 최근 L 행)을 만들고 학습 구간 통계로 눈금을 맞춤</text></g><g opacity="0"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3547;0.4729" values="0;1;0"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">모델이 ŷ 를 내고 임계치와 비교해 보유/현금을 정함 (규칙 모델은 ③④ 없이 가격으로 바로 포지션)</text></g><g opacity="0"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4729;0.5911" values="0;1;0"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 5/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">체결은 다음 날(t+1) 시가. 엔진은 결정 하나로 1기간(t+1 → t+2 시가) 보유하고 매일 다시 판단</text></g><g opacity="0"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5911;0.7094" values="0;1;0"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 6/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">모델이 맞히는 정답은 t+1 시가 → t+1+k 시가 수익률. k &gt; 1 이면 정답 기간과 보유 기간이 다름(문서화된 한계)</text></g><g opacity="1"><animate attributeName="opacity" dur="20.30s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7094" values="0;1"/><text x="20.0" y="418.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 7/7</text><text x="86.0" y="418.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">예측과 정답으로 오차·검정을, 수익으로 성과를 계산하고 다음 날로</text></g></svg>