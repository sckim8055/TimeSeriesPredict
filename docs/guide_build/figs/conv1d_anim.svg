<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>Conv1d(커널 1): 같은 시점의 변수끼리 섞기 → 시간 평균 (움직이는 그림)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="205.0" y="32.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">시점 τ1</text><text x="315.0" y="32.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">시점 τ2</text><text x="425.0" y="32.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">시점 τ3</text><text x="140.0" y="62.0" font-size="11" fill="#1c2027" text-anchor="end" font-weight="normal">변수 1  (W = +0.5)</text><rect x="152.0" y="42.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="205.0" y="62.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.2</text><rect x="262.0" y="42.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="315.0" y="62.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.4</text><rect x="372.0" y="42.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="425.0" y="62.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.2</text><text x="140.0" y="96.0" font-size="11" fill="#1c2027" text-anchor="end" font-weight="normal">변수 2  (W = -1)</text><rect x="152.0" y="76.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="205.0" y="96.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.1</text><rect x="262.0" y="76.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="315.0" y="96.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.2</text><rect x="372.0" y="76.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="425.0" y="96.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.1</text><text x="140.0" y="130.0" font-size="11" fill="#1c2027" text-anchor="end" font-weight="normal">변수 3  (W = +2)</text><rect x="152.0" y="110.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="205.0" y="130.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.3</text><rect x="262.0" y="110.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="315.0" y="130.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.2</text><rect x="372.0" y="110.0" width="106.0" height="30.0" rx="3" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="425.0" y="130.0" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">0.4</text><text x="140.0" y="172.0" font-size="11" fill="#1c2027" text-anchor="end" font-weight="bold">섞은 값 a  (+ b 0.1)</text><g opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1885" values="1;0"/><rect x="150.0" y="39.0" width="110.0" height="104.0" rx="3" fill="none" stroke="#d07a1a" stroke-width="2.5" /></g><g opacity="1"><rect x="152.0" y="152.0" width="106.0" height="32.0" rx="3" fill="#fff3df" stroke="#d07a1a" stroke-width="1" /><text x="205.0" y="173.0" font-size="13" fill="#d07a1a" text-anchor="middle" font-weight="bold">0.700</text></g><g opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1885;0.3770" values="0;1;0"/><rect x="260.0" y="39.0" width="110.0" height="104.0" rx="3" fill="none" stroke="#d07a1a" stroke-width="2.5" /></g><g opacity="1"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1885" values="0;1"/><rect x="262.0" y="152.0" width="106.0" height="32.0" rx="3" fill="#fff3df" stroke="#d07a1a" stroke-width="1" /><text x="315.0" y="173.0" font-size="13" fill="#d07a1a" text-anchor="middle" font-weight="bold">0.500</text></g><g opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3770;0.5656" values="0;1;0"/><rect x="370.0" y="39.0" width="110.0" height="104.0" rx="3" fill="none" stroke="#d07a1a" stroke-width="2.5" /></g><g opacity="1"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3770" values="0;1"/><rect x="372.0" y="152.0" width="106.0" height="32.0" rx="3" fill="#fff3df" stroke="#d07a1a" stroke-width="1" /><text x="425.0" y="173.0" font-size="13" fill="#d07a1a" text-anchor="middle" font-weight="bold">0.900</text></g><g opacity="1"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5656" values="0;1"/><line x1="150.0" y1="232.0" x2="480.0" y2="232.0" stroke="#c9ced6" stroke-width="1"/><text x="315.0" y="256.0" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">시간 가중합(원본 초기값 1/3 씩, 학습되며 바뀜): (0.7 + 0.5 + 0.9) ÷ 3 = 0.700</text></g><text x="500.0" y="60.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="bold">원본 BIVA 의 추세 경로</text><text x="500.0" y="80.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">Conv1d 3단(변수 V → V/4 → V/16 → 1)</text><text x="500.0" y="96.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">모두 커널 1 = 시점끼리는 섞지 않음, 사이에 활성화 없음</text><text x="500.0" y="112.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">→ Linear(창 길이 L → 1) 로 시점들을 가중합</text><text x="500.0" y="128.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">주기 경로도 같은 모양(입력 = 인코더 출력 + z)</text><text x="500.0" y="150.0" font-size="10" fill="#8f98a6" text-anchor="start" font-weight="normal">이 그림은 1단(3 → 1)만 작게 보임</text><g opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1885" values="1;0"/><text x="20.0" y="304.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/4</text><text x="86.0" y="304.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">τ1: 0.1 + 0.5×0.2 − 1×0.1 + 2×0.3 = 0.700 (같은 W 를 시점마다 그대로)</text></g><g opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1885;0.3770" values="0;1;0"/><text x="20.0" y="304.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/4</text><text x="86.0" y="304.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">τ2: 0.1 + 0.5×0.4 − 1×0.2 + 2×0.2 = 0.500 (같은 W 를 시점마다 그대로)</text></g><g opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3770;0.5656" values="0;1;0"/><text x="20.0" y="304.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/4</text><text x="86.0" y="304.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">τ3: 0.1 + 0.5×0.2 − 1×0.1 + 2×0.4 = 0.900 (같은 W 를 시점마다 그대로)</text></g><g opacity="1"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5656" values="0;1"/><text x="20.0" y="304.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/4</text><text x="86.0" y="304.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">시점 3개를 가중합해 값 하나 0.700 — torch Conv1d·Linear 출력과 같음</text></g></svg>