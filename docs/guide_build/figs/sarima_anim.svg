ext><line x1="66.0" y1="216.7" x2="70.0" y2="216.7" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="216.7" x2="510.0" y2="216.7" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="220.7" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0</text><line x1="66.0" y1="183.3" x2="70.0" y2="183.3" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="183.3" x2="510.0" y2="183.3" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="187.3" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.01</text><line x1="66.0" y1="150.0" x2="70.0" y2="150.0" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="150.0" x2="510.0" y2="150.0" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="154.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.02</text><line x1="66.0" y1="116.7" x2="70.0" y2="116.7" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="116.7" x2="510.0" y2="116.7" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="120.7" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.03</text><text x="70.0" y="92.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">변화율</text><circle cx="106.7" cy="166.7" r="5" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="114.7" y="170.7" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">0.015</text><circle cx="167.8" cy="116.7" r="5" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="175.8" y="120.7" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">0.03</text><circle cx="228.9" cy="183.3" r="5" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="236.9" y="187.3" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">0.01</text><circle cx="290.0" cy="233.3" r="5" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="298.0" y="237.3" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">-0.005</text><circle cx="351.1" cy="190.0" r="5" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="359.1" y="194.0" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">0.008</text><circle cx="412.2" cy="150.0" r="5" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1.5"/><text x="420.2" y="154.0" font-size="10" fill="#5b6372" text-anchor="start" font-weight="normal">0.02</text><g opacity="1"><text x="20.0" y="26.0" font-size="14" fill="#1c2027" text-anchor="start" font-weight="bold">(1 − 0.5L)(1 − L⁴) = 1 − 0.5L − L⁴ + 0.5L⁵</text><text x="20.0" y="46.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">→ r(t+1) = 0.5·r(t) + 1·r(t−3) − 0.5·r(t−4) + ε   (L = 한 기간 전, L⁴ = 4기간 전)</text></g><rect x="540.0" y="96.0" width="205.0" height="150.0" rx="4" fill="#fafbfc" stroke="#c9ced6" stroke-width="1" /><text x="552.0" y="116.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="bold">다음 값 = 항목의 합</text><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571" values="0;1"/><circle cx="412.2" cy="150.0" r="9" fill="none" stroke="#d07a1a" stroke-width="2.5"/><path d="M412.2,140.0 Q442.8,62.0 473.3,188.0" fill="none" stroke="#d07a1a" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)"/><text x="552.0" y="142.0" font-size="12" fill="#d07a1a" text-anchor="start" font-weight="bold">+0.5 × r(t) 0.02 = +0.010</text></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3143" values="0;1"/><circle cx="228.9" cy="183.3" r="9" fill="none" stroke="#2f8f5b" stroke-width="2.5"/><path d="M228.9,173.3 Q351.1,70.0 473.3,188.0" fill="none" stroke="#2f8f5b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)"/><text x="552.0" y="166.0" font-size="12" fill="#2f8f5b" text-anchor="start" font-weight="bold">+1 × r(t−3) 0.01 = +0.010</text></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4714" values="0;1"/><circle cx="167.8" cy="116.7" r="9" fill="none" stroke="#b3261e" stroke-width="2.5"/><path d="M167.8,106.7 Q320.6,78.0 473.3,188.0" fill="none" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ah)"/><text x="552.0" y="190.0" font-size="12" fill="#b3261e" text-anchor="start" font-weight="bold">-0.5 × r(t−4) 0.03 = -0.015</text></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6286" values="0;1"/><circle cx="473.3" cy="200.0" r="7" fill="#d07a1a" stroke="#d07a1a" stroke-width="1.5"/><text x="473.3" y="222.0" font-size="12" fill="#d07a1a" text-anchor="middle" font-weight="bold">0.005</text><line x1="552.0" y1="210.0" x2="735.0" y2="210.0" stroke="#c9ced6" stroke-width="1"/><text x="552.0" y="232.0" font-size="14" fill="#d07a1a" text-anchor="start" font-weight="bold">합 = 0.005</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571" values="1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/5</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">두 괄호를 곱해 펼치면 '몇 기간 전 값에 얼마를 곱하나'의 목록이 됩니다 (s = 4, D = 1)</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571;0.3143" values="0;1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/5</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">1기간 전 r(t) = 0.02 에 0.5 를 곱함 → +0.010</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3143;0.4714" values="0;1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/5</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">4기간 전(작년 같은 철) r(t−3) = 0.01 에 1 을 곱함 → +0.010</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4714;0.6286" values="0;1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/5</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">5기간 전 r(t−4) = 0.03 에 −0.5 를 곱함 → −0.015</text></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6286" values="0;1"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 5/5</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">더하면 다음 기간 예측 0.005 — statsmodels SARIMAX 예측과 소수 8자리까지 같음 (나머지 칸은 계수 0)</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>