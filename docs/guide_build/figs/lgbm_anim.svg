<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>LightGBM 나무 하나 (움직이는 그림)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="70.0" y1="300.0" x2="670.0" y2="300.0" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="150.0" x2="70.0" y2="300.0" stroke="#5b6372" stroke-width="1.2"/><line x1="66.0" y1="300.0" x2="70.0" y2="300.0" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="300.0" x2="670.0" y2="300.0" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="304.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0</text><line x1="66.0" y1="262.5" x2="70.0" y2="262.5" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="262.5" x2="670.0" y2="262.5" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="266.5" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">2</text><line x1="66.0" y1="225.0" x2="70.0" y2="225.0" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="225.0" x2="670.0" y2="225.0" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="229.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">4</text><line x1="66.0" y1="187.5" x2="70.0" y2="187.5" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="187.5" x2="670.0" y2="187.5" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="191.5" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">6</text><line x1="66.0" y1="150.0" x2="70.0" y2="150.0" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="150.0" x2="670.0" y2="150.0" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="154.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">8</text><text x="70.0" y="142.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">정답·예측</text><circle cx="161.3" cy="281.2" r="5" fill="#1c2027" stroke="#1c2027" stroke-width="1.5"/><text x="161.3" y="318.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">1일  z = -1</text><text x="170.3" y="285.2" font-size="10" fill="#1c2027" text-anchor="start" font-weight="normal">y=1</text><circle cx="291.7" cy="262.5" r="5" fill="#1c2027" stroke="#1c2027" stroke-width="1.5"/><text x="291.7" y="318.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">2일  z = -0.5</text><text x="300.7" y="266.5" font-size="10" fill="#1c2027" text-anchor="start" font-weight="normal">y=2</text><circle cx="422.2" cy="187.5" r="5" fill="#1c2027" stroke="#1c2027" stroke-width="1.5"/><text x="422.2" y="318.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">3일  z = 0.5</text><text x="431.2" y="191.5" font-size="10" fill="#1c2027" text-anchor="start" font-weight="normal">y=6</text><circle cx="552.6" cy="168.8" r="5" fill="#1c2027" stroke="#1c2027" stroke-width="1.5"/><text x="552.6" y="318.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">4일  z = 1</text><text x="561.6" y="172.8" font-size="10" fill="#1c2027" text-anchor="start" font-weight="normal">y=7</text><g opacity="1"><line x1="139.3" y1="225.0" x2="183.3" y2="225.0" stroke="#8f98a6" stroke-width="3"/><line x1="269.7" y1="225.0" x2="313.7" y2="225.0" stroke="#8f98a6" stroke-width="3"/><line x1="400.2" y1="225.0" x2="444.2" y2="225.0" stroke="#8f98a6" stroke-width="3"/><line x1="530.6" y1="225.0" x2="574.6" y2="225.0" stroke="#8f98a6" stroke-width="3"/><text x="670.0" y="220.0" font-size="11" fill="#8f98a6" text-anchor="end" font-weight="normal">F₀ = 평균 4</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1196;0.4783" values="0;1;0"/><line x1="131.3" y1="225.0" x2="131.3" y2="281.2" stroke="#b3261e" stroke-width="1.5" marker-end="url(#ah)"/><text x="125.3" y="253.1" font-size="11" fill="#b3261e" text-anchor="end" font-weight="bold">g=+3</text><line x1="261.7" y1="225.0" x2="261.7" y2="262.5" stroke="#b3261e" stroke-width="1.5" marker-end="url(#ah)"/><text x="255.7" y="243.8" font-size="11" fill="#b3261e" text-anchor="end" font-weight="bold">g=+2</text><line x1="392.2" y1="225.0" x2="392.2" y2="187.5" stroke="#b3261e" stroke-width="1.5" marker-end="url(#ah)"/><text x="386.2" y="206.2" font-size="11" fill="#b3261e" text-anchor="end" font-weight="bold">g=-2</text><line x1="522.6" y1="225.0" x2="522.6" y2="168.8" stroke="#b3261e" stroke-width="1.5" marker-end="url(#ah)"/><text x="516.6" y="196.9" font-size="11" fill="#b3261e" text-anchor="end" font-weight="bold">g=-3</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2391;0.3587" values="0;1;0"/><line x1="226.5" y1="150.0" x2="226.5" y2="300.0" stroke="#d6a63c" stroke-width="2" stroke-dasharray="6 4"/><text x="230.5" y="162.0" font-size="11" fill="#d6a63c" text-anchor="start" font-weight="bold">z ≤ −1 ? 이득 6.75</text></g><g opacity="1"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3587" values="0;1"/><line x1="357.0" y1="150.0" x2="357.0" y2="300.0" stroke="#d07a1a" stroke-width="2.5" stroke-dasharray="6 4"/><text x="361.0" y="162.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">z ≤ 0 ? 이득 16.67 ← 가장 큼</text></g><g opacity="1"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3587" values="0;1"/><rect x="290.0" y="10.0" width="180.0" height="40.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="380.0" y="34.2" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">질문: z ≤ 0 ?</text><line x1="340.0" y1="50.0" x2="200.0" y2="82.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="420.0" y1="50.0" x2="560.0" y2="82.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="255.0" y="70.0" font-size="11" fill="#2f8f5b" text-anchor="start" font-weight="bold">예</text><text x="505.0" y="70.0" font-size="11" fill="#b3261e" text-anchor="start" font-weight="bold">아니오</text></g><g opacity="1"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4783" values="0;1"/><rect x="90.0" y="84.0" width="220.0" height="48.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="200.0" y="104.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">왼쪽 잎 (1·2일): G = 3 + 2 = 5</text><text x="200.0" y="118.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">잎 값 = −5 ÷ (2 + 1) = -1.667</text><rect x="450.0" y="84.0" width="220.0" height="48.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="560.0" y="104.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">오른쪽 잎 (3·4일): G = −5</text><text x="560.0" y="118.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">잎 값 = +5 ÷ (2 + 1) = +1.667</text></g><g opacity="1"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5978" values="0;1"/><line x1="139.3" y1="228.1" x2="183.3" y2="228.1" stroke="#d07a1a" stroke-width="3"/><text x="187.3" y="240.1" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">3.833</text><line x1="269.7" y1="228.1" x2="313.7" y2="228.1" stroke="#d07a1a" stroke-width="3"/><text x="317.7" y="240.1" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">3.833</text><line x1="400.2" y1="221.9" x2="444.2" y2="221.9" stroke="#d07a1a" stroke-width="3"/><text x="448.2" y="217.9" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">4.167</text><line x1="530.6" y1="221.9" x2="574.6" y2="221.9" stroke="#d07a1a" stroke-width="3"/><text x="578.6" y="217.9" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">4.167</text></g><g opacity="1"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7174" values="0;1"/><polygon points="396.08695652173907,212.875 404.08695652173907,227.875 388.08695652173907,227.875" fill="#3b6fb6"/><text x="396.1" y="140.0" font-size="11" fill="#3b6fb6" text-anchor="middle" font-weight="bold">새 날 z = 0.3 → 아니오 → 4.167</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1196" values="1;0"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">처음엔 모든 날을 평균 4 로 예측 (F₀)</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1196;0.2391" values="0;1;0"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">틀린 만큼 = 기울기 g = 예측 − 정답 (3, 2, −2, −3)</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2391;0.3587" values="0;1;0"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">질문 후보 'z ≤ −1 ?' → 나눴을 때의 이득 6.75</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3587;0.4783" values="0;1;0"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">질문 후보 'z ≤ 0 ?' → 이득 16.67 로 가장 큼 → 이 질문을 고름</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4783;0.5978" values="0;1;0"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 5/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">칸마다 잎 값 = −(기울기 합) ÷ (날 수 + λ 1)</text></g><g opacity="0"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5978;0.7174" values="0;1;0"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 6/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">학습률 0.1 을 곱해 더함 → 3.833 / 4.167 (실제 LightGBM 출력과 같음)</text></g><g opacity="1"><animate attributeName="opacity" dur="18.40s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7174" values="0;1"/><text x="20.0" y="344.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 7/7</text><text x="86.0" y="344.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">예측: 새 날 z = 0.3 은 '아니오' 쪽 잎 → 4.167. 나무가 여러 개면 잎 값을 차례로 더함</text></g></svg>