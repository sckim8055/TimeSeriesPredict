<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>합치기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20.0" y="30.0" width="170.0" height="46.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="105.0" y="49.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">주기 예측 0.3</text><text x="105.0" y="63.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">× α(0.8) = 0.24</text><rect x="20.0" y="110.0" width="170.0" height="46.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="105.0" y="129.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">추세 예측 −0.1</text><text x="105.0" y="143.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">× (1−α)(0.2) = −0.02</text><rect x="260.0" y="70.0" width="120.0" height="46.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="320.0" y="97.2" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">합 = 0.22</text><rect x="440.0" y="60.0" width="180.0" height="66.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="530.0" y="82.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">ŷ = 0.22 × 0.02</text><text x="530.0" y="96.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">+ 0.001</text><text x="530.0" y="110.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= 0.0054</text><line x1="190.0" y1="53.0" x2="258.0" y2="86.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="190.0" y1="133.0" x2="258.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="380.0" y1="93.0" x2="438.0" y2="93.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="320.0" y="190.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">α 는 1 에서 시작해 학습되며 0~1 로 제한되지 않음</text></svg>