<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>LSTM 셀</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="24.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">지난 기억 c = 0.5, 지난 은닉 h = 0, 입력 x = 1 일 때 (값은 문서 예시)</text><line x1="40.0" y1="70.0" x2="720.0" y2="70.0" stroke="#5b6372" stroke-width="2" marker-end="url(#ah)"/><text x="46.0" y="62.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="bold">기억 줄 c: 0.5</text><text x="700.0" y="62.0" font-size="12" fill="#2f8f5b" text-anchor="end" font-weight="bold">새 c = 0.6715</text><rect x="95.0" y="170.0" width="110.0" height="48.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="150.0" y="190.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">잊기 문 f</text><text x="150.0" y="204.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">σ(…) = 0.8808</text><rect x="245.0" y="170.0" width="110.0" height="48.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="300.0" y="190.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">입력 문 i</text><text x="300.0" y="204.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">σ(…) = 0.5000</text><rect x="375.0" y="170.0" width="110.0" height="48.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="430.0" y="190.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">후보 g</text><text x="430.0" y="204.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">tanh(…) = 0.4621</text><rect x="535.0" y="170.0" width="110.0" height="48.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="590.0" y="190.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">출력 문 o</text><text x="590.0" y="204.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">σ(…) = 0.7311</text><circle cx="150.0" cy="70.0" r="13" fill="1.5" stroke="#ffffff" stroke-width="1.5"/><text x="150.0" y="75.0" font-size="14" fill="#1c2027" text-anchor="middle" font-weight="bold">×</text><line x1="150.0" y1="168.0" x2="150.0" y2="84.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="160.0" y="110.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">0.5 × 0.8808 = 0.4404</text><circle cx="365.0" cy="70.0" r="13" fill="1.5" stroke="#ffffff" stroke-width="1.5"/><text x="365.0" y="75.0" font-size="14" fill="#1c2027" text-anchor="middle" font-weight="bold">+</text><circle cx="365.0" cy="130.0" r="11" fill="1.5" stroke="#ffffff" stroke-width="1.5"/><text x="365.0" y="135.0" font-size="13" fill="#1c2027" text-anchor="middle" font-weight="bold">×</text><line x1="300.0" y1="168.0" x2="360.0" y2="140.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="430.0" y1="168.0" x2="370.0" y2="140.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="365.0" y1="119.0" x2="365.0" y2="84.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="375.0" y="112.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">0.5 × 0.4621 = 0.2311</text><line x1="520.0" y1="70.0" x2="520.0" y2="118.0" stroke="#5b6372" stroke-width="1.2"/><rect x="480.0" y="118.0" width="80.0" height="26.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1" /><text x="520.0" y="134.5" font-size="10" fill="#1c2027" text-anchor="middle" font-weight="normal">tanh(c)=0.5859</text><circle cx="640.0" cy="131.0" r="11" fill="1.5" stroke="#ffffff" stroke-width="1.5"/><text x="640.0" y="136.0" font-size="13" fill="#1c2027" text-anchor="middle" font-weight="bold">×</text><line x1="560.0" y1="131.0" x2="627.0" y2="131.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="600.0" y1="168.0" x2="635.0" y2="142.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="651.0" y1="131.0" x2="720.0" y2="131.0" stroke="#2f8f5b" stroke-width="2" marker-end="url(#ah)"/><text x="722.0" y="150.0" font-size="13" fill="#2f8f5b" text-anchor="end" font-weight="bold">h = 0.4284</text><text x="380.0" y="250.0" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">c′ = f×c + i×g = 0.4404 + 0.2311 = 0.6715    h′ = o × tanh(c′) = 0.7311 × 0.5859 = 0.4284</text><text x="380.0" y="276.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">f 의 (…) = 1.5×x + 0.4×h + 0.5 = 2 (나머지 문도 같은 방식, 각자 다른 가중치)</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>