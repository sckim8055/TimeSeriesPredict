<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>Conv1d(커널 1)과 시간 가중합</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="22.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">한 시점 τ 에서: 변수 3개 → 1개</text><rect x="30.0" y="36.0" width="110.0" height="36.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="85.0" y="57.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">변수1 = 0.2</text><line x1="140.0" y1="54.0" x2="238.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="175.0" y="52.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">×0.5</text><rect x="30.0" y="82.0" width="110.0" height="36.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="85.0" y="103.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">변수2 = 0.1</text><line x1="140.0" y1="100.0" x2="238.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="175.0" y="106.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">×-1</text><rect x="30.0" y="128.0" width="110.0" height="36.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="85.0" y="149.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">변수3 = 0.3</text><line x1="140.0" y1="146.0" x2="238.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="175.0" y="152.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">×2</text><rect x="240.0" y="76.0" width="170.0" height="48.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="325.0" y="96.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">0.1 + 0.1 − 0.1 + 0.6</text><text x="325.0" y="110.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">= 0.7</text><text x="470.0" y="40.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">시점마다 반복 → 시간 가중합</text><rect x="450.0" y="76.0" width="66.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="483.0" y="99.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">τ1: 0.7</text><rect x="530.0" y="76.0" width="66.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="563.0" y="99.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">τ2: 0.5</text><rect x="610.0" y="76.0" width="66.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="643.0" y="99.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">τ3: 0.9</text><rect x="480.0" y="150.0" width="180.0" height="44.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="570.0" y="175.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">(0.7+0.5+0.9) × 1/3 = 0.7</text><line x1="570.0" y1="118.0" x2="570.0" y2="148.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="410.0" y1="100.0" x2="448.0" y2="96.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="240.0" y="205.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">커널 1 = 같은 시점끼리만 섞음(시점끼리는 안 섞음)</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>