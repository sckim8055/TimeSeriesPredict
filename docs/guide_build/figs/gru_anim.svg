<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>GRU 셀: 문 두 개 (움직이는 그림)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20.0" y="60.0" width="120.0" height="50.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="80.0" y="81.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">입력 x = 1</text><text x="80.0" y="95.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">(이번 시점 재료)</text><rect x="20.0" y="170.0" width="120.0" height="50.0" rx="4" fill="#e7eef8" stroke="#3b6fb6" stroke-width="1" /><text x="80.0" y="198.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">지난 기억 h = 0.2</text><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571" values="0;1"/><rect x="200.0" y="30.0" width="170.0" height="64.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="285.0" y="51.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">재설정 문 r</text><text x="285.0" y="65.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">σ(0) = 0.5000</text><text x="285.0" y="79.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">지난 기억을 얼마나 볼지</text><line x1="140.0" y1="85.0" x2="198.0" y2="62.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3143" values="0;1"/><rect x="200.0" y="130.0" width="170.0" height="64.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="285.0" y="151.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">갱신 문 z</text><text x="285.0" y="165.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">σ(1) = 0.7311</text><text x="285.0" y="179.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">새것 : 지난 것 = (1−z) : z</text><line x1="140.0" y1="195.0" x2="198.0" y2="162.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4714" values="0;1"/><rect x="400.0" y="80.0" width="200.0" height="64.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="500.0" y="101.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">새 후보 n</text><text x="500.0" y="115.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">tanh(0.6 + 0.5 × 0.8) = 0.7616</text><text x="500.0" y="129.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">입력 부분 0.6, 기억 부분 0.8</text><line x1="140.0" y1="85.0" x2="398.0" y2="112.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="370.0" y1="62.0" x2="398.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6286" values="0;1"/><text x="400.0" y="196.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="bold">새 기억 h′ = (1 − z) × n + z × h</text><rect x="400.0" y="206.0" width="80.7" height="30.0" rx="2" fill="#d07a1a" stroke="#d07a1a" stroke-width="1" /><rect x="480.7" y="206.0" width="219.3" height="30.0" rx="2" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1" /><text x="440.3" y="226.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">0.2689</text><text x="590.3" y="226.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">z 0.7311</text><text x="400.0" y="254.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="normal">0.2689 × 0.7616 = 0.2048  (새 후보 몫)</text><text x="400.0" y="270.0" font-size="11" fill="#3b6fb6" text-anchor="start" font-weight="normal">0.7311 × 0.2 = 0.1462  (지난 기억 몫)</text><text x="400.0" y="290.0" font-size="15" fill="#1c2027" text-anchor="start" font-weight="bold">h′ = 0.3510</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571" values="1;0"/><rect x="16" y="56" width="128" height="168" rx="6" fill="none" stroke="#d07a1a" stroke-width="2.5"/></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571" values="1;0"/><text x="20.0" y="318.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/5</text><text x="86.0" y="318.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">재료: 이번 입력 x 와 지난 기억 h (첫 시점이면 h = 0)</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1571;0.3143" values="0;1;0"/><text x="20.0" y="318.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/5</text><text x="86.0" y="318.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">재설정 문 r = σ(가중합) — 0 이면 지난 기억을 무시, 1 이면 그대로 봄</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3143;0.4714" values="0;1;0"/><text x="20.0" y="318.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/5</text><text x="86.0" y="318.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">갱신 문 z = σ(가중합) — 지난 기억을 얼마나 그대로 남길지</text></g><g opacity="0"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4714;0.6286" values="0;1;0"/><text x="20.0" y="318.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/5</text><text x="86.0" y="318.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">새 후보 n = tanh(입력 부분 + r × 기억 부분)</text></g><g opacity="1"><animate attributeName="opacity" dur="14.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6286" values="0;1"/><text x="20.0" y="318.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 5/5</text><text x="86.0" y="318.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">섞기: h′ = (1 − z)·n + z·h = 0.2048 + 0.1462 = 0.3510 (PyTorch GRUCell 과 같음)</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>