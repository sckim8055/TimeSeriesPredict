<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><title>Ridge 가중합이 쌓이는 순서 (움직이는 그림)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="90.0" y1="220.0" x2="690.0" y2="220.0" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="30.0" x2="90.0" y2="220.0" stroke="#5b6372" stroke-width="1.2"/><line x1="86.0" y1="220.0" x2="90.0" y2="220.0" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="220.0" x2="690.0" y2="220.0" stroke="#eef0f3" stroke-width="1"/><text x="83.0" y="224.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0</text><line x1="86.0" y1="172.5" x2="90.0" y2="172.5" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="172.5" x2="690.0" y2="172.5" stroke="#eef0f3" stroke-width="1"/><text x="83.0" y="176.5" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.04</text><line x1="86.0" y1="125.0" x2="90.0" y2="125.0" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="125.0" x2="690.0" y2="125.0" stroke="#eef0f3" stroke-width="1"/><text x="83.0" y="129.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.08</text><line x1="86.0" y1="77.5" x2="90.0" y2="77.5" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="77.5" x2="690.0" y2="77.5" stroke="#eef0f3" stroke-width="1"/><text x="83.0" y="81.5" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.12</text><line x1="86.0" y1="30.0" x2="90.0" y2="30.0" stroke="#5b6372" stroke-width="1.2"/><line x1="90.0" y1="30.0" x2="690.0" y2="30.0" stroke="#eef0f3" stroke-width="1"/><text x="83.0" y="34.0" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.16</text><text x="165.0" y="238.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">기본값 b</text><text x="315.0" y="238.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">재료 1 기여</text><text x="465.0" y="238.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">재료 2 기여</text><text x="615.0" y="238.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">예측 ŷ</text><g opacity="1"><rect x="120.0" y="160.6" width="90.0" height="59.4" rx="2" fill="#8f98a6" stroke="#8f98a6" stroke-width="1" /><text x="165.0" y="153.6" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">b = 0.05</text></g><g opacity="1"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1818" values="0;1"/><rect x="270.0" y="47.8" width="90.0" height="112.8" rx="2" fill="#2f8f5b" stroke="#2f8f5b" stroke-width="1" /><text x="315.0" y="40.8" font-size="12" fill="#2f8f5b" text-anchor="middle" font-weight="bold">0.95 × 0.1 = +0.095</text><line x1="210.0" y1="160.6" x2="270.0" y2="160.6" stroke="#8f98a6" stroke-width="1" stroke-dasharray="3 3"/></g><g opacity="1"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3636" values="0;1"/><rect x="420.0" y="47.8" width="90.0" height="47.5" rx="2" fill="#b3261e" stroke="#b3261e" stroke-width="1" /><text x="465.0" y="40.8" font-size="12" fill="#b3261e" text-anchor="middle" font-weight="bold">0.8 × (−0.05) = -0.04</text><line x1="360.0" y1="47.8" x2="420.0" y2="47.8" stroke="#8f98a6" stroke-width="1" stroke-dasharray="3 3"/></g><g opacity="1"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5455" values="0;1"/><rect x="570.0" y="95.3" width="90.0" height="124.7" rx="2" fill="#3b6fb6" stroke="#3b6fb6" stroke-width="1" /><text x="615.0" y="88.3" font-size="12" fill="#3b6fb6" text-anchor="middle" font-weight="bold">ŷ = 0.105</text><line x1="510.0" y1="95.3" x2="570.0" y2="95.3" stroke="#8f98a6" stroke-width="1" stroke-dasharray="3 3"/></g><g opacity="0"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1818" values="1;0"/><text x="20.0" y="272.0" font-size="12" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/4</text><text x="86.0" y="272.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="normal">기본값(절편) b = 0.05 에서 시작합니다</text></g><g opacity="0"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1818;0.3636" values="0;1;0"/><text x="20.0" y="272.0" font-size="12" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/4</text><text x="86.0" y="272.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="normal">재료 1: 칸 수 z₁ 0.95 × 비율 w₁ 0.1 = +0.095 → 위로 쌓음 (비율이 + 라 예측을 올림)</text></g><g opacity="0"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3636;0.5455" values="0;1;0"/><text x="20.0" y="272.0" font-size="12" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/4</text><text x="86.0" y="272.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="normal">재료 2: 칸 수 z₂ 0.8 × 비율 w₂ −0.05 = −0.04 → 아래로 (비율이 − 라 예측을 내림)</text></g><g opacity="1"><animate attributeName="opacity" dur="11.00s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5455" values="0;1"/><text x="20.0" y="272.0" font-size="12" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/4</text><text x="86.0" y="272.0" font-size="12" fill="#1c2027" text-anchor="start" font-weight="normal">예측 ŷ = 0.05 + 0.095 − 0.04 = 0.105 — 재료가 18개면 막대가 18개 쌓일 뿐 방법은 같습니다</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>