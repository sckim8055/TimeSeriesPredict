<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>BIVA 네 단계 (움직이는 그림)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g opacity="1"><rect x="10.0" y="160.0" width="120.0" height="70.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="70.0" y="184.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">입력 창 [L × V]</text><text x="70.0" y="198.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">눈금 0~1 (학습 구간)</text><text x="70.0" y="212.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">빈 칸 = NaN</text></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1164" values="0;1"/><rect x="160.0" y="160.0" width="120.0" height="70.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="220.0" y="184.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">Stage 1 BRITS</text><text x="220.0" y="198.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">앞→뒤 + 뒤→앞</text><text x="220.0" y="212.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">빈 칸만 채움</text><line x1="130.0" y1="195.0" x2="158.0" y2="195.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2328" values="0;1"/><rect x="310.0" y="160.0" width="120.0" height="70.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="370.0" y="184.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">Stage 2 분해</text><text x="370.0" y="198.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">이동평균(기본 6)</text><text x="370.0" y="212.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">추세 / 주기</text><line x1="280.0" y1="195.0" x2="308.0" y2="195.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3492" values="0;1"/><rect x="470.0" y="60.0" width="150.0" height="76.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="545.0" y="87.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">추세 [L × V]</text><text x="545.0" y="101.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">Conv1d V→V/4→V/16→1</text><text x="545.0" y="115.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">(커널 1, 시점끼리 안 섞음)</text><rect x="650.0" y="60.0" width="120.0" height="76.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="710.0" y="87.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">Linear L → 1</text><text x="710.0" y="101.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">(시간 가중합)</text><text x="710.0" y="115.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">→ 추세 예측</text><line x1="430.0" y1="180.0" x2="468.0" y2="100.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="620.0" y1="98.0" x2="648.0" y2="98.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4656" values="0;1"/><rect x="470.0" y="250.0" width="150.0" height="76.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="545.0" y="277.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">주기 [L × V]</text><text x="545.0" y="291.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">LSTM-VAE 인코더 4층</text><text x="545.0" y="305.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">→ μ, log σ² (ReLU) [L × 4]</text><rect x="470.0" y="336.0" width="150.0" height="50.0" rx="4" fill="#e7eef8" stroke="#3b6fb6" stroke-width="1" /><text x="545.0" y="357.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">z = μ + ε·σ  [L × 4]</text><text x="545.0" y="371.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">(예측 때도 뽑음)</text><rect x="650.0" y="250.0" width="120.0" height="76.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="710.0" y="277.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">[인코더 출력, z] 2×4</text><text x="710.0" y="291.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">Conv1d →4→2→1</text><text x="710.0" y="305.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">Linear L → 1</text><line x1="430.0" y1="210.0" x2="468.0" y2="288.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="620.0" y1="288.0" x2="648.0" y2="288.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="545.0" y1="326.0" x2="545.0" y2="334.0" stroke="#3b6fb6" stroke-width="1.2"/></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5820" values="0;1"/><rect x="560.0" y="160.0" width="210.0" height="60.0" rx="4" fill="#e3f3f0" stroke="#2f8f5b" stroke-width="1" /><text x="665.0" y="179.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">Stage 4 합치기</text><text x="665.0" y="193.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">α·주기 예측 + (1 − α)·추세 예측</text><text x="665.0" y="207.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">→ 원래 단위로 되돌림 → ŷ</text><line x1="710.0" y1="136.0" x2="690.0" y2="158.0" stroke="#2f8f5b" stroke-width="1.5" marker-end="url(#ah)"/><line x1="710.0" y1="250.0" x2="690.0" y2="222.0" stroke="#2f8f5b" stroke-width="1.5" marker-end="url(#ah)"/></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6984" values="0;1"/><rect x="10.0" y="20.0" width="440.0" height="110.0" rx="4" fill="#fbe9e7" stroke="#b3261e" stroke-width="1" /><text x="22.0" y="42.0" font-size="11" fill="#b3261e" text-anchor="start" font-weight="bold">학습할 때의 손실 (한 번에 더해 가중치를 고침, 따로 가중치 없음 — 원본)</text><text x="22.0" y="64.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">① 예측 오차 MSE(ŷ, 정답)</text><text x="22.0" y="82.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">② BRITS 손실(관측 칸을 되살리는 오차 + 두 방향 일관성)</text><text x="22.0" y="100.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">③ VAE 손실 = 0.5·재구성 MSE + 0.5·KLD</text><text x="22.0" y="118.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">→ Adam, 조기종료(검증 손실), 학습률 일정, 가장 좋았던 가중치로 복원</text></g><g opacity="0"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1164" values="1;0"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">창: 최근 L 개 시점 × V 개 변수. 아직 시작 전인 변수의 칸은 비워 둠</text></g><g opacity="0"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1164;0.2328" values="0;1;0"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">Stage 1: BRITS 가 두 방향으로 읽으며 빈 칸만 채움(관측 칸은 그대로)</text></g><g opacity="0"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2328;0.3492" values="0;1;0"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">Stage 2: 변수마다 이동평균 = 추세, 원래 − 추세 = 주기</text></g><g opacity="0"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3492;0.4656" values="0;1;0"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">추세 경로: 변수를 섞어 줄이고(Conv1d) 시점을 가중합 → 추세 예측 하나</text></g><g opacity="0"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4656;0.5820" values="0;1;0"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 5/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">주기 경로: LSTM-VAE 로 공통요인 z(4개)를 뽑고 인코더 출력과 이어 붙여 → 주기 예측 하나</text></g><g opacity="0"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5820;0.6984" values="0;1;0"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 6/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">Stage 4: 학습된 α 로 두 예측을 합쳐 ŷ (α 는 0~1 로 제한되지 않음)</text></g><g opacity="1"><animate attributeName="opacity" dur="18.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6984" values="0;1"/><text x="20.0" y="408.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 7/7</text><text x="86.0" y="408.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">학습: 세 손실의 합을 줄이도록 모든 가중치를 함께 고침 — 숫자는 원본 BIVA.py 구조 그대로</text></g></svg>