<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>SARIMA 펼치기</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="26.0" font-size="13" fill="#1c2027" text-anchor="start" font-weight="bold">(1 − 0.5L)(1 − L⁴) = 1 − 0.5L − L⁴ + 0.5L⁵  →  r̂(t+1) = 0.5·r(t) + 1·r(t−3) − 0.5·r(t−4)</text><rect x="30.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="70.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">t−4</text><text x="70.0" y="160.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">0.03</text><rect x="140.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="180.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">t−3</text><text x="180.0" y="160.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">0.01</text><rect x="250.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="290.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">t−2</text><text x="290.0" y="160.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal"></text><rect x="360.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="400.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">t−1</text><text x="400.0" y="160.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal"></text><rect x="470.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="510.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">t</text><text x="510.0" y="160.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">0.02</text><rect x="580.0" y="130.0" width="80.0" height="40.0" rx="4" fill="#e3f3f0" stroke="#c9ced6" stroke-width="1" /><text x="620.0" y="146.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">t+1</text><text x="620.0" y="160.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">0.005</text><path d="M510,128 Q565.0,50.833333333333336 614,128" fill="none" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#ah)"/><text x="516.0" y="112.0" font-size="12" fill="#3b6fb6" text-anchor="start" font-weight="bold">× +0.5</text><path d="M180,128 Q400.0,23.333333333333336 614,128" fill="none" stroke="#3b6fb6" stroke-width="1.6" marker-end="url(#ah)"/><text x="186.0" y="112.0" font-size="12" fill="#3b6fb6" text-anchor="start" font-weight="bold">× +1</text><path d="M70,128 Q345.0,14.166666666666664 614,128" fill="none" stroke="#b3261e" stroke-width="1.6" marker-end="url(#ah)"/><text x="76.0" y="112.0" font-size="12" fill="#b3261e" text-anchor="start" font-weight="bold">× −0.5</text><text x="360.0" y="205.0" font-size="13" fill="#1c2027" text-anchor="middle" font-weight="bold">0.5 × 0.02 + 1 × 0.01 − 0.5 × 0.03 = 0.005</text></svg>