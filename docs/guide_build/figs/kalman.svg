<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>칼만 필터</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40.0" y="80.0" width="140.0" height="56.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="110.0" y="104.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">상태 a</text><text x="110.0" y="119.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="normal">(지난 값·충격)</text><rect x="240.0" y="20.0" width="170.0" height="56.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="325.0" y="44.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">예측 = Z·(T·a + c)</text><text x="325.0" y="58.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">다음 값을 미리 계산</text><rect x="240.0" y="140.0" width="170.0" height="56.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="325.0" y="164.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">실제 값이 들어옴</text><text x="325.0" y="178.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">오차 = 실제 − 예측</text><rect x="470.0" y="80.0" width="210.0" height="56.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="575.0" y="104.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">상태 고치기</text><text x="575.0" y="119.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="normal">a ← a + K·오차</text><line x1="180.0" y1="100.0" x2="238.0" y2="54.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="325.0" y1="76.0" x2="325.0" y2="138.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="410.0" y1="168.0" x2="468.0" y2="120.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="470.0" y1="108.0" x2="182.0" y2="108.0" stroke="#8f98a6" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="325.0" y="222.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">결정일까지 반복 → 그 뒤(미래)는 실제 값이 없어 '예측 → 다음 상태'만 반복</text></svg>