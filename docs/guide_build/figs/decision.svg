<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>결정</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30.0" y="70.0" width="150.0" height="50.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="105.0" y="99.2" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">예측 ŷ = 0.0016</text><polygon points="260,95 340,55 420,95 340,135" fill="#fdf6e3" stroke="#d6a63c"/><text x="340.0" y="92.0" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">ŷ &gt; 임계치(0)?</text><text x="340.0" y="108.0" font-size="10" fill="#5b6372" text-anchor="middle" font-weight="normal">확률이면 &gt; 0.5+임계치</text><line x1="180.0" y1="95.0" x2="258.0" y2="95.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><rect x="500.0" y="30.0" width="190.0" height="52.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="595.0" y="52.9" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">예 → 보유(1)</text><text x="595.0" y="66.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">다음 날 시가에 사거나 유지</text><rect x="500.0" y="112.0" width="190.0" height="52.0" rx="4" fill="#f3f4f6" stroke="#8f98a6" stroke-width="1" /><text x="595.0" y="134.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="bold">아니오 → 현금(0)</text><text x="595.0" y="148.8" font-size="11" fill="#1c2027" text-anchor="middle" font-weight="normal">다음 날 시가에 팔거나 유지</text><line x1="420.0" y1="90.0" x2="498.0" y2="58.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="420.0" y1="100.0" x2="498.0" y2="136.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="360.0" y="182.0" font-size="11" fill="#5b6372" text-anchor="middle" font-weight="normal">포지션이 바뀌는 날만 비용: 100만 원 × (0.015% + 0.05%) = 650원</text></svg>