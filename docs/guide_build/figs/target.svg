<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>정답(타겟)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6372"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40.0" y="40.0" width="180.0" height="64.0" rx="4" fill="#eef3f9" stroke="#c9ced6" stroke-width="1" /><text x="130.0" y="61.2" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">결정일 t</text><text x="130.0" y="76.2" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="normal">장 마감 후 판단</text><text x="130.0" y="91.2" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="normal">(종가에는 못 삼)</text><rect x="270.0" y="40.0" width="180.0" height="64.0" rx="4" fill="#fdf6e3" stroke="#d6a63c" stroke-width="1" /><text x="360.0" y="68.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">t+1 시가 100</text><text x="360.0" y="83.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="normal">산다(진입)</text><rect x="500.0" y="40.0" width="180.0" height="64.0" rx="4" fill="#e3f3f0" stroke="#7fb894" stroke-width="1" /><text x="590.0" y="68.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="bold">t+1+k 시가 103</text><text x="590.0" y="83.7" font-size="12" fill="#1c2027" text-anchor="middle" font-weight="normal">판다(청산), k = 1</text><line x1="220.0" y1="72.0" x2="268.0" y2="72.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><line x1="450.0" y1="72.0" x2="498.0" y2="72.0" stroke="#5b6372" stroke-width="1.2" marker-end="url(#ah)"/><text x="360.0" y="140.0" font-size="13" fill="#1c2027" text-anchor="middle" font-weight="bold">정답 r = 103 ÷ 100 − 1 = 0.03 (3%) · 로그 ln(1.03) = 0.02956 · 방향 = 1(오름)</text></svg>