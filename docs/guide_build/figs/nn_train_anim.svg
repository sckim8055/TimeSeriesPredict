.2"/><line x1="70.0" y1="124.3" x2="670.0" y2="124.3" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="128.3" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">0.9</text><line x1="66.0" y1="61.4" x2="70.0" y2="61.4" stroke="#5b6372" stroke-width="1.2"/><line x1="70.0" y1="61.4" x2="670.0" y2="61.4" stroke="#eef0f3" stroke-width="1"/><text x="63.0" y="65.4" font-size="11" fill="#5b6372" text-anchor="end" font-weight="normal">1.1</text><text x="370.0" y="282.0" font-size="12" fill="#5b6372" text-anchor="middle" font-weight="normal">epoch (전체 학습 자료를 한 바퀴 본 횟수)</text><text x="70.0" y="22.0" font-size="12" fill="#5b6372" text-anchor="start" font-weight="normal">손실 (표준화한 정답 기준 MSE)</text><clipPath id="rv1_64465"><rect x="70.0" y="20.0" width="610.0" height="240.0"><animate attributeName="width" dur="13.90s" repeatCount="indefinite" keyTimes="0;0.0000;0.3741;1" values="0;0;610.0;610.0"/></rect></clipPath><g clip-path="url(#rv1_64465)"><polyline points="70.0,92.8 87.1,107.0 104.3,119.4 121.4,133.6 138.6,150.6 155.7,167.4 172.9,184.7 190.0,196.2 207.1,203.3 224.3,208.3 241.4,214.0 258.6,218.3 275.7,220.6 292.9,223.5 310.0,224.6 327.1,226.9 344.3,228.0 361.4,229.8 378.6,230.4 395.7,231.6 412.9,232.2 430.0,233.1 447.1,234.4 464.3,233.1 481.4,235.0 498.6,236.9 515.7,237.6 532.9,236.5 550.0,239.4 567.1,239.7 584.3,240.3 601.4,241.5 618.6,242.6 635.7,243.4 652.9,244.8 670.0,246.0" fill="none" stroke="#3b6fb6" stroke-width="2"/><polyline points="70.0,42.2 87.1,64.5 104.3,88.2 121.4,114.5 138.6,140.4 155.7,167.6 172.9,188.9 190.0,202.0 207.1,207.8 224.3,206.6 241.4,204.8 258.6,204.2 275.7,204.6 292.9,206.6 310.0,209.2 327.1,207.6 344.3,207.1 361.4,208.1 378.6,210.2 395.7,209.9 412.9,209.1 430.0,211.2 447.1,210.1 464.3,212.4 481.4,207.2 498.6,208.5 515.7,209.8 532.9,211.3 550.0,208.5 567.1,203.8 584.3,209.0 601.4,209.0 618.6,201.9 635.7,206.5 652.9,208.6 670.0,207.5" fill="none" stroke="#d07a1a" stroke-width="2"/></g><g opacity="1"><animate attributeName="opacity" dur="13.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3741" values="0;1"/><line x1="464.3" y1="30.0" x2="464.3" y2="250.0" stroke="#2f8f5b" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="464.3" cy="212.4" r="7" fill="#2f8f5b" stroke="#2f8f5b" stroke-width="1.5"/><text x="470.3" y="44.0" font-size="11" fill="#2f8f5b" text-anchor="start" font-weight="bold">검증 손실 최저: epoch 24 (0.620)</text></g><g opacity="1"><animate attributeName="opacity" dur="13.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5612" values="0;1"/><line x1="670.0" y1="30.0" x2="670.0" y2="250.0" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="2 3"/><text x="666.0" y="64.0" font-size="11" fill="#b3261e" text-anchor="end" font-weight="bold">epoch 36: 12번 연속 나아지지 않아 멈춤</text><text x="666.0" y="80.0" font-size="11" fill="#b3261e" text-anchor="end" font-weight="normal">→ epoch 24 의 가중치로 되돌림</text></g><line x1="330.0" y1="16.0" x2="350.0" y2="16.0" stroke="#3b6fb6" stroke-width="2"/><text x="356.0" y="20.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">학습 손실(배치 평균)</text><line x1="480.0" y1="16.0" x2="500.0" y2="16.0" stroke="#d07a1a" stroke-width="2"/><text x="506.0" y="20.0" font-size="11" fill="#5b6372" text-anchor="start" font-weight="normal">검증 손실</text><g opacity="0"><animate attributeName="opacity" dur="13.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1871" values="1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 1/4</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">epoch 마다 학습 자료를 섞어 32개씩 넣고 가중치를 고침(Adam) → 학습 손실(파랑)이 내려감</text></g><g opacity="0"><animate attributeName="opacity" dur="13.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1871;0.3741" values="0;1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 2/4</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">검증 손실(주황)은 학습에 쓰지 않은 자료 — 어느 순간부터 더 나아지지 않음(외우기 시작)</text></g><g opacity="0"><animate attributeName="opacity" dur="13.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3741;0.5612" values="0;1;0"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/4</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">검증 손실이 가장 낮았던 epoch 24 를 기억</text></g><g opacity="1"><animate attributeName="opacity" dur="13.90s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5612" values="0;1"/><text x="20.0" y="312.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/4</text><text x="86.0" y="312.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">12번 연속 개선이 없으면 멈추고 epoch 24 의 가중치로 되돌림 — models/lstm.py 를 실제로 돌린 기록</text></g></svg>