1a" text-anchor="start" font-weight="bold">단계 2/4</text><text x="86.0" y="360.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">RSI &lt; 30(많이 내림) → 사기로 결정 → 다음 날 시가에 삼</text></g><g opacity="0"><animate attributeName="opacity" dur="13.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3664;0.5496" values="0;1;0"/><text x="20.0" y="360.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 3/4</text><text x="86.0" y="360.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">RSI &gt; 70(많이 오름) → 팔기로 결정. 30~70 사이는 어제 상태 유지</text></g><g opacity="1"><animate attributeName="opacity" dur="13.10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5496" values="0;1"/><text x="20.0" y="360.0" font-size="11" fill="#d07a1a" text-anchor="start" font-weight="bold">단계 4/4</text><text x="86.0" y="360.0" font-size="11" fill="#1c2027" text-anchor="start" font-weight="normal">models/rsi_rule.py 의 positions 출력 그대로(창 6, 문턱 30·70)</text></g></svg>