<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규칙 모델 · 백테스트 코드 따라가기 — 실제로 계산되는 순서</title>
<style>
:root{--ink:#1c2027;--ink2:#5b6372;--line:#d9dde4;--line2:#eceff3;--bg:#f3f4f6;--panel:#fff;--accent:#23466e;--acc-bg:#e8eef7;
--data:#3b6fb6;--model:#c8710f;--good:#2f8f5b;--bad:#b3261e;--warm:#fdf6e3;--warmline:#d6a63c;--code-bg:#fbfbfc;--hl:#fff1d6;--hl-line:#e3a33b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-feature-settings:"tnum" 1}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;min-height:720px}
header{display:flex;align-items:center;gap:18px;padding:10px 18px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
header .chap{font-size:15px;color:var(--accent);font-weight:600;white-space:nowrap}
header .cnt{font-size:13px;color:var(--ink2);white-space:nowrap}
#prog{flex:1;height:10px;background:var(--line2);border-radius:5px;position:relative;cursor:pointer;min-width:200px}
#prog .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
#prog .tick{position:absolute;top:-3px;width:2px;height:16px;background:#9aa3b2}
#diagram{background:var(--panel);border-bottom:1px solid var(--line);padding:4px 10px 2px}
#diagram svg{width:100%;height:auto;display:block}
.node rect{fill:#f7f8fa;stroke:#c9ced6;stroke-width:1.2;rx:6}
.node text{font-size:12.5px;fill:var(--ink2);text-anchor:middle;dominant-baseline:middle}
.node .sub{font-size:10.5px;fill:#8a93a3}
.node.grp rect{fill:none;stroke:#b8c2d3;stroke-dasharray:5 4}
.node.grp text{font-size:12px;fill:#7a8597;text-anchor:start;font-weight:600}
.node.on rect{fill:#fff3df;stroke:var(--model);stroke-width:2.6}
.node.on text{fill:var(--ink);font-weight:700}
.node.done rect{fill:#eef5ef;stroke:#9fc7ad}
.edge{stroke:#b6bdc8;stroke-width:1.5;fill:none}
.edge.on{stroke:var(--model);stroke-width:2.6;stroke-dasharray:7 5;animation:flow 0.9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
main{display:grid;grid-template-columns:57% 43%;min-height:0}
#tensors{overflow:auto;padding:12px 14px;border-right:1px solid var(--line);background:var(--panel)}
#codep{display:flex;flex-direction:column;min-height:0;background:var(--code-bg)}
.crumb{font-size:12.5px;color:var(--ink2);padding:8px 12px 6px;border-bottom:1px solid var(--line);line-height:1.55}
.crumb b{color:var(--accent)}
.crumb .sep{color:#b0b7c3;margin:0 4px}
.fileh{font:600 13px "D2Coding","Consolas","Menlo",monospace;padding:6px 12px;background:#eef1f5;color:var(--ink);border-bottom:1px solid var(--line)}
pre.code{position:relative;margin:0;padding:6px 0;font:13.5px/1.55 "D2Coding","Consolas","Menlo",monospace;overflow:auto;flex:1;tab-size:4}
pre.code .ln{display:block;padding:0 12px 0 0;white-space:pre}
pre.code .ln .no{display:inline-block;width:48px;text-align:right;color:#a3abb8;margin-right:12px;user-select:none}
pre.code .ln.hl{background:var(--hl);box-shadow:inset 4px 0 0 var(--hl-line)}
pre.code .ln.focus{background:#ffe2b0}
pre.code .ln.dim{color:#9aa3b2}
pre.code .ln.gap{color:#8a93a3;background:#f0f2f5;font-size:12px;padding:2px 0}
.tz{margin-bottom:14px}
.tz h3{font-size:14px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tz h3 .shape{font:600 12.5px "D2Coding","Consolas",monospace;color:var(--model);background:#fff3df;border-radius:4px;padding:1px 6px}
.tz h3 .note{font-size:12px;color:var(--ink2);font-weight:400}
.tz canvas{display:block;max-width:100%}
.tz .big{font-size:30px;font-weight:700;color:var(--accent)}
.tz table.t{border-collapse:collapse;font-size:13px}
.tz table.t th,.tz table.t td{border-bottom:1px solid var(--line2);padding:3px 9px;text-align:left;white-space:nowrap}
.tz table.t td.n{text-align:right;font-family:"D2Coding","Consolas",monospace;font-size:12.5px}
.tz table.t th{color:var(--ink2);font-weight:600;background:#f7f8fa}
.tz table.t td:first-child,.tz table.t th:first-child{text-align:left}
.tz table.t tr.hl td{background:#fff3df;font-weight:600}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 18px 10px;display:grid;grid-template-columns:1fr auto;gap:8px 18px}
#narr{font-size:18px;line-height:1.6;max-width:1500px}
#formula{font:15px/1.5 "D2Coding","Consolas",monospace;color:#3a2a0a;background:var(--warm);border:1px solid #efd9a4;border-radius:5px;padding:6px 10px;margin-top:6px;white-space:pre-wrap}
#formula:empty{display:none}
details#hint{margin-top:6px;font-size:14px;color:var(--ink2)}
details#hint summary{cursor:pointer;color:var(--accent);font-weight:600}
details#hint div{margin-top:4px;line-height:1.6;white-space:pre-wrap}
#checks{font-size:12.5px;color:var(--good);margin-top:4px}
#checks.bad{color:var(--bad)}
.ctrl{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ctrl .row{display:flex;gap:6px;align-items:center}
.ctrl button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 11px;cursor:pointer}
.ctrl button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrl select{font:inherit;font-size:13px;padding:4px}
.ctrl label{font-size:13px;color:var(--ink2);display:flex;gap:4px;align-items:center}
#tip{position:fixed;pointer-events:none;background:#1c2027;color:#fff;font-size:12px;padding:4px 7px;border-radius:4px;display:none;z-index:9;white-space:pre}
body.film footer .ctrl{display:none}
body.film footer{grid-template-columns:1fr}
body.film details#hint[open] div{display:block}
pre.code .ln.note{white-space:pre-wrap;font:13px/1.45 "Pretendard Variable",Pretendard,"Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#3f4a5a;background:#f1f4f8;padding:2px 12px 3px 66px;border-left:4px solid #9fb3cf;margin:1px 0 3px}
pre.code .ln.note::before{content:"↳ ";color:#7f93b0}
#cap{display:none;font-size:25px;line-height:1.5;font-weight:600;color:var(--ink);background:#fffaf0;border-left:6px solid var(--model);padding:9px 16px;border-radius:4px;max-width:1700px;min-height:56px}
body.cap #cap{display:block}
body.cap #narr{display:none}
details.lab{border:1px solid #cfd8e6;border-radius:6px;background:#f7f9fc;padding:8px 12px;margin:4px 0 14px}
details.lab summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent)}
details.lab summary .k{font-weight:400;color:var(--ink2);font-size:12.5px;margin-left:6px}
details.lab .desc{font-size:13px;color:var(--ink2);margin:6px 0}
details.lab pre{font:12.5px/1.45 "D2Coding","Consolas",monospace;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:0;max-height:300px;overflow:auto;white-space:pre}
details.lab .outh{font-size:12.5px;color:var(--ink2);margin:8px 0 2px}
details.lab .out{font:12.5px/1.45 "D2Coding","Consolas",monospace;background:#eef5ef;border:1px solid #cfe3d5;border-radius:4px;padding:6px 10px;white-space:pre;margin:0}
details.lab .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
details.lab button,details.lab a.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--ink);text-decoration:none}
details.lab a.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
details.lab .row .note{font-size:12px;color:var(--ink2)}
</style>
</head>

업. LightGBM A 는 그 635행에서 뒤 15%(95행)를 검증으로 떼고 그 앞 2행을 비워 538행으로 학습합니다. 폴드는 756행부터 21행씩 봉인 전날까지 149개이고, 마지막 폴드는 남은 8일입니다. 경계 주의: 평가 구간 끝의 결정일 2개는 보유수익 계산에 봉인 구간(2025-01-01~)의 시가를 씁니다(엔진은 결정일만 봉인 전으로 자릅니다) — 2024-12-27 → 체결 2024-12-30·청산 2025-01-02 시가, 전략 포지션 0, B&H 보유수익 -0.28%; 2024-12-30 → 체결 2025-01-02·청산 2025-01-03 시가, 전략 포지션 0, B&H 보유수익 +2.01%. 이 날들의 전략 순수익에는 영향이 없지만(포지션 0), B&H 보유수익은 비교 기준·초과수익에 들어갑니다.","checks":[{"what":"남은 신호 = 원자료 손 계산 신호를 반복문 평가 구간으로 자른 것 (차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"첫·마지막 신호일 = 평가 구간 끝점 (차이 0.0e+00)","ok":true,"kind":"식"},{"what":"처음 756일 = 워밍업 + 평가 전, 날짜 수 합 = 전체 (차이 0.0e+00)","ok":true,"kind":"식"},{"what":"692행이 지우는 날 = 앞 697 + 뒤 445, 731행이 규칙 모델에서 더 지우는 날 = 0 (차이 0.0e+00)","ok":true,"kind":"식"},{"what":"폴드 반복문(엔진 함수 없이 756행부터 21행씩, 봉인 전까지): 폴드 149개·첫 폴드 테스트 21일·마지막 폴드 테스트 8일과 그 날짜 = Ridge A 결과 파일(04_ridge_A_v1107_6e2191440f16) n_folds·periods, 평가 구간 = 이 결과 파일 evaluation_period·엔진 _eval_window (차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"반복문 첫 폴드 학습 창(비운 뒤)의 끝날 = Ridge A 첫 폴드 학습 끝날, 비우는 행 2 = 결과 파일 periods.embargo, 반복문 마지막 폴드 창 754행 = Ridge A 마지막 폴드 학습 행 = LightGBM A 마지막 폴드 학습 + 검증 + 비움 (차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"실제 학습 행(결과 파일): Ridge A 635 = 754 − 앞 119행(이동평균 창 120 − 1, 중간 빠짐 없음), LightGBM A 학습 538 + 검증 95 + 비움 2 = 635, 검증 95 = ⌊635 × 0.15⌋ (차이 0.0e+00)","ok":true,"kind":"독립"}],"lab":null,"captions":["규칙 모델은 첫날부터 신호를 낼 수 있지만, 학습 모델과 공정하게 비교하려면 같은 날짜로 성적을 매겨야 합니다.","학습 모델의 첫 폴드는 처음 756거래일을 학습 창으로 쓰되, 끝의 두 거래일을 비운 뒤, 그다음 날부터 예측합니다.","검증을 쓰는 모델은 검증 몫만큼, 그리고 특히 앞쪽 폴드에서는 변수의 결측만큼,","실제로 학습에 쓰는 행이 학습 창보다 적습니다.","규칙 모델의 평가 구간은 첫 폴드의 테스트 시작일 2012-05-02부터 마지막 폴드의 테스트 끝 2024-12-30까지로 맞춥니다.","그 앞의 신호 697거래일과, 2025-01-01부터 시작하는 봉인 구간 445거래일의 신호는 지웁니다.","성적을 매기는 날은 3116거래일이 남습니다."],"speech":["규칙 모델은 첫날부터 신호를 낼 수 있지만, 학습 모델과 공정하게 비교하려면 같은 날짜로 성적을 매겨야 합니다.","학습 모델의 첫 폴드는 처음 칠백오십육거래일을 학습 창으로 쓰되, 끝의 두 거래일을 비운 뒤, 그다음 날부터 예측합니다.","검증을 쓰는 모델은 검증 몫만큼, 그리고 특히 앞쪽 폴드에서는 변수의 결측만큼,","실제로 학습에 쓰는 행이 학습 창보다 적습니다.","규칙 모델의 평가 구간은 첫 폴드의 테스트 시작일 이천십이 년 오 월 이 일부터 마지막 폴드의 테스트 끝 이천이십사 년 십이 월 삼십 일까지로 맞춥니다.","그 앞의 신호 육백구십칠거래일과, 이천이십오 년 일 월부터 시작하는 봉인 구간 사백사십오거래일의 신호는 지웁니다.","성적을 매기는 날은 삼천백십육거래일이 남습니다."],"say_auto":false},{"chapter":"3. 체결과 비용","narr":"이 영상의 일간 실행에서는 결정일 t 의 신호를 <b>다음 날(t+1) 시가에 체결<\/b>하고, 그 포지션을 그다음 날(t+2) 시가까지 들고 갑니다(오늘 종가로는 이미 살 수 없음). 주간·월간 실행이면 같은 규칙이 '다음 주기의 첫 시가'가 됩니다(백테스트는 한 행을 한 주기로 읽음). 포지션은 0(현금) 또는 1(전부 보유)이고, 신호가 빈 날은 전날 포지션을 그대로 씁니다(평가 구간 안에는 빈 신호가 없음). 포지션이 바뀐 날에만 편도 비용 0.065%(= 수수료 0.015% + 슬리피지 5bp = 0.05%)를 냅니다. 아래는 포지션이 바뀐 날(가운데 행)과 그 앞뒤 3일씩, 모두 7일입니다.","say":"체결입니다. 결정일 종가를 본 뒤에는 그날 종가에 살 수 없으므로, 이 영상의 일간 실행에서는 다음 날 시가에 체결하고 그다음 날 시가까지 들고 갑니다. 주간이나 월간 실행이면 다음 주기의 시가입니다. 포지션은 0 아니면 1, 곧 전부 현금이거나 전부 보유입니다. 비용은 포지션이 바뀐 날에만 내고, 수수료 0.015%에 슬리피지 0.05%를 더해 편도 0.065%입니다. 가운데 행인 2012-10-19에는 신호가 0으로 바뀌어, 다음 거래일 시가 14,215원에 팝니다. 그래서 이날 순수익은 비용만큼 손실인 -0.065%입니다. 들고 있었다면 얻었을 보유수익 플러스 2.357%는 들어가지 않습니다.","code":{"file":"engine/backtest.py","lines":[111,112,113,114,115,116,117,118,119,120],"focus":114,"func":"run_backtest","before":2,"after":2,"notes":{"111":"빈 신호는 전날 포지션 그대로, 첫 신호 전은 0, 0~1 로 자름 → 현금(0) 또는 전부 보유(1)","114":"결정일 t 행에 기록: 시가_(t+2) ÷ 시가_(t+1) − 1 (일간 기준; 주간·월간이면 한 행 = 한 주기)","117":"바꾼 양 × 편도 비용 0.065% (바꾸지 않은 날은 0)"}},"stack":["engine/experiment.py · _run_experiment","engine/backtest.py · run_backtest"],"nodes":["fill"],"edges":[["win","fill"]],"tensors":[{"type":"table","title":"체결 기록 (결정일 행에 기록)","columns":["결정일 t","시가_t","신호","포지션","체결 시가_(t+1)","그다음 시가_(t+2)","보유수익","바꾼 양","비용","순수익"],"rows":[["2012-10-16","14,445",1,1,"14,730","14,700","-0.204%",0,"0.000%","-0.204%"],["2012-10-17","14,730",1,1,"14,700","14,640","-0.408%",0,"0.000%","-0.408%"],["2012-10-18","14,700",1,1,"14,640","14,215","-2.903%",0,"0.000%","-2.903%"],["2012-10-19","14,640",0,0,"14,215","14,550","+2.357%",1,"0.065%","-0.065%"],["2012-10-22","14,215",0,0,"14,550","14,430","-0.825%",0,"0.000%","+0.000%"],["2012-10-23","14,550",0,0,"14,430","14,560","+0.901%",0,"0.000%","+0.000%"],["2012-10-24","14,430",0,0,"14,560","14,650","+0.618%",0,"0.000%","+0.000%"]],"hlRows":[3]}],"formula":"보유수익_t = 시가_(t+2) ÷ 시가_(t+1) − 1,   비용_t = |포지션_t − 포지션_(t−1)| × 0.00065(0.065%),   순수익_t = 포지션_t × 보유수익_t − 비용_t","hint":"코드 주석의 알려진 한계: 마지막 날 들고 있던 것을 파는 비용은 넣지 않습니다 — 이 실행은 마지막 결정일(2024-12-30) 포지션이 0 이라 해당 없음. 세금은 넣지 않습니다(CostModel.tax_rate 는 계산에 쓰이지 않음).","checks":[{"what":"포지션·보유수익·비용·순수익 4317행: 원자료 시가·손 계산 신호로 반복문 계산 = run_backtest (차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"직접 실행해 보기 '체결·비용·순수익을 직접 계산 (7일)' 출력 = 엔진 값","ok":true,"kind":"식"}],"lab":{"title":"체결·비용·순수익을 직접 계산 (7일)","desc":"신호를 다음 날 시가에 체결하고 그다음 날 시가까지 들고 간다는 규칙, 포지션이 바뀐 날에만 내는 비용을 그대로 옮겼습니다. 출력이 run_backtest 의 기록(아래 기대 출력)과 같아야 합니다.","code":"# 결정일 7개(가운데 = 포지션이 바뀐 날)의 신호와 시가(원) — 실행 기록 그대로\ndates = ['2012-10-16', '2012-10-17', '2012-10-18', '2012-10-19', '2012-10-22', '2012-10-23', '2012-10-24']\nsignal = [1, 1, 1, 0, 0, 0, 0]    # 결정일 장 마감 후 정한 신호\nopens = [14445, 14730, 14700, 14640, 14215, 14550, 14430, 14560, 14650]    # 첫 결정일의 시가부터, 마지막 결정일의 그다음 날 시가까지 9개\nprev = 1    # 첫 행 바로 전 결정일의 포지션\none_way = 0.00015 + 5.0 / 10000    # 편도 비용 = 수수료 + 슬리피지(bp → 비율)\n\nfor i in range(len(dates)):\n    pos = signal[i]                    # 0 = 현금, 1 = 전부 보유 (이 구간엔 빈 신호가 없어 신호 = 포지션)\n    entry = opens[i + 1]               # 다음 날(t+1) 시가에 체결\n    exit_ = opens[i + 2]               # 그다음 날(t+2) 시가까지 보유\n    hold = exit_ / entry - 1           # 보유수익\n    cost = abs(pos - prev) * one_way   # 바꾼 양 × 편도 비용\n    net = pos * hold - cost + 0        # 순수익 (+ 0: −0.000 대신 +0.000 으로 보이게)\n    print(dates[i], pos, f\"보유수익 {hold * 100:+.3f}%\", f\"비용 {cost * 100:.3f}%\", f\"순수익 {net * 100:+.3f}%\")\n    prev = pos\n","expect":"2012-10-16 1 보유수익 -0.204% 비용 0.000% 순수익 -0.204%\n2012-10-17 1 보유수익 -0.408% 비용 0.000% 순수익 -0.408%\n2012-10-18 1 보유수익 -2.903% 비용 0.000% 순수익 -2.903%\n2012-10-19 0 보유수익 +2.357% 비용 0.065% 순수익 -0.065%\n2012-10-22 0 보유수익 -0.825% 비용 0.000% 순수익 +0.000%\n2012-10-23 0 보유수익 +0.901% 비용 0.000% 순수익 +0.000%\n2012-10-24 0 보유수익 +0.618% 비용 0.000% 순수익 +0.000%","got":null,"err":null,"pure":true,"tutor":true,"ok":true,"tol":null,"kind":"식"},"captions":["체결입니다.","결정일 종가를 본 뒤에는 그날 종가에 살 수 없으므로,","이 영상의 일간 실행에서는 다음 날 시가에 체결하고 그다음 날 시가까지 들고 갑니다.","주간이나 월간 실행이면 다음 주기의 시가입니다.","포지션은 0 아니면 1, 곧 전부 현금이거나 전부 보유입니다.","비용은 포지션이 바뀐 날에만 내고, 수수료 0.015%에 슬리피지 0.05%를 더해 편도 0.065%입니다.","가운데 행인 2012-10-19에는 신호가 0으로 바뀌어, 다음 거래일 시가 14,215원에 팝니다.","그래서 이날 순수익은 비용만큼 손실인 -0.065%입니다.","들고 있었다면 얻었을 보유수익 플러스 2.357%는 들어가지 않습니다."],"speech":["체결입니다.","결정일 종가를 본 뒤에는 그날 종가에 살 수 없으므로,","이 영상의 일간 실행에서는 다음 날 시가에 체결하고 그다음 날 시가까지 들고 갑니다.","주간이나 월간 실행이면 다음 주기의 시가입니다.","포지션은 영 아니면 일, 곧 전부 현금이거나 전부 보유입니다.","비용은 포지션이 바뀐 날에만 내고, 수수료 영 점 영일오 퍼센트에 슬리피지 영 점 영오 퍼센트를 더해 편도 영 점 영육오 퍼센트입니다.","가운데 행인 이천십이 년 시월 십구 일에는 신호가 영으로 바뀌어, 다음 거래일 시가 만 사천이백십오원에 팝니다.","그래서 이날 순수익은 비용만큼 손실인 마이너스 영 점 영육오 퍼센트입니다.","들고 있었다면 얻었을 보유수익 플러스 이 점 삼오칠 퍼센트는 들어가지 않습니다."],"say_auto":false},{"chapter":"4. 자산곡선","narr":"평가 구간(3116일)의 날마다 1 + 순수익을 차례로 곱하면 자산곡선입니다(곱하기 전 값 1 — 그림의 첫 점은 첫날 수익을 이미 한 번 곱한 값이라 B&H 는 0.9972, 전략은 1.0000). 비교 기준 B&H 는 같은 날들 동안 계속 들고 있었을 때(비용 없음)입니다. 끝 값: 전략 1.48배, B&H 1.80배. 보유 비율 56.5%(현금 43.5%), 포지션을 바꾼 날 62일, 비용 합 0.0403(= 4.03%, 62 × 0.065%).","say":"평가 구간 3116거래일 동안, 1 더하기 순수익을 날마다 차례로 곱한 것이 자산곡선입니다. 그림의 첫 점은 첫날의 수익을 이미 한 번 곱한 값입니다. 비교 기준인 바이 앤 홀드는 같은 날들 동안 비용 없이 계속 들고 있었을 때입니다. 끝 값은 전략이 1.48배, 바이 앤 홀드가 1.80배입니다. 전략은 평가일의 56.5%를 보유하고 43.5%는 현금으로 보냈으며, 포지션을 62번 바꿨습니다. 날마다 낸 비용을 수익률로 모두 더하면 4.03%입니다.","code":{"file":"engine/experiment.py","lines":[740,743,744],"focus":743,"func":"_run_experiment","before":2,"after":2,"notes":{"743":"첫 신호 2012-05-02 ~ 마지막 신호 2024-12-30 만 성적에 씀 (3116일)","744":"전략 = 순수익, 비교 기준 = 보유수익(B&H, 비용 없음)"}},"stack":["engine/experiment.py · _run_experiment"],"nodes":["eq"],"edges":[["fill","eq"]],"tensors":[{"type":"line","title":"자산곡선 (평가 구간, 세로축 로그)","x":["2012-05-02","2012-05-03","2012-05-04","2012-05-07","2012-05-08","2012-05-09","2012-05-10","2012-05-11","2012-05-14","2012-05-15","2012-05-16","2012-05-17","2012-0 e (차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"그림의 첫 점(1.0000·0.9972)과 끝 값(1.48·1.80배) = 일간 기록 equity·benchmark_equity 를 평가 시작 전날 값으로 나눈 것 (상대 차이 2.7e-15)","ok":true,"kind":"독립"}],"lab":null,"captions":["평가 구간 3116거래일 동안, 1 더하기 순수익을 날마다 차례로 곱한 것이 자산곡선입니다.","그림의 첫 점은 첫날의 수익을 이미 한 번 곱한 값입니다.","비교 기준인 바이 앤 홀드는 같은 날들 동안 비용 없이 계속 들고 있었을 때입니다.","끝 값은 전략이 1.48배, 바이 앤 홀드가 1.80배입니다.","전략은 평가일의 56.5%를 보유하고 43.5%는 현금으로 보냈으며, 포지션을 62번 바꿨습니다.","날마다 낸 비용을 수익률로 모두 더하면 4.03%입니다."],"speech":["평가 구간 삼천백십육거래일 동안, 일 더하기 순수익을 날마다 차례로 곱한 것이 자산곡선입니다.","그림의 첫 점은 첫날의 수익을 이미 한 번 곱한 값입니다.","비교 기준인 바이 앤 홀드는 같은 날들 동안 비용 없이 계속 들고 있었을 때입니다.","끝 값은 전략이 일 점 사팔배, 바이 앤 홀드가 일 점 팔영배입니다.","전략은 평가일의 오십육 점 오 퍼센트를 보유하고 사십삼 점 오 퍼센트는 현금으로 보냈으며, 포지션을 예순두 번 바꿨습니다.","날마다 낸 비용을 수익률로 모두 더하면 사 점 영삼 퍼센트입니다."],"say_auto":false},{"chapter":"5. 성적표","narr":"표의 10개 지표(총수익·연복리·연 변동성·샤프·소르티노·최대 낙폭·승률, B&H 의 총수익·연복리·최대 낙폭)와 초과 총수익은 engine/backtest.py 의 <b>performance<\/b> 에서 계산합니다. 바꾼 횟수·회전율·보유 비율·비용 합은 engine/experiment.py 의 _run_experiment(745–746행), 부트스트랩·Deflated Sharpe p 는 같은 함수 776–779행에서 계산합니다. 원자료에서 따로 계산한 순수익(3. 체결 단계의 검증)으로 다시 계산해 결과 파일의 값과 맞춰 봅니다. 샤프 0.262 (B&H 를 같은 식으로 계산하면 0.310). 최대 낙폭 -34.4% (B&H -46.5%).","say":"성적표입니다. 표의 지표는 성적표 함수가 계산한 값이고, 그 값을 손으로 다시 계산해 결과 파일과 맞췄습니다. 샤프는 일간 순수익의 평균을 표본 표준편차로 나눈 뒤, 1년을 252거래일로 보고 그 제곱근을 곱한 값이며, 무위험 수익률은 0으로 둡니다. 같은 식으로 계산하면 바이 앤 홀드의 샤프는 0.310이고, 이 전략은 그보다 낮은 0.262입니다. 최대 낙폭은 자산이 그때까지의 최고점에서 가장 많이 떨어진 비율로, 전략은 -34.4%, 바이 앤 홀드는 -46.5%입니다.","code":{"file":"engine/backtest.py","lines":[164,165,166,167,168,169,170,171,172,173,174,175,176,177,178,179,180,181,182,183,184],"focus":172,"func":"performance","before":2,"after":2,"notes":{"170":"연복리: 최종 배수^(1/년수) − 1, 년수 = 3116 ÷ 252","172":"평균 ÷ 표본 표준편차(n−1) × √252, 무위험 수익률 0 → 0.262","175":"그때까지 최고점 대비 낙폭(0 이하) → 가장 깊은 값 = 최대 낙폭 -34.4%"}},"stack":["engine/experiment.py · _run_experiment","engine/backtest.py · performance"],"nodes":["perf"],"edges":[["eq","perf"]],"tensors":[{"type":"table","title":"성적표: 손 계산 vs 결과 파일","columns 티드 샤프 p값은 0.8724로, 이 샤프가 운으로 기대되는 수준보다 높다고 볼 근거가 없습니다. 실험 수 보정을 아예 빼도 p값은 0.179로, 0.05보다 큽니다. 이동평균 교차는 여러 시도 가운데 골라낸 것이 아니라 미리 정해 둔 기준선이라, 여기서는 보수적인 보정입니다.","code":{"file":"engine/backtest.py","lines":[266,267,268,269,270,271,272,273,274,275,276,277,278],"focus":273,"func":"deflated_sharpe_pvalue","before":2,"after":2,"notes":{"266":"연 샤프 0.262 ÷ √252 = 일간 0.0165","273":"N = 94, V = 2.16e-04 → SR₀ = 0.0369","277":"z = -1.138 → p = 1 − Φ(z) = 0.8724"}},"stack":["engine/experiment.py · _run_experiment","engine/backtest.py · deflated_sharpe_pvalue (Bailey & López de Prado 2014)"],"nodes":["test"],"edges":[],"tensors":[{"type":"num","title":"","items":[{"label":"실험 수 N","value":"94"},{"label":"SR₀ (일간)","value":"0.0369"},{"label":"SR (일간)","value":"0.0165"},{"label":"z","value":"-1.138"},{"label":"p","value":"0.8724"},{"label":"p (N = 1)","value":"0.179"}]}],"formula":"SR₀ = √V · [(1−γ)Φ⁻¹(1 − 1/N) + γΦ⁻¹(1 − 1/(Ne))],   z = (SR − SR₀)·√(n−1) ÷ √(1 − 왜도·SR + (첨도−1)/4·SR²),   p = 1 − Φ(z)","hint":"엔진은 매매 모드의 모든 결과에 같은 식의 다중검정 보정을 적용합니다. N 은 개발 결과에서는 이 실행을 포함한 실험 카운터(results/trading/experiment_counter.json) 값이고(데이터 버전·설정·주기를 가리지 않고 셈), 봉인 평가에서는 카운터를 올리지 않고 그때까지의 개발 시도 수를 씁니다(cli.py). MA 교차는 여러 시도 가운데 고른 것이 아니라 미리 정한 기준선이라, 이 결과에는 보정이 보수적입니다(p 가 크게 나오는 쪽). V 는 그때까지 저장된 매매 모드 결과 가운데 같은 주기(일간)인 것들의 기간 샤프 분산입니다(봉인 평가 제외, 결과 파일 trial_sr_var). 이 실행의 V 는 그보다 먼저 저장된(실험 카운터 값이 더 작은) 일간 결과 21개로 다시 계산하면 그대로 나옵니다 — 그중 11개는 옛 데이터 버전이면서 평가 구간이 기록되지 않은 옛 결과로, 봉인 구간까지 포함해 평가됐습니다(결과 파일의 period 끝이 봉인 시작 뒤; docs/STATUS.md). 나머지 10개 중 5개도 평가 구간이 이 실행과 다릅니다. 지금 남아 있는 매매 결과 파일 가운데 이 실행보다 먼저 저장된(카운터 값이 작은) 것은 주간·월간 4개를 더해 25개라, N 과 V 의 표본은 서로 다른 것을 셉니다. 시도가 늘수록 SR₀ 가 올라가 같은 샤프라도 p 가 커집니다.","checks":[{"what":"왜도·첨도: 원자료 경로의 순수익으로 적률 공식(scipy 안 씀) = 결과 파일 return_skew·return_kurt (상대 차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"Deflated Sharpe p: 원자료 경로의 샤프·왜도·첨도와 결과 파일의 N·V 로 같은 식 = 결과 파일 (차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"V = 지금 남은 일간 결과 가운데 실험 카운터 값 < 94 인 21개(봉인 평가 제외)의 기간 샤프 분산을 결과 파일들에서 다시 계산 = 결과 파일 trial_sr_var (상대 차이 0.0e+00)","ok":true,"kind":"독립"},{"what":"보정 없는 p(N = 1)·첨도 3 으로 넣은 p: 손 계산 식 = 엔진 deflated_sharpe_pvalue (차이 0.0e+00)","ok":true,"kind":"식"},{"what":"순수익 0 인 날 1,337 = 현금·안 바꾼 날 1,324 + 보유·보유수익 0·안 바꾼 날 13, 0 을 뺀 첨도 4.65 = scipy kurtosis (차이 0.0e+00)","ok":true,"kind":"식"},{"what":"V 표본 21개의 구성(결과 파일): 옛 데이터 버전 11개 = 평가 구간 기록 없음과 같은 묶음 = period 끝이 봉인 뒤, 일간 21 + 주간·월간 4(frequency 로 직접 셈) = 카운터 값 < 94 인 결과 전체 25 (차이 0.0e+00)","ok":true,"kind":"식"},{"what":"직접 실행해 보기 'Deflated Sharpe p 를 직접 계산' 출력 = 엔진 값","ok":true,"kind":"식"}],"lab":{"title":"Deflated Sharpe p 를 직접 계산","desc":"scipy 없이 math.erf 와 뉴턴법으로 Φ·Φ⁻¹ 를 만들어 같은 식을 계산합니다. 기대 출력의 p 는 결과 파일의 deflated_sharpe_p, SR0·z 는 화면의 값(엔진과 같은 식을 scipy 로 계산해 p 가 결과 파일과 같음을 확인한 값)입니다.","code":"import math\n\ndef Phi(x):                       # 표준정규 누적분포 Φ\n    return 0.5 * (1 + math.erf(x / math.sqrt(2)))\n\ndef Phi_inv(p):                   # Φ⁻¹: 뉴턴법으로 Φ(x) = p 인 x 를 찾음\n    x = 0.0\n    for _ in range(50):\n        step = (Phi(x) - p) / (math.exp(-x * x / 2) / math.sqrt(2 * math.pi))\n        x -= step\n        if abs(step) < 1e-12:\n            break\n    return x\n\n# 결과 파일에 기록된 값 그대로\nsharpe_annual = 0.26168336475007836    # 연 샤프\nn = 3116                          # 평가 일수\nN = 94                            # 매매 모드 실험 수(n_trials_so_far)\nV = 0.00021624464255290808       # 시도들의 기간 샤프 분산(trial_sr_var)\nskew = -0.08531563000139433\nkurt = 8.140856708629522             # 첨도(정규분포 = 3)\ngamma = 0.5772156649015329            # 오일러 상수\n\nsr = sharpe_annual / math.sqrt(252)    # 연 샤프 → 일간 샤프\nsr0 = math.sqrt(V) * ((1 - gamma) * Phi_inv(1 - 1 / N) + gamma * Phi_inv(1 - 1 / (N * math.e)))    # 운으로도 기대되는 최고 샤프\nz = (sr - sr0) * math.sqrt(n - 1) / math.sqrt(1 - skew * sr + (kurt - 1) / 4 * sr ** 2)\np = 1 - Phi(z)\n\nprint(\"SR0\", f\"{sr0:.5g}\")\nprint(\"z\", f\"{z:.5g}\")\nprint(\"p\", f\"{p:.5g}\")\n","expect":"SR0 0.036892\nz -1.1379\np 0.87242","got":null,"err":null,"pure":true,"tutor":true,"ok":true,"tol":null,"kind":"식"},"captions":["다음은 여러 번 시험한 것에 대한 보정입니다.","전략을 많이 시험하고 가장 좋은 것만 고르면, 운만으로도 높은 샤프가 나옵니다.","이 실험은 매매 모드 실험 카운터로 94번째였고, 94번 시도했을 때 운으로도 기대되는 최고 일간 샤프는 0.0369,","연 샤프로 0.586입니다.","이 전략의 일간 샤프는 0.0165로 그보다 낮습니다.","수익률의 왜도와 첨도까지 넣은 디플레이티드 샤프 p값은 0.8724로,","이 샤프가 운으로 기대되는 수준보다 높다고 볼 근거가 없습니다.","실험 수 보정을 아예 빼도 p값은 0.179로, 0.05보다 큽니다.","이동평균 교차는 여러 시도 가운데 골라낸 것이 아니라 미리 정해 둔 기준선이라, 여기서는 보수적인 보정입니다."],"speech":["다음은 여러 번 시험한 것에 대한 보정입니다.","전략을 많이 시험하고 가장 좋은 것만 고르면, 운만으로도 높은 샤프가 나옵니다.","이 실험은 매매 모드 실험 카운터로 아흔네 번째였고, 아흔네 번 시도했을 때 운으로도 기대되는 최고 일간 샤프는 영 점 영삼육구,","연 샤프로 영 점 오팔육입니다.","이 전략의 일간 샤프는 영 점 영일육오로 그보다 낮습니다.","수익률의 왜도와 첨도까지 넣은 디플레이티드 샤프 피값은 영 점 팔칠이사로,","이 샤프가 운으로 기대되는 수준보다 높다고 볼 근거가 없습니다.","실험 수 보정을 아예 빼도 피값은 영 점 일칠구로, 영 점 영오보다 큽니다.","이동평균 교차는 여러 시도 가운데 골라낸 것이 아니라 미리 정해 둔 기준선이라, 여기서는 보수적인 보정입니다."],"say_auto":false},{"chapter":"7. 다른 규칙","narr":"<b>Buy & Hold<\/b>: 항상 보유(1). 모든 비교 화면의 기준선이고, 백테스트의 benchmark(비용 없는 계속 보유)와 같은 생각입니다(B&H 모델은 평가 첫날 진입 비용 한 번을 냄).","say":"다른 규칙들도 똑같은 평가 구간과 백테스트를 거칩니다. 바이 앤 홀드 모델은 모든 날 보유 신호를 냅니다. 백테스트의 비교 기준과 같은 생각이지만, 모델로 돌리면 평가 첫날 진입 비용을 한 번 냅니다.","code":{"file":"models/buy_and_hold.py","lines":[12,13],"focus":12,"func":"Model.positions","before":2,"after":2,"notes":{"13":"모든 날 1(보유) — 평가 첫날 0→1 로 바뀔 때만 비용"}},"stack":["models/buy_and_hold.py · Model.positions"],"nodes":["oth"],"edges":[],"tensors":[{"type":"line","title":"Buy & Hold: 평가 구간 마지막 260일의 포지션 (1 = 보유)","x":["2023-12-06","2023-12-07","2023-12-08","2023-12-11","2023-12-12","2023-12-13","2023-12-14","2023-12-15","2023-12-18","2023-12-19","2023-12-20","2023-12-21","2023-12-22","2023-12-26","2023-12-27","2023-12-28","2024-01-02","2024-01-03","2024-01-04","2024-01-05","2024-01-08","2024-01-09","2024-01-10","2024-01-11","2024-01-12","2024-01-15","2024-01-16","2024-01-17","2024-01-18","2024-01-19","2024-01-22","2024-01-23","2024-01-24","2024-01-25","2024-01-26","2024-01-29","2024-01-30","2024-01-31","2024-02-01","2024-02-02","2024-02-05","2024-02-06","2024-0
