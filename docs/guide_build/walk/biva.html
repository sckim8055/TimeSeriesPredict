log: list | None = None):","    \"\"\"봉인 구간 예측(sealed_folds 의 폴드로 학습→예측).\"\"\"","    target_type = \"classification\" if cfg.target.kind in (\"direction\", \"event\") else \"regression\"","    return _walkforward_predict(cfg, plugin, params, ds, device, sealed_folds(cfg, ds, k), k, target_type, log=log)","","","def run_experiment(cfg: ExperimentConfig, dv: DataVersion, reg: Registry, *, n_trials_so_far: int = 1, device: str | None = None, sealed: bool = False, trial_sr_var: float | None = None) -> dict:","    \"\"\"sealed=True 면 봉인 구간(sealed_from 이후)만 평가한다. 봉인 평가는 후보당 1회가 원칙 — 결과에 sealed=True 로 기록된다.","    결과의 periods 에 실제로 쓴 데이터·학습·검증·테스트 기간(첫 폴드·마지막 폴드)을 남긴다 — 논문 표에 그대로 옮길 값.\"\"\"","    _check_periods(cfg)","    fold_log: list = []","    with step(log_e, f\"실험 {cfg.name or cfg.model} ({cfg.mode})\", logging.INFO, 모델=cfg.model, 변수=cfg.variable_ids, 기간={\"start\": cfg.start, \"end\": cfg.end, **cfg.validation.model_dump()}):","        res = _run_experiment(cfg, dv, reg, n_trials_so_far=n_trials_so_far, device=device, sealed=sealed, trial_sr_var=trial_sr_var, fold_log=fold_log)","    log_e.info(\"결과: 폴드 %s · 예측 %s개 · 지표 %s\", res.get(\"n_folds\"), res.get(\"n_predictions\"), describe(res.get(\"prediction_metrics\") or {}))","    v = cfg.validation","    res[\"periods\"] = {","        \"data\": res.get(\"period\"),","        \"requested\": {\"start\": cfg.start, \"end\": cfg.end, \"val_start\": v.val_start, \"test_start\": v.test_start or (v.split_date if v.mode == \"split\" else None),","                      \"test_end\": v.test_end, \"sealed_from\": v.sealed_from},","        \"embargo\": _embargo(cfg, cfg.target.k),","        \"validation_rule\": (\"date\" if (v.mode == \"split\" and v.val_start) else f\"val_frac={v.val_frac}\"),","        \"n_folds_logged\": len(fold_log),","        \"first_fold\": fold_log[0] if fold_log else None,","        \"last_fold\": fold_log[-1] if fold_log else None,","        \"test\": [fold_log[0][\"test\"][0], fold_log[-1][\"test\"][1]] if fold_log and fold_log[0][\"test\"] and fold_log[-1][\"test\"] else None,","    }","    return res","","","def _check_periods(cfg: ExperimentConfig) -> None:","    \"\"\"기간 설정의 순서 검사: 데이터 시작 ≤ 검증 시작 < 테스트 시작 ≤ 테스트 종료 < 봉인 시작 ≤ 데이터 끝.\"\"\"","    v = cfg.validation","    T = lambda x: pd.Timestamp(x) if x else None","    st, en, vs = T(cfg.start), T(cfg.end), T(v.val_start)","    ts, te, sf = T(v.test_start or (v.split_date if v.mode == \"split\" else None)), T(v.test_end), T(v.sealed_from)","    errs = []","    if st and en and st >= en:","        errs.append(f\"데이터 시작({st.date()})이 종료({en.date()})보다 늦습니다\")","    if vs and v.mode != \"split\":","        errs.append(\"검증 시작일(val_start)은 1회 분할에서만 씁니다 — 워크포워드는 학습 창마다 뒤쪽 val_frac 를 검증으로 씁니다\")","    if vs and ts and vs >= ts:","        errs.append(f\"검증 시작({vs.date()})은 테스트 시작({ts.date()})보다 앞이어야 합니다\")","    if vs and st and vs <= st:","        errs.append(f\"검증 시작({vs.date()})은 데이터 시작({st.date()})보다 뒤여야 합니다\")","    if ts and te and te < ts:","        errs.append(f\"테스트 종료({te.date()})가 테스트 시작({ts.date()})보다 앞입니다\")","    if te and sf and te >= sf:","        errs.append(f\"테스트 종료({te.date()})는 봉인 시작({sf.date()}) 전이어야 합니다 — 봉인 구간은 개발 중 보지 않는 최종 확인용\")","    if ts and sf and ts >= sf:","        errs.append(f\"테스트 시작({ts.date()})이 봉인 시작({sf.date()}) 이후입니다\")","    if ts and en and ts > en:","        errs.append(f\"테스트 시작({ts.date()})이 데이터 끝({en.date()}) 이후입니다\")","    if errs:","        raise ValueError(\"기간 설정 오류: \" + \" / \".join(errs))","","","","def prepare(cfg: ExperimentConfig, dv: DataVersion, reg: Registry, *, device: str = \"cpu\"):","    \"\"\"실행 준비(실험 실행과 계산 따라가기가 같이 쓴다): 시드 고정 → 플러그인·타겟 종류 확인 → 주기별 기본값을 채운 실제 파라미터 →","    창 길이 기본값 → 데이터셋. 반환 (cfg, plugin, params, target_type, ds).\"\"\"","    _seed(cfg.seed)","    plugin = load_plugin(cfg.model)","    target_type = \"classification\" if cfg.target.kind in (\"direction\", \"event\") else \"regression\"","    if plugin.INPUT_SHAPE == \"levels\" and not cfg.variable_ids:","        raise ValueError(f\"{plugin.NAME} 은(는) 입력 변수를 1개 이상 골라야 합니다 — 대상과 변수들의 수준값이 장기적으로 함께 움직이는 관계(공적분)를 쓰는 모델이라 \"","                         \"대상 하나만으로는 정의되지 않습니다. 기술지표(자체 지표)는 VECM 에 쓰이지 않습니다. 예: 월간 F11 이면 F7(CPI)·B1(금리) 등 2~5개\")","    if plugin.INPUT_SHAPE != \"rule\" and target_type not in plugin.TARGET_TYPES:","        raise ValueError(f\"{plugin.NAME} 은(는) {target_type} 타겟을 지원하지 않습니다\")","    freq_for_defaults = (reg.get(cfg.target_variable).freq if cfg.mode == \"forecast\" and cfg.target_variable else cfg.frequency)","    params = resolve_params(plugin.PARAMS, cfg.model_params, freq_for_defaults)","    if cfg.seq_len is None:","        dflt = {\"D\": 20, \"W\": 13, \"M\": 12, **(getattr(plugin, \"SEQ_LEN_DEFAULT\", None) or {})}  # 모델이 원본 기본을 선언하면 그것(BIVA 월간 6)","        cfg = cfg.model_copy(update={\"seq_len\": dflt.get(freq_for_defaults, 20)})","    log_e.info(\"모델 %s(%s) · 장치 %s · 파라미터(받은 값 %s → 기본값 채운 실제 값) %s · 창 길이 %s\", plugin.NAME, plugin.INPUT_SHAPE, device,","               describe(cfg.model_params), describe(params), cfg.seq_len if plugin.INPUT_SHAPE == \"window\" else \"-\")","    with step(log_d, \"데이터셋 만들기(읽기→변환→발표시차 정렬→타겟)\"):","        ds = build_dataset(cfg, dv, reg)","    return cfg, plugin, params, target_type, ds","","def _run_experiment(cfg: ExperimentConfig, dv: DataVersion, reg: Registry, *, n_trials_so_far: int = 1, device: str | None = None, sealed: bool = False, trial_sr_var: float | None = None, fold_log: list | None = None) -> dict:","    t0 = time.time()","    device = device or default_device()","    cfg, plugin, params, target_type, ds = prepare(cfg, dv, reg, device=device)","    k = cfg.target.k","","    pred = pd.Series(np.nan, index=ds.prices.index, name=\"prediction\")","    importances: list[np.ndarray] = []","    n_folds = 0","","    if cfg.mode == \"forecast\" and plugin.INPUT_SHAPE == \"rule\":","        raise ValueError(\"예측 연구 모드에는 규칙(매매) 모델을 쓸 수 없습니다\")","    if plugin.INPUT_SHAPE == \"rule\":","        model: RuleModel = plugin.Model(params)","        pos = pd.Series(model.positions(ds.prices, ds.X) if getattr(model, \"USES_VARIABLES\", False) else model.positions(ds.prices), index=ds.prices.index)","        if not sealed:","            # 규칙 모델은 학습이 없어 첫날부터 신호를 낼 수 있지만, 학습 모델과 같은 날짜로 성적을 매겨야 비교가 공정하다.","            # 같은 검증 설정이면 학습 모델이 평가받았을 구간(첫 폴드 테스트 시작 ~ 마지막 폴드 테스트 끝)만 남긴다.","            lo, hi = _eval_window(cfg, ds, k)","            if lo is not None:","                pos = pos.where((pos.index >= lo) & (pos.index <= hi))","                log_e.info(\"규칙 모델 평가 구간을 학습 모델과 맞춤: %s ~ %s\", lo.date(), hi.date())","        signal = pos","        pred[:] = pos.values","    elif sealed:","        # 봉인 평가: 개발 구간은 다시 계산하지 않는다(결과에 쓰지 않으므로). 봉인 폴드만 학습→예측","        fit = None","        pred, n_folds, importances = _predict_sealed(cfg, plugin, params, ds, device, cfg.validation.sealed_from, k, log=fold_log)","        if target_type == \"regression\":","            signal = (pred > cfg.trade.threshold).astype(float).where(pred.notna())","        else:","            signal = (pred > 0.5 + cfg.trade.threshold).astype(float).where(pred.notna())","    else:","        folds, is_split = make_folds(cfg, ds, k)","        fit = None","        if is_split:","            pred, n_folds, importances, fit = _walkforward_predict(cfg, plugin, params, ds, device, folds, k, target_type, want_fit=True, log=fold_log)","        else:","            pred, n_folds, importances = _walkforward_predict(cfg, plugin, params, ds, device, folds, k, target_type, log=fold_log)","        # 신호 변환","        if target_type == \"regression\":","            signal = (pred > cfg.trade.threshold).astype(float).where(pred.notna())","        else:","            signal = (pred > 0.5 + cfg.trade.threshold).astype(float).where(pred.notna())","","    cost = CostModel(fee_rate=cfg.trade.fee_rate, slippage_bp=cfg.trade.slippage_bp)","    ppy = {\"D\": 252, \"W\": 52, \"M\": 12}[cfg.frequency]","    sealed_from = pd.Timestamp(cfg.validation.sealed_from) if cfg.validation.sealed_from else None","    if cfg.mode == \"forecast\":","        return _finish_forecast(cfg, plugin, params, ds, device, pred, fit if cfg.validation.mode == \"split\" else None,","                                importances, n_folds, k, target_type, sealed, sealed_from, t0, fold_log=fold_log)","    if sealed:","        if sealed_from is None:","            raise ValueError(\"봉인 평가에는 validation.sealed_from 이 필요합니다\")","        if plugin.INPUT_SHAPE == \"rule\":  # 학습 없는 규칙: 봉인 구간의 포지션만 남긴다(학습 모델은 위에서 봉인 폴드로 이미 예측)","            signal = signal.where(signal.index >= sealed_from)","            pred = pred.where(pred.index >= sealed_from)","    elif sealed_from is not None:","        # 개발 구간 평가: 봉인 이후는 신호를 지운다 (규칙 모델도 봉인 구간을 쓰지 못하게)","        signal = signal.where(signal.index < sealed_from)","        pred = pred.where(pred.index < sealed_from)","","    daily_full, _ = run_backtest(ds.prices, signal, cost=cost, periods_per_year=ppy)","    daily_full[\"prediction\"] = pred","    daily_full[\"target\"] = ds.y","    if plugin.INPUT_SHAPE != \"rule\" and cfg.validation.mode == \"split\" and fit is not None:","        daily_full[\"fit\"] = fit  # 학습 구간 적합값(차트용). 성과·검정에는 쓰지 않는다","    # 성과는 '신호가 있는 구간'(첫 신호~마지막 신호)에서만 계산한다. 그 밖은 B&H 와 비교할 수 없다.","    has = signal.dropna()","    if len(has) == 0:","        raise RuntimeError(\"신호가 하나도 없습니다\")","    daily = daily_full.loc[has.index.min(): has.index.max()].copy()","    perf = performance(daily[\"net_return\"], daily[\"hold_return\"], periods_per_year=ppy)","    turnover = daily[\"position\"].diff().abs().fillna(daily[\"position\"].abs())","    perf.update(n_trades=int((turnover > 0).sum()), turnover=float(turnover.sum()), exposure=float(daily[\"position\"].mean()), total_cost=float(daily[\"cost\"].sum()))","","    # 예측 성능 (예측이 있는 구간)","    ev = daily[[\"prediction\", \"target\"]].dropna()","    pred_metrics: dict[str, float] = {}","    if plugin.INPUT_SHAPE != \"rule\" and len(ev) > 5:","        e = ev[\"prediction\"] - ev[\"target\"]","        if target_type == \"regression\":","            pred_metrics = {","                \"rmse\": float(np.sqrt((e**2).mean())),","                \"mae\": float(e.abs().mean()),","                \"dir_acc\": float(((ev[\"prediction\"] > 0) == (ev[\"target\"] > 0)).mean()),","            }","            # naive(0 수익률 예측) 대비 DM 검정","            dm, dm_p = diebold_mariano(e.values, (0 - ev[\"target\"]).values, h=k)","            pred_metrics.update(dm_vs_zero=dm, dm_vs_zero_p=dm_p)","        else:","            from sklearn.metrics import roc_auc_score","","            yb = ev[\"target\"].values","            pred_metrics = {\"dir_acc\": float(((ev[\"prediction\"] > 0.5) == (yb > 0.5)).mean()),","                            \"brier\": float(((ev[\"prediction\"].values - yb) ** 2).mean())}","            if len(np.unique(yb)) == 2:","                pred_metrics[\"auc\"] = float(roc_auc_score(yb, ev[\"prediction\"].values))","            # 무정보(0.5) 대비 DM — 회귀의 dm_vs_zero 와 같은 역할·같은 키 이름","            dm, dm_p = diebold_mariano_brier(ev[\"prediction\"].values, yb, h=k)","            pred_metrics.update(dm_vs_zero=dm, dm_vs_zero_p=dm_p, dm_baseline=\"brier_vs_0.5\")","","    # 신뢰도","    valid = daily.dropna(subset=[\"net_return\", \"hold_return\"])","    perf[\"bootstrap_p_excess\"] = bootstrap_excess_pvalue(valid[\"net_return\"], valid[\"hold_return\"], block=max(5, 2 * k))","    sk, ku = return_moments(valid[\"net_return\"])","    perf[\"deflated_sharpe_p\"] = deflated_sharpe_pvalue(perf.get(\"sharpe\", float(\"nan\")), perf.get(\"n_periods\", 0), n_trials_so_far,","                                                       skew=sk, kurt=ku, periods_per_year=ppy, trial_sr_var=trial_sr_var)","    perf[\"return_skew\"], perf[\"return_kurt\"] = sk, ku","    perf[\"trial_sr_var\"] = trial_sr_var","    perf[\"n_trials_so_far\"] = int(n_trials_so_far)","","    fi_mean = np.mean(importances, axis=0).tolist() if importances else None","    # 퇴화 검사: 중요도가 전부 0 이면 모델이 입력을 전혀 쓰지 않은 것(= 폴드별 상수 예측). 그 dir_acc 는 \"항상 롱\"의 적중률일 뿐이다.","    degenerate = bool(fi_mean is not None and len(fi_mean) > 0 and float(np.nansum(np.abs(fi_mean))) == 0.0)","    if degenerate:","        print(\"  [경고] 모델이 어떤 입력도 쓰지 않음(중요도 전부 0) → 상수 예측. 파라미터(min_child_samples 등)가 학습 표본 수에 비해 큼\")","    return {","        \"config\": json.loads(cfg.model_dump_json()),","        \"config_hash\": cfg.config_hash(),","        \"model\": {\"file\": cfg.model, \"name\": plugin.NAME, \"input_shape\": plugin.INPUT_SHAPE, \"params\": params},","        \"data_version\": dv.id,","        \"code_version\": _code_version(), \"engine_rev\": ENGINE_REV,","        \"n_folds\": n_folds,","        \"n_features\": len(ds.feature_names),","        \"feature_names\": ds.feature_names,","        \"feature_importance\": fi_mean,","        \"degenerate_model\": degenerate,","        \"sealed_evaluation\": bool(sealed),","        \"evaluation_period\": [str(daily.index[0].date()), str(daily.index[-1].date())],","        \"leak_warning\": ds.leak_warning,","        \"lag_days_used\": ds.lag_days_used,","        \"lag_unconfirmed\": ds.lag_unconfirmed,","        \"transforms_used\": ds.transforms_used,","        \"prediction_metrics\": pred_metrics,","        \"performance\": perf,","        \"period\": [str(daily.index[0].date()), str(daily.index[-1].date())],","        \"prediction_period\": [str(ev.index[0].date()), str(ev.index[-1].date())] if len(ev) else None,","        \"n_predictions\": int(len(ev)),","        \"variable_first_date\": {c: (str(ds.X[c].first_valid_index().date()) if ds.X[c].first_valid_index() is not None else None) for c in ds.feature_names if not c.startswith(\"A_\")},","        \"device\": device,","        \"seconds\": round(time.time() - t0, 1),","        \"_daily\": daily_full,  # 전체 기간(워밍업·봉인 포함). 성과는 evaluation_period 로 잘라 계산했다","    }","","","def forecast_level_metrics(daily: pd.DataFrame, kind: str) -> dict:","    \"\"\"k기간 뒤 '값'(수준값)으로 환산한 예측 오차 — 예측력의 1차 지표(논문 표기용).","    모델 v[t]·g(ŷ), naive v[t]·g(y[t−k]), 변화없음 v[t] 를 실제 v[t+k] 와 비교. g = 1+x(return) / e^x(logreturn).","    평가 행 = 모델 예측·타겟·naive 가 모두 있는 행(봉인 구간은 이미 제외됨). 분류 타겟이면 빈 dict.\"\"\"","    if kind not in (\"return\", \"logreturn\"):","        return {}","    g = (lambda x: 1 + x) if kind == \"return\" else np.exp","    d = daily.dropna(subset=[\"prediction\", \"target\", \"naive\", \"actual_future_level\"])","    if d.empty:","        return {}","    act = d[\"actual_future_level\"]","    out, ape = {}, {}","    for tag, lv in ((\"\", d[\"level\"] * g(d[\"prediction\"])), (\"_naive\", d[\"level\"] * g(d[\"naive\"])), (\"_zero\", d[\"level\"])):","        e = lv - act","        ape[tag] = (e.abs() / act.abs()).values","        out[f\"level_rmse{tag}\"] = float(np.sqrt((e**2).mean()))","        out[f\"level_mape{tag}\"] = float(ape[tag].mean())","    # 화면에 보이는 MAPE 와 같은 눈금의 개선율·검정(참고). 판정은 사전 등록대로 변화율 제곱오차 DM(dm_vs_naive).","    out[\"skill_mape_vs_naive\"] = float(1 - out[\"level_mape\"] / out[\"level_mape_naive\"]) if out[\"level_mape_naive\"] > 0 else None","    k = int(daily.attrs.get(\"k\", 1)) if hasattr(daily, \"attrs\") else 1","    dm, p = diebold_mariano(ape[\"\"], ape[\"_naive\"], h=k, power=1)","    out.update(dm_ape_vs_naive=dm, dm_ape_vs_naive_p=p)","    return out","","","def forecast_metrics(daily_full: pd.DataFrame, kind: str, k: int, target_type: str) -> tuple[dict, pd.DataFrame]:","    \"\"\"예측 연구 지표 — 저장된 daily(예측·타겟·naive·수준값)만으로 계산한다. 실험 마무리와 앙상블이 같은 함수를 쓴다.\"\"\"","    ev = daily_full[[\"prediction\", \"target\", \"naive\"]].dropna()","    if len(ev) < 10:","        raise RuntimeError(\"예측이 10개 미만입니다 — 학습 창·변수 시작일을 확인하세요\")","    e = ev[\"prediction\"] - ev[\"target\"]","    e0 = 0 - ev[\"target\"]","    en = ev[\"naive\"] - ev[\"target\"]","    pm: dict[str, float] = {}","    if target_type == \"regression\":","        pm = {","            \"rmse\": float(np.sqrt((e**2).mean())), \"mae\": float(e.abs().mean()),","            \"rmse_zero\": float(np.sqrt((e0**2).mean())), \"rmse_naive\": float(np.sqrt((en**2).mean())),","            \"dir_acc\": float(((ev[\"prediction\"] > 0) == (ev[\"target\"] > 0)).mean()),","            \"dir_acc_naive\": float(((ev[\"naive\"] > 0) == (ev[\"target\"] > 0)).mean()),","        }","        dm, p = diebold_mariano(e.values, e0.values, h=k); pm.update(dm_vs_zero=dm, dm_vs_zero_p=p)","        dm, p = diebold_mariano(e.values, en.values, h=k); pm.update(dm_vs_naive=dm, dm_vs_naive_p=p)","        daily_full.attrs[\"k\"] = k","        pm.update(forecast_level_metrics(daily_full, kind))","        pm[\"skill_vs_naive\"] = float(1 - pm[\"rmse\"] / pm[\"rmse_naive\"]) if pm.get(\"rmse_naive\") else None","    else:","        from sklearn.metrics import roc_auc_score","","        yb = ev[\"target\"].values","        pm = {\"dir_acc\": float(((ev[\"prediction\"] > 0.5) == (yb > 0.5)).mean()), \"brier\": float(((ev[\"prediction\"].values - yb) ** 2).mean())}","        if len(np.unique(yb)) == 2:","            pm[\"auc\"] = float(roc_auc_score(yb, ev[\"prediction\"].values))","        dm, p = diebold_mariano_brier(ev[\"prediction\"].values, yb, h=k); pm.update(dm_vs_zero=dm, dm_vs_zero_p=p, dm_baseline=\"brier_vs_0.5\")","        nb = ev[\"naive\"].clip(0, 1).values","        dm, p = diebold_mariano(ev[\"prediction\"].values - yb, nb - yb, h=k); pm.update(dm_vs_naive=dm, dm_vs_naive_p=p)","    return pm, ev","","","def _finish_forecast(cfg, plugin, params, ds, device, pred, fit, importances, n_folds, k, target_type, sealed, sealed_from, t0, fold_log: list | None = None) -> dict:","    \"\"\"예측 연구 모드 마무리: 체결·비용 없음. 오차 지표 + 0예측·naive(지속) 대비 DM. 봉인 처리는 매매 모드와 같은 규칙.\"\"\"","    if sealed:","        if sealed_from is None:","            raise ValueError(\"봉인 평가에는 validation.sealed_from 이 필요합니다\")","        pred = pred.where(pred.index >= sealed_from)  # 위(_run_experiment)에서 봉인 폴드로 이미 예측했다","    elif sealed_from is not None:","        pred = pred.where(pred.index < sealed_from)","    y = ds.y","    naive = cal.naive_forecast(y, k)","    level = ds.prices[\"close\"]","    # 예측 수익률 → k기간 뒤 수준값: return 이면 v(1+ŷ), logreturn 이면 v·exp(ŷ). 분류(방향)는 수준값이 정의되지 않음.","    kind = cfg.target.kind","    if kind == \"return\":","        pfl = level * (1 + pred)","    elif kind == \"logreturn\":","        pfl = level * np.exp(pred)","    else:","        pfl = pd.Series(np.nan, index=level.index)","    daily_full = pd.DataFrame({\"level\": level, \"target\": y, \"prediction\": pred, \"naive\": naive,","                               \"actual_future_level\": level.shift(-k), \"pred_future_level\": pfl.where(pred.notna())})","    if fit is not None:","        daily_full[\"fit\"] = fit","    pm, ev = forecast_metrics(daily_full, cfg.target.kind, k, target_type)","    fi_mean = np.mean(importances, axis=0).tolist() if importances else None","    degenerate = bool(fi_mean is not None and len(fi_mean) > 0 and float(np.nansum(np.abs(fi_mean))) == 0.0)","    if degenerate:","        print(\"  [경고] 모델이 어떤 입력도 쓰지 않음(중요도 전부 0) → 상수 예측\")","    return {","        \"config\": json.loads(cfg.model_dump_json()), \"config_hash\": cfg.config_hash(),","        \"model\": {\"file\": cfg.model, \"name\": plugin.NAME, \"input_shape\": plugin.INPUT_SHAPE, \"params\": params},","        \"data_version\": cfg.data_version, \"code_version\": _code_version(), \"engine_rev\": ENGINE_REV, \"n_folds\": n_folds, \"n_features\": len(ds.feature_names),","        \"feature_names\": ds.feature_names, \"feature_importance\": fi_mean, \"degenerate_model\": degenerate,","        \"sealed_evaluation\": bool(sealed), \"evaluation_period\": [str(ev.index[0].date()), str(ev.index[-1].date())],","        \"leak_warning\": ds.leak_warning, \"lag_days_used\": ds.lag_days_used, \"lag_unconfirmed\": ds.lag_unconfirmed, \"transforms_used\": ds.transforms_used,","        \"prediction_metrics\": pm, \"performance\": {}, \"period\": [str(daily_full.index[0].date()), str(daily_full.index[-1].date())],","        \"prediction_period\": [str(ev.index[0].date()), str(ev.index[-1].date())], \"n_predictions\": int(len(ev)),","        \"variable_first_date\": {c: (str(ds.X[c].first_valid_index().date()) if ds.X[c].first_valid_index() is not None else None) for c in ds.feature_names if not c.startswith(\"A_\")},","        \"device\": device, \"seconds\": round(time.time() - t0, 1), \"_daily\": daily_full,","    }","","","def trial_sharpe_variance(results_dir: str | Path, periods_per_year: int) -> float | None:","    \"\"\"지금까지 저장된 실험들의 기간 샤프 분산 (Deflated Sharpe 의 V). 같은 주기(periods_per_year)의 결과만. 2개 미만이면 None.","    results_dir 는 모드별 폴더(results/trading)여야 한다 — 2026-11-04 이주 뒤 cli 가 results/ 바로 아래를 넘겨 V 가 늘 None(근사 1/(n−1))이었다(2026-11-06 수정).","    봉인 평가 결과는 '시도'가 아니므로 뺀다.\"\"\"","    srs = []","    for p in Path(results_dir).glob(\"*.json\"):","        if p.name in (\"experiment_counter.json\", \"sealed_log.json\") or p.name.startswith(\"ablation_\"):","            continue","        try:","            r = json.loads(p.read_text(encoding=\"utf-8\"))","            ppy = {\"D\": 252, \"W\": 52, \"M\": 12}.get(r[\"config\"][\"frequency\"])","            sh = r[\"performance\"].get(\"sharpe\")","            if r.get(\"sealed_evaluation\"):","                continue","            if ppy == periods_per_year and sh is not None and np.isfinite(sh):","                srs.append(sh / np.sqrt(ppy))","        except Exception:  # noqa: BLE001","            continue","    return float(np.var(srs, ddof=1)) if len(srs) >= 2 else None","","","def results_dir(root: str | Path, mode: str) -> Path:","    \"\"\"모드별 결과 저장소: results/trading, results/forecast. 카운터·봉인 기록도 각각.","    2026-11-04 이전 결과(results/ 바로 아래)는 처음 호출 때 results/trading 으로 옮긴다(1회 이주).\"\"\"","    root = Path(root)","    d = root / (\"forecast\" if mode == \"forecast\" else \"trading\")","    d.mkdir(parents=True, exist_ok=True)","    legacy = [p for p in root.iterdir() if p.is_file() and p.suffix in (\".json\", \".parquet\", \".csv\", \".md\")]","    if legacy:","        tdir = root / \"trading\"; tdir.mkdir(exist_ok=True)","        for p in legacy:","            target = tdir / p.name","            if not target.exists():","                p.rename(target)","        print(f\"  [이주] 옛 결과 {len(legacy)}개 → results/trading/\")","    return d","","","def save_result(res: dict, out_dir: str | Path) -> Path:","    out = Path(out_dir)","    out.mkdir(parents=True, exist_ok=True)","    stem = f\"{res['config']['name'] or res['model']['file']}_{res['config_hash']}\"","    if res.get(\"sealed_evaluation\"):  # 봉인 결과는 같은 설정의 개발 결과와 이름이 같아 덮어쓰지 않도록 따로(같은 설정을 다시 열면 번호)","        stem += \"_sealed\"","        n = 2","        while (out / f\"{stem}.json\").exists():","            stem = f\"{stem.rsplit('_sealed', 1)[0]}_sealed{n}\"; n += 1","    daily = res.pop(\"_daily\")","    daily.to_parquet(out / f\"{stem}_daily.parquet\")","    (out / f\"{stem}.json\").write_text(json.dumps(res, ensure_ascii=False, indent=1, default=float), encoding=\"utf-8\")","    res[\"_daily\"] = daily","    return out / f\"{stem}.json\"",""],"models/biva.py":["\"\"\"BIVA — 연구실 원본 소스를 그대로 쓰는 플러그인. window 입력 [N, seq_len, k].","","원본 위치: D:/test/SVU_SCT_FIN-main/Model/BIVA/model  →  사본: models/biva_src/ (고친 곳은 [TSP 수정 #n] 표시, PATCHES.md)","  - 신경망: biva_src/BIVA.py(Model) · BIVA_BRITS.py · BIVA_RITS.py · BIVA_LSTM_VAE.py  — 원본 그대로","  - 학습 규칙: 원본 exp_main.Exp_Main.train / vali 를 이 파일의 fit / _vali 가 **같은 순서**로 재현","      Adam(learning_rate) · MSELoss · 손실 = VAE_loss + imputed_loss + MSE(예측)   (가중치 없는 합)","      매 epoch: 학습(shuffle, drop_last) → 검증 손실(배치 평균) → EarlyStopping(patience) → 멈춤이면 끝 → adjust_learning_rate(epoch+1)","      끝나면 검증 손실이 가장 낮았던 가중치로 되돌림","  - 원본과 다른 점(플랫폼에서 돌기 위해 필요한 것만)","      a. 데이터: 엔진이 만든 창을 받는다(원본 data_loader 대신). 정답은 '입력 마지막 행'이 아니라 k 기간 뒤 값(누출 제거).","         입력 스케일러는 학습 구간으로만 맞춘다(원본은 전체 기간으로 다시 맞춤 = 누출). 기본은 원본과 같은 0~1(MinMax).","      b. 체크포인트를 파일 대신 메모리에 보관(EarlyStopping.save_checkpoint 만 바꿈).","      c. 원본 학습 루프의 epoch 마다 test 손실 계산은 하지 않는다(출력용이었고, 테스트 구간을 학습 중에 보지 않기 위해).","      d. use_brits=아니오 이면 BRITS 대신 '입력을 그대로 넘기는' 모듈을 끼운다(빈 칸은 엔진이 학습 구간 평균으로 채움).","      e. target_scale: 대상 값을 학습 구간 평균·표준편차로 맞춰 학습하고 되돌린다(기본). 원본은 스케일 없이 지수 수준값을","         맞혔는데, 플랫폼의 대상(k 기간 변화율, 크기 약 0.003)은 그대로 두면 예측 MSE 가 VAE·보간 손실보다 수만 배 작아(F11 학습 창 1.8e-5 대 0.81)","         공유 가중치(BRITS·VAE)의 학습과 검증 손실에 예측 오차가 거의 반영되지 않는다. 'none' 으로 원본처럼 둘 수 있다.","\"\"\"","from __future__ import annotations","","import copy","import logging","import time","from types import SimpleNamespace","","import numpy as np","import torch","import torch.nn as nn","from torch import optim","from torch.utils.data import DataLoader, TensorDataset","","from models.base import BaseModel","from models.biva_src import BIVA as BIVA_SRC","from models.biva_src.tools_orig import EarlyStopping, adjust_learning_rate","","log = logging.getLogger(\"tsp.model.biva\")","","NAME = \"BIVA\"","INPUT_SHAPE = \"window\"","TARGET_TYPES = [\"regression\"]","SEQ_LEN_DEFAULT = {\"M\": 6}  # 원본 노트북 len_seq_list = [6] (월간). 일·주간은 엔진 기본","LRADJ = [\"3\", \"none\", \"1\", \"2\", \"4\", \"5\", \"6\", \"dtype1\", \"dtype2\", \"type-e\"]","# 기본값 = 원본 노트북 (BASE)BIVA_SEOUL_After_4_Local_1027.ipynb 의 args. 그룹(group)은 화면 배치·그림 표시용.","PARAMS = {","    \"use_brits\": {\"type\": \"bool\", \"default\": True, \"group\": \"Stage 1 BRITS\",","                  \"desc\": \"결측 보간 BRITS 사용. 원본은 항상 사용(빈 칸을 양방향 RNN 으로 채우고 보간 손실을 학습에 더함). 끄면 빈 칸은 학습 구간 평균으로 채워 BRITS 없이 학습\"},","    \"rnn_hid_size\": {\"type\": \"int\", \"default\": 128, \"min\": 1, \"max\": 1024, \"group\": \"Stage 1 BRITS\",","                     \"desc\": \"BRITS 안 RNN(LSTMCell) 은닉 크기. 시점마다 지난 정보를 담는 기억의 크기. 원본 128\"},","    \"imputed_weight\": {\"type\": \"float\", \"default\": 0.05, \"min\": 0.0, \"max\": 10.0, \"group\": \"Stage 1 BRITS\",","                       \"desc\": \"보간 손실에 곱하는 계수. 클수록 '관측된 칸을 잘 복원하는 것'을 더 중시. 원본 0.05\"},","    \"moving_avg\": {\"type\": \"str\", \"default\": \"6\", \"group\": \"Stage 2 분해\",","                   \"desc\": \"추세/계절 분해 이동평균 창(개월 수). 정수 하나(예 6) 또는 쉼표로 여러 개(예 3,6,12 → 원본 series_decomp_multi 로 여러 창을 학습 가중 평균). 원본 6\"},","    \"vae_latent_size\": {\"type\": \"int\", \"default\": 4, \"min\": 2, \"max\": 256, \"group\": \"Stage 3 LSTM-VAE\",","                        \"desc\": \"계절 성분을 압축하는 잠재 변수 z 의 차원. 작을수록 강하게 요약. 2 미만이면 원본 Conv1d 채널이 0 이 되어 오류. 원본 4\"},","    \"conv1d\": {\"type\": \"bool\", \"default\": True, \"group\": \"추세 경로\",","               \"desc\": \"추세·계절 출력에 Conv1d 3단 사용. 원본은 항상 예 — '아니오'는 원본 forward 가 Conv1d 를 항상 호출해 오류(그래서 막음)\"},","    \"conv_kernal\": {\"type\": \"int\", \"default\": 1, \"min\": 1, \"max\": 1, \"group\": \"추세 경로\",","                    \"desc\": \"Conv1d 커널 크기. 원본은 패딩이 없어 1 이 아니면 길이가 줄어 뒤의 Linear(seq_len) 와 맞지 않아 오류 → 1 만 가능. 원본 1\"},","    \"combination\": {\"type\": \"bool\", \"default\": True, \"group\": \"Stage 4 합치기·출력\",","                    \"desc\": \"예측 = α·계절 + (1−α)·추세 에서 α 를 학습. 아니오면 단순 합(계절 + 추세). 원본 예\"},","    \"RIN\": {\"type\": \"bool\", \"default\": False, \"group\": \"입력\",","            \"desc\": \"창마다 평균·표준편차를 빼고 마지막 입력 열의 통계로 되돌리는 정규화(RevIN). 빈 칸(NaN)이 있으면 통계가 NaN 이 되므로 BRITS 와 함께 쓰기 어렵다. 원본 아니오\"},","    \"learning_rate\": {\"type\": \"float\", \"default\": 0.01, \"min\": 1e-7, \"max\": 1.0, \"group\": \"학습\",","                      \"desc\": \"Adam 학습률(한 번에 가중치를 얼마나 크게 고치나). 원본 0.01\"},","    \"lradj\": {\"type\": \"str\", \"default\": \"3\", \"choices\": LRADJ, \"group\": \"학습\",","              \"desc\": \"학습률 일정(원본 adjust_learning_rate). 3: 10 epoch 학습 뒤(11번째부터) ×0.1(원본) · 4/5/6: 15/25/5 epoch 뒤부터 ×0.1 · 1: 매 epoch ×0.98 · dtype1: 매 epoch ×0.5 · 2·dtype2: 정해진 표 · type-e: 원본 실험용 · none: 고정(플랫폼 추가)\"},","    \"batch_size\": {\"type\": \"int\", \"default\": 3, \"min\": 1, \"max\": 4096, \"group\": \"학습\",","                   \"desc\": \"한 번에 학습하는 창 수. 남는 창은 원본처럼 버리되(drop_last) 섞기 때문에 epoch 마다 다른 창이 빠진다. 원본 3\"},","    \"train_epochs\": {\"type\": \"int\", \"default\": 500, \"min\": 1, \"max\": 100000, \"group\": \"학습\",","                     \"desc\": \"학습 반복 횟수 상한. 원본 500\"},","    \"patience\": {\"type\": \"int\", \"default\": 500, \"min\": 1, \"max\": 100000, \"group\": \"학습\",","                 \"desc\": \"검증 손실이 이 횟수만큼 연속으로 나아지지 않으면 멈춤. 원본 500(= 사실상 끝까지 학습 후 최저 검증 손실 시점 선택)\"},","    \"input_scaler\": {\"type\": \"str\", \"default\": \"minmax\", \"choices\": [\"minmax\", \"standard\"], \"group\": \"입력\",","                     \"desc\": \"입력 스케일. minmax: 학습 구간 최소0·최대1(원본 방식 — BRITS 보간값이 sigmoid 0~1 출력이라 맞춰야 함). standard: 평균0·표준편차1\"},","    \"target_scale\": {\"type\": \"str\", \"default\": \"standard\", \"choices\": [\"standard\", \"none\"], \"group\": \"Stage 4 합치기·출력\",","                     \"desc\": \"대상 값 스케일. standard: 학습 구간 평균·표준편차로 맞춰 학습 후 되돌림(기본). none: 원본처럼 그대로 — 변화율 대상은 값이 매우 작아 예측 손실이 다른 손실에 묻힘\"},","    \"init_checkpoint\": {\"type\": \"str\", \"default\": \"\", \"group\": \"학습\",","                        \"desc\": \"시작 가중치 파일(.pth, 원본 last_chkpt). 비우면 무작위 초기화. 모양(변수 수·은닉 크기)이 같아야 함\"},","}","PARAM_GROUPS = [\"입력\", \"Stage 1 BRITS\", \"Stage 2 분해\", \"추세 경로\", \"Stage 3 LSTM-VAE\", \"Stage 4 합치기·출력\", \"학습\"]","","","class _NoBRITS(nn.Module):","    \"\"\"use_brits=아니오: 입력을 그대로 넘기고 보간 손실 0. (원본 BRITS 와 같은 반환 모양)\"\"\"","","    def forward(self, x):","        return {\"imputations\": x, \"loss\": torch.zeros((), device=x.device)}","","","class _MemEarlyStopping(EarlyStopping):","    \"\"\"원본 EarlyStopping 그대로, 체크포인트만 파일 대신 메모리에 저장.\"\"\"","","    best_state = None","","    def save_checkpoint(self, val_loss, model, path, model_id):","        if self.verbose:","            log.debug(\"검증 손실 감소 (%.6f --> %.6f) 가중치 보관\", self.val_loss_min, val_loss)","        self.best_state = copy.deepcopy(model.state_dict())","        self.val_loss_min = val_loss","","","def _parse_ma(s: str):","    parts = [p.strip() for p in str(s).split(\",\") if p.strip()]","    vals = [int(p) for p in parts]","    if not vals or any(v < 1 for v in vals):","        raise ValueError(f\"moving_avg 는 1 이상의 정수(또는 쉼표 목록)여야 합니다: {s!r}\")","    return vals[0] if len(vals) == 1 else vals","","","class Model(BaseModel):","    ACCEPTS_NAN = True","","    @classmethod","    def wants_nan(cls, params) -> bool:","        \"\"\"엔진이 빈 칸을 NaN 그대로 넘길지(=BRITS 가 채움).\"\"\"","        return bool(params.get(\"use_brits\", True))","","    def _args(self, seq_len: int) -> SimpleNamespace:","        p = self.params","        if not p[\"conv1d\"]:","            raise ValueError(\"BIVA 원본은 conv1d=아니오 를 지원하지 않습니다(원본 forward 가 Conv1d_Trend_1 을 항상 호출 → 오류)\")","        if p[\"conv_kernal\"] != 1:","            raise ValueError(\"BIVA 원본은 conv_kernal=1 만 동작합니다(패딩 없는 Conv1d → 길이가 줄어 Linear(seq_len) 와 불일치)\")","        return SimpleNamespace(","            seq_len=seq_len, pred_len=1, label_len=1, channels=self.n_features,","            rnn_hid_size=p[\"rnn_hid_size\"], vae_latent_size=p[\"vae_latent_size\"], infer_hid_size=128,  # infer_hid_size 는 원본에서 저장만 하고 쓰지 않음","            conv_kernal=p[\"conv_kernal\"], moving_avg=_parse_ma(p[\"moving_avg\"]), batch_size=p[\"batch_size\"],","            conv1d=p[\"conv1d\"], RIN=p[\"RIN\"], combination=p[\"combination\"], imputed_weight=p[\"imputed_weight\"],","            lradj=p[\"lradj\"], learning_rate=p[\"learning_rate\"],","        )","","    def _build(self, seq_len: int):","        self.args = self._args(seq_len)","        net = BIVA_SRC.Model(self.args).float()  # 원본 _build_model 과 같음","        if self.params.get(\"init_checkpoint\"):","            net.load_state_dict(torch.load(self.params[\"init_checkpoint\"], map_location=\"cpu\"))","            log.info(\"시작 가중치 불러옴: %s\", self.params[\"init_checkpoint\"])","        if not self.params[\"use_brits\"]:","            net.BRITS = _NoBRITS()  # 생성은 원본과 같이 한 뒤 교체 → 나머지 층의 초기값은 BRITS 사용 때와 같다","        return net.to(self.device)","","    def _tensor(self, X, y=None):","        Xt = torch.tensor(np.asarray(X, dtype=np.float32))","        if y is None:","            return Xt","        yt = torch.tensor(((np.asarray(y, dtype=np.float64) - self.y_mu) / self.y_sd).astype(np.float32)).view(-1, 1, 1)","        return Xt, yt","","    def _run(self, bx):","        return self.net(bx.float().to(self.device))","","    def _vali(self, loader, criterion) -> float:","        \"\"\"원본 Exp_Main.vali 와 같음: eval, 배치마다 (VAE + 보간 + 예측 MSE) → 배치 평균.\"\"\"","        total = []","        self.net.eval()","        with torch.no_grad():","            for bx, by in loader:","                states, VAE_loss, _, _, imputed_loss, _ = self._run(bx)","                loss = VAE_loss.detach().cpu() + imputed_loss.detach().cpu() + criterion(states.detach().cpu(), by)","                total.append(loss.item())","        return float(np.average(total)) if total else float(\"nan\")","","    def fit(self, X, y, X_val=None, y_val=None):","        p = self.params","        N, L, K = X.shape","        if p[\"target_scale\"] == \"standard\":","            self.y_mu, self.y_sd = float(np.mean(y)), float(np.std(y) or 1.0)","        else:","            self.y_mu, self.y_sd = 0.0, 1.0","        self.net = self._build(L)","        n_par = sum(t.numel() for t in self.net.parameters())","        nan_x = int(np.isnan(X).sum())","        log.info(\"BIVA fit 시작: 창 %d × 길이 %d × 변수 %d (빈 칸 %d) · 검증 창 %s · 파라미터 %d · 장치 %s · use_brits=%s · 대상 스케일 μ=%.6g σ=%.6g\",","                 N, L, K, nan_x, None if X_val is None else len(X_val), n_par, self.device, p[\"use_brits\"], self.y_mu, self.y_sd)","        if N < p[\"batch_size\"]:","            raise ValueError(f\"학습 창({N})이 batch_size({p['batch_size']})보다 적어 drop_last 로 학습할 배치가 없습니다\")","        tr = DataLoader(TensorDataset(*self._tensor(X, y)), batch_size=p[\"batch_size\"], shuffle=True, drop_last=True)","        va = None","        if X_val is not None and len(X_val) >= p[\"batch_size\"]:","            # 원본 data_factory: flag='val' 은 else 분기 → shuffle=True, drop_last=True","            va = DataLoader(TensorDataset(*self._tensor(X_val, y_val)), batch_size=p[\"batch_size\"], shuffle=True, drop_last=True)","        else:","            log.warning(\"검증 창이 없거나 batch_size 보다 적음 → 학습 손실로 조기종료·최적 시점을 고름(원본에는 없는 경우)\")","        opt = optim.Adam(self.net.parameters(), lr=p[\"learning_rate\"])  # 원본 _select_optimizer","        criterion = nn.MSELoss()  # 원본 _select_criterion","        early = _MemEarlyStopping(patience=p[\"patience\"], verbose=True)","        self.history = []","        for epoch in range(p[\"train_epochs\"]):","            t0 = time.time()","            self.net.train()","            train_loss = []","            for bx, by in tr:","                opt.zero_grad()","                states, VAE_loss, _, _, imputed_loss, _ = self._run(bx)","                loss_states = criterion(states, by.to(self.device))","                loss = VAE_loss + imputed_loss + loss_states  # 원본: 가중치 없는 합","                train_loss.append(loss.item())","                loss.backward()","                opt.step()","            train_loss = float(np.average(train_loss))","            vali_loss = self._vali(va, criterion) if va is not None else train_loss","            lr_now = opt.param_groups[0][\"lr\"]","            self.history.append({\"epoch\": epoch + 1, \"train_loss\": train_loss, \"vali_loss\": vali_loss, \"lr\": lr_now, \"sec\": round(time.time() - t0, 3)})","            log.debug(\"epoch %d | train %.7f | vali %.7f | lr %.3g | %.2fs\", epoch + 1, train_loss, vali_loss, lr_now, time.time() - t0)","            if not np.isfinite(train_loss):","                raise FloatingPointError(f\"BIVA 손실이 {train_loss} (epoch {epoch + 1}) — 입력 스케일·학습률 확인\")","            early(vali_loss, self.net, \"\", \"\")","            if early.early_stop:","                log.info(\"조기종료 epoch %d (patience %d)\", epoch + 1, p[\"patience\"])","                break","            if p[\"lradj\"] != \"none\":","                adjust_learning_rate(opt, epoch + 1, self.args)","        if early.best_state is not None:","            self.net.load_state_dict(early.best_state)","        best = min(self.history, key=lambda h: h[\"vali_loss\"]) if self.history else None","        log.info(\"BIVA fit 끝: %d epoch · 최저 검증 손실 %.7f (epoch %s) · 총 %.1fs\", len(self.history),","                 early.val_loss_min, best and best[\"epoch\"], sum(h[\"sec\"] for h in self.history))","","    def predict(self, X):","        \"\"\"eval 모드로 전체 창 예측(원본 test 의 drop_last 는 마지막 창을 버리는 문제라 쓰지 않음).","        원본 그대로 VAE 표본추출(z = μ + ε·σ)이 예측 때도 일어나므로 같은 시드여야 같은 값.\"\"\"","        self.net.eval()","        out = []","        Xt = self._tensor(X)","        with torch.no_grad():","            for i in range(0, len(Xt), self.params[\"batch_size\"]):","                states = self._run(Xt[i:i + self.params[\"batch_size\"]])[0]","                out.append(states[:, -1, 0].detach().cpu().numpy())","        pred = np.concatenate(out).astype(np.float64) * self.y_sd + self.y_mu if out else np.zeros(0)","        log.debug(\"BIVA predict: 창 %d → 예측 평균 %.6g 표준편차 %.6g\", len(X), float(np.mean(pred)) if len(pred) else float(\"nan\"),","                  float(np.std(pred)) if len(pred) else float(\"nan\"))","        return pred",""],"models/biva_src/BIVA.py":["","import torch","import torch.nn as nn","import torch.nn.functional as F","import torch.optim as optim","","# from torch.autograd import Variable","# from torch.nn.parameter import Parameter","","# import numpy as np","# import math","","# 원본: from model import BIVA_BRITS as BRITS","# 원본: from model import BIVA_LSTM_VAE as LSTM_VAE","from . import BIVA_BRITS as BRITS  # [TSP 수정 #2] 패키지 안에서 불러오기","from . import BIVA_LSTM_VAE as LSTM_VAE","","","class moving_avg(nn.Module):","    \"\"\"","    Moving average block to highlight the trend of time series","    \"\"\"","    def __init__(self, kernel_size, stride):","        super(moving_avg, self).__init__()","        self.kernel_size = kernel_size","        self.avg = nn.AvgPool1d(kernel_size=kernel_size,","                                stride=stride, padding=0)","    def forward(self, x):","        # padding on the both ends of time series","","        if self.kernel_size % 2 != 0:  # even must be modify","            front = x[:, 0:1, :].repeat(1, (self.kernel_size - 1) // 2, 1)","            end = x[:, -1:, :].repeat(1, (self.kernel_size - 1) // 2, 1)","        else:","            front = x[:, 0:1, :].repeat(1, (self.kernel_size - 1) // 2, 1)","            end = x[:, -1:, :].repeat(1, (self.kernel_size) // 2, 1)","","        x = torch.cat([front, x, end], dim=1)","        x = self.avg(x.permute(0, 2, 1))","        x = x.permute(0, 2, 1)","        return x","","class series_decomp(nn.Module):","    \"\"\"","    Series decomposition block","    \"\"\"","    def __init__(self, kernel_size):","        super(series_decomp, self).__init__()","        self.moving_avg = moving_avg(kernel_size, stride=1)","","    def forward(self, x):","        moving_mean = self.moving_avg(x)","        res = x - moving_mean","        return res, moving_mean","","class series_decomp_multi(nn.Module):","    \"\"\"","    Series decomposition block","    \"\"\"","    def __init__(self, kernel_size):","        super(series_decomp_multi, self).__init__()","        self.moving_avg = [moving_avg(kernel, stride=1)","                           for kernel in kernel_size]","        self.layer = torch.nn.Linear(1, len(kernel_size))","","    def forward(self, x):","        moving_mean = []","        for func in self.moving_avg:","            moving_avg = func(x)","            moving_mean.append(moving_avg.unsqueeze(-1))","        moving_mean = torch.cat(moving_mean, dim=-1)","        moving_mean = torch.sum(","            moving_mean*nn.Softmax(-1)(self.layer(x.unsqueeze(-1))), dim=-1)","        res = x - moving_mean","        return res, moving_mean","","class RIN(nn.Module):","    def __init__(self):","        super(RIN, self).__init__()","        self.build()","","    def build(self):","        self.affine_weight = nn.Parameter(torch.ones(1, 1, 1))","        self.affine_bias = nn.Parameter(torch.zeros(1, 1, 1))","","    def set_RIN(self, x):","        # print('/// RIN ACTIVATED ///\\r', end='')","        means = x.mean(1, keepdim=True).detach()","        x = x - means","        stdev = torch.sqrt(","            torch.var(x, dim=1, keepdim=True, unbiased=False) + 1e-5)","        x /= stdev","        x = x * self.affine_weight + self.affine_bias","        self.means, self.stdev = means, stdev  # [TSP 수정 #4] off_RIN 이 쓸 수 있게 보관(원본은 off_RIN 에서 정의되지 않은 변수 → RIN=True 면 항상 오류)","        return x","","    def off_RIN(self, x):","        x = x - self.affine_bias","        x = x / (self.affine_weight + 1e-10)","        # 원본: stdev = stdev[:, :, -1:]","        # 원본: means = means[:, :, -1:]","        stdev = self.stdev[:, :, -1:]  # [TSP 수정 #4] 마지막 입력 열의 통계로 되돌림(원본 의도: 마지막 열 = 대상 변수)","        means = self.means[:, :, -1:]","        x = x * stdev","        x = x + means","        return x","","","class Model(nn.Module):","    \"\"\"","    Bi-direction Recurrent Imputation & VAE","    \"\"\"","    def __init__(self, args):","        super(Model, self).__init__()","        self.seq_len = args.seq_len          # manthly observation input value","        self.pred_len = args.pred_len        # qurter state target value","        self.label_len = args.label_len","","        self.channels = args.channels        # times series or feature","        self.latent_size = args.vae_latent_size","        self.infer_hid_size = args.infer_hid_size","","        self.conv_kernal = args.conv_kernal  # if use conv1d layer","        # time Series decompose average pooling kernel size","        self.kernel_size = args.moving_avg","","        self.batch_size = args.batch_size","        self.conv1d = args.conv1d","        self.RIN = args.RIN                  # boolen, Reverse Instance Normalize option","        self.combination = args.combination  # boolen, compose time Series part option","        ","        self.build(args)","","    def build(self, args):","        # Decompose","        if isinstance(self.kernel_size, list):","            self.decomposition = series_decomp_multi(self.kernel_size)","        else:","            self.decomposition = series_decomp(self.kernel_size)","            ","        # self.log_softmax = F.log_softmax()","        # self.KLDivLoss = nn.KLDivLoss(reduction='batchmean')","","        # brits","        self.BRITS = BRITS.Model(args)","        # lstm_vae","        self.LSTM_VAE = LSTM_VAE.Model(args)","","        # Reverse Instance Normalize & T-S combination param","        if self.RIN:","            self.RIN_func = RIN()","","        if self.combination:","            self.alpha = nn.Parameter(torch.ones(1, 1, 1))","","        if self.conv1d:","            # self.Conv1d_Seasonal = nn.Conv1d(","            #     self.latent_size*2, 1, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)","            ","            self.Conv1d_Seasonal_1 = nn.Conv1d(","                self.latent_size*2, self.latent_size, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)","            self.Conv1d_Seasonal_2 = nn.Conv1d(","                self.latent_size, int(self.latent_size/2), kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)","            self.Conv1d_Seasonal_3 = nn.Conv1d(","                int(self.latent_size/2), 1, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)            ","            ","            self.Linear_Seasonal = nn.Linear(self.seq_len, self.pred_len)","            self.Linear_Seasonal.weight = nn.Parameter(","                (1/self.seq_len)*torch.ones([self.pred_len, self.seq_len]))","","            # self.Conv1d_Trend = nn.Conv1d(","            #     self.channels, 1, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)","","            # 원본: int(self.channels/4), int(self.channels/16)","            # [TSP 수정 #5] 변수 16개 미만이면 중간 채널이 0개가 되어 생성 오류 → 최소 1. 16개 이상(원본 34개)이면 원본과 같은 값","            _c4, _c16 = max(1, int(self.channels/4)), max(1, int(self.channels/16))","            self.Conv1d_Trend_1 = nn.Conv1d(","                self.channels, _c4, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)  # [TSP 수정 #5]","            self.Conv1d_Trend_2 = nn.Conv1d(","                _c4, _c16, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)  # [TSP 수정 #5]","            self.Conv1d_Trend_3 = nn.Conv1d(","                _c16, 1, kernel_size=self.conv_kernal, dilation=1, stride=1, groups=1)  # [TSP 수정 #5]","","            ","            self.Linear_Trend = nn.Linear(self.seq_len, self.pred_len)","            self.Linear_Trend.weight = nn.Parameter(","                (1/self.seq_len)*torch.ones([self.pred_len, self.seq_len]))","","        else:","            self.Linear_Seasonal = nn.Linear(self.seq_len, self.pred_len)","            self.Linear_Seasonal.weight = nn.Parameter(","                (1/self.seq_len)*torch.ones([self.pred_len, self.seq_len]))","            self.Linear_Trend = nn.Linear(self.seq_len, self.pred_len)","            self.Linear_Trend.weight = nn.Parameter(","                (1/self.seq_len)*torch.ones([self.pred_len, self.seq_len]))","","    def loss_function(self, recons, input, mu, log_var):","        \"\"\"","        Computes the VAE loss function.","        \"\"\"","        kld_weight = 0.5  # Account for the minibatch samples from the dataset","        recons_weight = 0.5","        recons_loss = F.mse_loss(recons, input)","        kld_loss = torch.mean( -0.5 * torch.sum(1 + log_var - mu**2 - log_var.exp(), dim=1), dim=0 )","        loss = recons_weight * recons_loss  + kld_weight * kld_loss","        return torch.sum(loss), recons_loss, -kld_loss","","    def forward(self, x):","        # x: [Batch, Input length, Channel]","        if self.RIN:","            x = self.RIN_func.set_RIN(x)","        # BRITS - imputation","        x = self.BRITS(x)","        imputed_x = x['imputations']","        imputed_loss = x['loss']","        # print(f\"BRITS_out_x.shape: {x.shape}\")","","        # decompose timeseries","        seasonal_init, trend_init = self.decomposition(imputed_x)","        # -- Trend --","        trend_init = trend_init.permute(0, 2, 1)","        trend_output_1 = self.Conv1d_Trend_1(trend_init)","        trend_output_2 = self.Conv1d_Trend_2(trend_output_1)","        trend_output_3 = self.Conv1d_Trend_3(trend_output_2)","        trend_output = self.Linear_Trend(trend_output_3)","        # print(f\"trend_output.shape: {trend_output.shape}\")","","        # -- Seasonal --","        # LSTM_VAE","        recon_output, mu, logvar, seasonal_enc_output_x, seasonal_output_z = self.LSTM_VAE(seasonal_init)","        VAE_loss,_,_ = self.loss_function(recon_output, seasonal_init, mu, logvar)","        ","        # print(f\"seasonal_output_z.shape: {seasonal_output_z.shape}\")","        # print(f\"seasonal_enc_output_x.shape: {seasonal_enc_output_x.shape}\")","        # print(f\"recon_output.shape: {recon_output.shape}\")","        # raise","        #","        seasonal_enc_output_x = seasonal_enc_output_x.permute(0, 2, 1) ","        seasonal_output_z = seasonal_output_z.permute(0, 2, 1)","        seasonal_output_x_z = torch.cat([seasonal_enc_output_x,seasonal_output_z],dim=1)","        ","       ","        # seasonal_output = self.Conv1d_Seasonal(seasonal_output_x_z)","        seasonal_output_1 = self.Conv1d_Seasonal_1(seasonal_output_x_z)","        seasonal_output_2 = self.Conv1d_Seasonal_2(seasonal_output_1)","        seasonal_output_3 = self.Conv1d_Seasonal_3(seasonal_output_2)","        ","        seasonal_output = self.Linear_Seasonal(seasonal_output_3)","","        if self.combination:","            states = (seasonal_output*(self.alpha)) + (trend_output*(1-self.alpha))","        else:","            states = seasonal_output + trend_output","","        states = states.permute(0, 2, 1)  # to [Batch, Output length, Channel]","","        if self.RIN:","            states = self.RIN_func.off_RIN(states)","","        return states, VAE_loss, recon_output, seasonal_init, imputed_loss, imputed_x",""],"models/biva_src/BIVA_BRITS.py":["import os","# 원본: os.chdir(r'D:\\\\test\\\\SVU_SCT_FIN-main\\\\Model\\\\BIVA\\\\model')","# [TSP 수정 #1] 불러올 때 작업 폴더를 D: 로 바꾸는 줄 제거(다른 컴퓨터에서 오류, 플랫폼 전체의 상대경로를 깨뜨림)","import torch.nn as nn","import torch","from torch.nn.parameter import Parameter","from torch.autograd import Variable","# 원본: import BIVA_RITS as RITS  # RITS","from . import BIVA_RITS as RITS  # [TSP 수정 #2] 패키지 안에서 불러오기(원본은 chdir 에 기대어 불러옴)","","","class Model(nn.Module):","    def __init__(self, args):","        super(Model, self).__init__()","        self.rnn_hid_size = args.rnn_hid_size","","        self.build(args)","","    def build(self, args):","        self.rits_f = RITS.Model(args)","        self.rits_b = RITS.Model(args)","","    def forward(self, data):","        ret_f = self.rits_f(data, 'forward')","        ret_b = self.reverse(self.rits_b(data, 'backward'))","        imputations = self.merge_ret(ret_f, ret_b)","        return imputations","","    def merge_ret(self, ret_f, ret_b):","        loss_f = ret_f['loss']","        loss_b = ret_b['loss']","","        loss_c = self.get_consistency_loss(ret_f['imputations'], ret_b['imputations'])","","        loss = loss_f + loss_b + loss_c","        imputations = (ret_f['imputations'] + ret_b['imputations']) / 2","        # print(f\"ret_f['imputations']: \\n {ret_f['imputations']}\")","        # print(f\"ret_b['imputations']:\\n {ret_b['imputations']}\")","        # print(f\"imputations: \\n {imputations}\")","        # raise","","        ret_f['loss'] = loss","        ret_f['imputations'] = imputations","","        return ret_f","","    def get_consistency_loss(self, pred_f, pred_b):","        loss = torch.abs(pred_f - pred_b).mean() * 1e-1","        return loss","","    def reverse(self, ret):","        def reverse_tensor(tensor_):","            if tensor_.dim() <= 1:","                return tensor_","            indices = range(tensor_.size()[1])[::-1]","","            indices = Variable(torch.LongTensor(indices), requires_grad=False)","","            # 원본: if torch.cuda.is_available():","            # 원본:     indices = indices.cuda()","            indices = indices.to(tensor_.device)  # [TSP 수정 #3] 입력과 같은 장치로(원본은 GPU 가 있으면 무조건 GPU → CPU 실행 시 오류)","","            return tensor_.index_select(1, indices)","","        for key in ret:","            ret[key] = reverse_tensor(ret[key])","            ","        # print(f\"key : {key}\")","        # print(f\"ret[key]:\\n {ret[key][0][:,0]} {ret[key].shape}\")","        # raise","","        return ret",""],"models/biva_src/BIVA_LSTM_VAE.py":["import torch","import torch.nn as nn","import torch.nn.functional as F","","class Model(nn.Module):","    def __init__(self, args, num_layers=1, batch_norm=False):","        super(Model, self).__init__()","        self.input_size = args.channels","        self.seq_len = args.seq_len","        # self.embeding_size = args.vae_hid_size","        # self.hidden_size_1 = (self.embeding_size*2)","        # 원본: self.hidden_size_1 = (self.input_size//2)","        # 원본: self.hidden_size_2 = (self.hidden_size_1//2)","        # [TSP 수정 #5] 변수 4개 미만이면 은닉 크기 0 → 생성 오류 → 최소 1. 4개 이상이면 원본과 같은 값","        self.hidden_size_1 = max(1, self.input_size//2)","        self.hidden_size_2 = max(1, self.hidden_size_1//2)","        self.latent_size = args.vae_latent_size","","        self.num_layers = num_layers","        self.batch_norm = batch_norm","","        self.encoder_lstm_1 = nn.LSTM(","            self.input_size, self.input_size, num_layers, batch_first=True)","        self.encoder_lstm_2 = nn.LSTM(","            self.input_size, self.hidden_size_1, num_layers, batch_first=True)","        self.encoder_lstm_3 = nn.LSTM(","            self.hidden_size_1, self.hidden_size_2, num_layers, batch_first=True)","        self.encoder_lstm_4 = nn.LSTM(","            self.hidden_size_2, self.latent_size, num_layers, batch_first=True)","        ","        ","        self.encoder_fc_mu = nn.Linear(self.latent_size, self.latent_size)","        self.encoder_fc_logvar = nn.Linear(self.latent_size, self.latent_size)","","        self.decoder_lstm_1 = nn.LSTM(","            self.latent_size*2, self.hidden_size_2, num_layers, batch_first=True)","        self.decoder_lstm_2 = nn.LSTM(","            self.hidden_size_2, self.hidden_size_1, num_layers, batch_first=True)","        self.decoder_lstm_3 = nn.LSTM(","            self.hidden_size_1, self.input_size, num_layers, batch_first=True)","        self.decoder_lstm_4 = nn.LSTM(","             self.input_size, self.input_size, num_layers, batch_first=True)"," ","        # self.decoder_fc = nn.Linear(self.hidden_size, self.input_size)","        self.output_fc = nn.Linear(self.input_size, self.input_size)","","        # self.relu = nn.ReLU()","        # self.batchnorm1d_encoder = nn.BatchNorm1d(self.hidden_size)","        # self.batchnorm1d_decoder = nn.BatchNorm1d(self.hidden_size)","","    def encode(self, x):","        x, _ = self.encoder_lstm_1(x)","        x, _ = self.encoder_lstm_2(x)","        x, _ = self.encoder_lstm_3(x)","        x, _ = self.encoder_lstm_4(x)","        # x = x[:, -1, :]  # get only last hidden state ????","        # x = self.relu(x)","        # print(\"encoder lstm lyr out >>>> activation func :: \", x)","        # if self.batch_norm:","        #     x = self.batchnorm1d_encoder(x)  # apply batch normalization","        mu = self.encoder_fc_mu(x)","        logvar = self.encoder_fc_logvar(x)","        return x, mu, logvar","","    def reparameterize(self, mu, logvar):","        std = torch.exp(0.5 * logvar)","        eps = torch.randn_like(std)","        z = mu + eps * std","        return z","","    def decode(self, x_z):","        # z = self.decoder_fc(z)","        # if self.batch_norm:","            # z = self.batchnorm1d_decoder(z)  # apply batch normalization","        # repeat along sequence length","        # z = z.unsqueeze(1).repeat(1, self.seq_len, 1)","","        out, _ = self.decoder_lstm_1(x_z)","        out, _ = self.decoder_lstm_2(out)","        out, _ = self.decoder_lstm_3(out)","        out, _ = self.decoder_lstm_4(out)","        # output = self.relu(output)","        output = self.output_fc(out)","        return output","","    def forward(self, x):","        x, mu, logvar = self.encode(x)","        mu = F.relu(mu)","        logvar = F.relu(logvar)","        z = self.reparameterize(mu, logvar)","        x_z = torch.cat([x, z], dim=2)","        output = self.decode(x_z)","        return output, mu, logvar, x, z",""],"models/biva_src/BIVA_RITS.py":["import torch","import torch.nn as nn","import torch.nn.functional as F","from torch.autograd import Variable","from torch.nn.parameter import Parameter","import math","","# def binary_cross_entropy_with_logits(input, target, weight=None, size_average=True, reduce=True):","#     if not (target.size() == input.size()):","#         raise ValueError(\"Target size ({}) must be the same as input size ({})\".format(target.size(), input.size()))","","#     max_val = (-input).clamp(min=0)","#     loss = input - input * target + max_val + ((-max_val).exp() + (-input - max_val).exp()).log()","","#     if weight is not None:","#         loss = loss * weight","","#     if not reduce:","#         return loss","#     elif size_average:","#         return loss.mean()","#     else:","#         return loss.sum()","","class FeatureRegression(nn.Module):","    def __init__(self, input_size):","        super(FeatureRegression, self).__init__()","        self.build(input_size)","","    def build(self, input_size):","        self.W = Parameter(torch.Tensor(input_size, input_size))","        self.b = Parameter(torch.Tensor(input_size))","","        m = torch.ones(input_size, input_size) - \\","            torch.eye(input_size, input_size)","        self.register_buffer('m', m)","","        self.reset_parameters()","","    def reset_parameters(self):","        stdv = 1. / math.sqrt(self.W.size(0))","        self.W.data.uniform_(-stdv, stdv)","        if self.b is not None:","            self.b.data.uniform_(-stdv, stdv)","","    def forward(self, x):","        z_h = F.linear(x, self.W * Variable(self.m), self.b)","        z_h = F.sigmoid(z_h)","        return z_h","","","class TemporalDecay(nn.Module):","    def __init__(self, input_size, output_size, diag=False):","        super(TemporalDecay, self).__init__()","        self.diag = diag","","        self.build(input_size, output_size)","","    def build(self, input_size, output_size):","        self.W = Parameter(torch.Tensor(output_size, input_size))","        self.b = Parameter(torch.Tensor(output_size))","","        if self.diag == True:","            assert (input_size == output_size)","            m = torch.eye(input_size, input_size)","            self.register_buffer('m', m)","","        self.reset_parameters()","","    def reset_parameters(self):","        stdv = 1. / math.sqrt(self.W.size(0))","        self.W.data.uniform_(-stdv, stdv)","        if self.b is not None:","            self.b.data.uniform_(-stdv, stdv)","","    def forward(self, d):","        if self.diag == True:","            gamma = F.relu(F.linear(d, self.W * Variable(self.m), self.b))","        else:","            gamma = F.relu(F.linear(d, self.W, self.b))","        gamma = torch.exp(-gamma)","        return gamma","","","class Model(nn.Module):","    def __init__(self, args):","        super(Model, self).__init__()","","        self.seq_len = args.seq_len","        self.input_size = args.channels ","        self.rnn_hid_size = args.rnn_hid_size","        self.imputed_weight = args.imputed_weight","","        self.build()","","    def build(self):","        self.rnn_cell = nn.LSTMCell(self.input_size*2, self.rnn_hid_size)","","        self.temp_decay_h = TemporalDecay(","            input_size=self.input_size, output_size=self.rnn_hid_size, diag=False)","        self.temp_decay_x = TemporalDecay(","            input_size=self.input_size, output_size=self.input_size, diag=True)","","        self.hist_reg = nn.Linear(self.rnn_hid_size, self.input_size)","        self.feat_reg = FeatureRegression(self.input_size)","","        self.weight_combine = nn.Linear(","            self.input_size * 2, self.input_size)","","        self.dropout = nn.Dropout(p = 0.25)","        # self.out = nn.Linear(self.rnn_hid_size, 1)","","        # self.delta_calc()","","    def delta_calc(self, masks):","        \"\"\"[TSP 수정 #6] 원본 delta_calc_orig 와 **값이 완전히 같은** 계산을 빠르게 한다(속도만 바꿈).","        원본은 (배치 × 시점 × 변수) 원소마다 파이썬 반복 → 배치·epoch 마다 수천 번의 작은 텐서 연산(GPU 면 매번 동기화)이라","        학습 시간 대부분을 차지했다. 원본 규칙(변수 축 d−1 을 참조하는 원본 그대로의 규칙 포함)을 변수 축 반복 하나로 옮겼다.","        시점·배치 축은 서로 의존하지 않아 한 번에 계산한다. 같음은 tests/test_biva_src.py 가 무작위 결측 패턴으로 확인.\"\"\"","        B, T, D = masks.shape","        delta = torch.zeros_like(masks)","        if T < 2:","            return delta","        prev_missing = masks[:, :-1, :] == 0      # masks[b, t-1, d] == 0  (t ≥ 1)","        cur = masks[:, 1:, :]                     # masks[b, t, ·]          (t ≥ 1)","        for d in range(D):","            # 원본 d=0 일 때 delta[b,t,d-1] = delta[b,t,D-1] 은 아직 계산 전이라 0, masks[b,t,d-1] = masks[b,t,D-1]","            prev_delta = delta[:, 1:, d - 1] if d > 0 else torch.zeros_like(cur[:, :, 0])","            one = torch.ones_like(prev_delta)","            delta[:, 1:, d] = torch.where(prev_missing[:, :, d], prev_delta + one,","                                          torch.where(cur[:, :, d - 1] == 1, one, torch.zeros_like(one)))","        return delta","","    def delta_calc_orig(self, masks):","        # 원본 그대로(비교 시험용). [TSP 수정 #6]","        delta = torch.zeros_like(masks)","        # print(f\"delta.shape : {delta.shape}\")","        for b in range(masks.shape[0]):","          for t in range(masks.shape[1]):","              for d in range(masks.shape[2]):","                  if t == 0:","                      delta[b,t,d] = 0","                  elif masks[b,t-1,d] == 0 and t > 0:","                      delta[b,t,d] = delta[b,t,d-1]+t-(t-1)","                  elif masks[b,t,d-1] == 1 and t > 0:","                      delta[b,t,d] = t - (t-1)","        return delta","","    def forward(self, data, direct):","","        # make function for each section data","        if direct == 'forward':","            values = data","        else: # 'backward'","            # print(f\"forward value: \\n {data[0]} {data[0].shape}\")","            # 원본: values = torch.flip(data,[1]).cuda()","            values = torch.flip(data,[1])  # [TSP 수정 #3] 입력 장치 그대로(원본은 GPU 고정 → CPU 에서 오류)","            # print(f\"reverse value: \\n {values[0]} {values[0].shape}\")","            # raise","            ","        masks = torch.logical_not(torch.isnan(values)).float()","        # print(f\"masks.shape: {masks.shape}\")","        # just 1step is time-strimp 1 month step","        deltas = self.delta_calc(masks)","","        # 원본: h = Variable(torch.zeros((values.size()[0], self.rnn_hid_size)))","        # 원본: c = Variable(torch.zeros((values.size()[0], self.rnn_hid_size)))","        # [TSP 수정 #3] 은닉 상태를 입력과 같은 장치에(원본은 항상 CPU → GPU 에서 장치 불일치 오류)","        h = Variable(torch.zeros((values.size()[0], self.rnn_hid_size), device=values.device))","        c = Variable(torch.zeros((values.size()[0], self.rnn_hid_size), device=values.device))","","        #if torch.cuda.is_available():","        #    h, c = h.cuda(), c.cuda()","            ","        x_loss = 0.0","","        imputations = []","","        for t in range(self.seq_len):","            x = values[:, t, :]","            m = masks[:, t, :]","            d = deltas[:, t, :]","","            gamma_h = self.temp_decay_h(d)","            gamma_x = self.temp_decay_x(d)","            ","            h = h * gamma_h","            x_h = self.hist_reg(h)","            x_h = F.sigmoid(x_h)","            ","            x_loss += torch.sum(torch.abs(torch.nan_to_num(x) - x_h) * m) / (torch.sum(m) + 1e-5)","","            x_c = m * torch.nan_to_num(x) + (1 - m) * x_h","            z_h = self.feat_reg(x_c)","            ","            x_loss += torch.sum(torch.abs(torch.nan_to_num(x) - z_h) * m) / (torch.sum(m) + 1e-5)","","            alpha = self.weight_combine(torch.cat([gamma_x, m], dim=1))","            # c_h = alpha * z_h + (1 - alpha) * x_h","            c_h = torch.abs(0.5 * z_h + 0.5 * x_h)","            ","            c_c = m * torch.nan_to_num(x) + (1 - m) * c_h","","            inputs = torch.cat([c_c, m], dim=1)","            h, c = self.rnn_cell(inputs, (h, c))","","            imputations.append(c_c.unsqueeze(dim=1))","","        imputations = torch.cat(imputations, dim=1)","","        return {'loss': x_loss * self.imputed_weight,'imputations': imputations} ","","        # return {'imputations': imputations}",""],"models/biva_src/tools_orig.py":["\"\"\"원본 utils/tools.py 에서 학습 루프가 쓰는 두 개(adjust_learning_rate, EarlyStopping)만 그대로 가져옴. 수정 없음.\"\"\"","import numpy as np","import torch","","","def adjust_learning_rate(optimizer, epoch, args):","    # lr = args.learning_rate * (0.2 ** (epoch // 2))","    if args.lradj == 'dtype1':","        lr_adjust = {epoch: args.learning_rate * (0.5 ** ((epoch - 1) // 1))}","    elif args.lradj == 'dtype2':","        lr_adjust = {","            2: 5e-5, 4: 1e-5, 6: 5e-6, 8: 1e-6, 10: 5e-7, 15: 1e-7, 20: 5e-8","        }","    elif args.lradj == 'type-e':","        lr_adjust = {epoch: 0.2}","        if epoch <= 20:","             lr_adjust[epoch] = 0.15","        elif lr_adjust[epoch] <= 0.001:","            lr_adjust[epoch] = 0.001","        else:","            lr_adjust = {epoch: args.learning_rate * (0.95 ** (epoch // 1))}","","    elif args.lradj == '1':","        lr_adjust = {epoch: args.learning_rate * (0.98 ** (ep   const lo = tf(t.ylo ?? Math.min(...all)), hi = tf(t.yhi ?? Math.max(...all));
  const X = i => pad.l + (W - pad.l - pad.r) * (i / (xs.length - 1 || 1)), Y = v => pad.t + (H - pad.t - pad.b) * (1 - (tf(v) - lo) / ((hi - lo) || 1));
  c.strokeStyle = '#c9ced6'; c.beginPath(); c.moveTo(pad.l, pad.t); c.lineTo(pad.l, H - pad.b); c.lineTo(W - pad.r, H - pad.b); c.stroke();
  c.fillStyle = '#5b6372'; c.font = '11px sans-serif'; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let k = 0; k <= 4; k++) { const u = lo + (hi - lo) * k / 4, v = t.ylog ? Math.pow(10, u) : u; const yy = pad.t + (H - pad.t - pad.b) * (1 - k / 4);
    c.fillText(t.ylog ? (v >= 1 ? v.toFixed(v >= 10 ? 0 : 1) : v.toPrecision(2)) : axisFmt(v, lo, hi), pad.l - 6, yy); c.strokeStyle = '#eceff3'; c.beginPath(); c.moveTo(pad.l, yy); c.lineTo(W - pad.r, yy); c.stroke(); }
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; const every = Math.ceil(xs.length / 12);
  xs.forEach((x, i) => { if (i % every === 0 || i === xs.length - 1) c.fillText(x, X(i), H - pad.b + 14); });
  if (t.xlabel) c.fillText(t.xlabel + (t.ylog ? '   (세로축 로그 눈금)' : ''), (W + pad.l) / 2, H - 4);
  (t.vlines || []).forEach((v, k) => { c.strokeStyle = v.color || '#2f8f5b'; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(X(v.i), pad.t); c.lineTo(X(v.i), H - pad.b); c.stroke(); c.setLineDash([]);
    c.fillStyle = v.color || '#2f8f5b'; c.textAlign = 'left'; c.fillText(v.label, X(v.i) + 4, pad.t + 12 + k * 14); });
  c.save(); c.beginPath(); c.rect(pad.l - 3, pad.t - 3, W - pad.l - pad.r + 6, H - pad.t - pad.b + 6); c.clip();   // ylo·yhi 밖은 잘라 그림
  for (const s of t.series) { c.strokeStyle = s.color; c.lineWidth = 2; c.beginPath(); let st = false; s.y.forEach((v, i) => { if (v === null || (t.ylog && v <= 0)) return; if (!st) { c.moveTo(X(i), Y(v)); st = true; } else c.lineTo(X(i), Y(v)); }); c.stroke();
    if (s.dots) s.y.forEach((v, i) => { if (v !== null && !(t.ylog && v <= 0)) { c.fillStyle = s.color; c.beginPath(); c.arc(X(i), Y(v), 2.5, 0, 7); c.fill(); } }); }
  c.restore();
  // 범례: 오른쪽 위
  c.font = '12px sans-serif'; let lx = W - pad.r - t.series.reduce((a, s) => a + 34 + c.measureText(s.name).width, 0);
  for (const s of t.series) { c.fillStyle = s.color; c.fillRect(lx, 6, 16, 3); c.fillStyle = '#1c2027'; c.textAlign = 'left'; c.fillText(s.name, lx + 20, 11); lx += 34 + c.measureText(s.name).width; }

}
function segBar(t) {

  const cv = document.createElement('canvas'); const dpr = Math.max(2, window.devicePixelRatio || 1); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const c = cv.getContext('2d'); c.scale(dpr, dpr); const tot = t.segs.reduce((a, s) => a + s.n, 0); let x = 0;
  for (const s of t.segs) { const w = (W - 2) * s.n / tot; c.fillStyle = s.color; c.fillRect(x + 1, 8, Math.max(w - 2, 1), 26); c.fillStyle = '#1c2027'; c.font = '12px sans-serif'; c.textAlign = 'center';
    if (w > 40) c.fillText(`${s.label} ${s.n}`, x + w / 2, 25); c.fillStyle = '#5b6372'; c.font = '11px sans-serif'; if (s.sub && w > 60) c.fillText(s.sub, x + w / 2, 50); x += w; }

function renderTensor(t) {
  const box = document.createElement('div'); box.className = 'tz';
  box.innerHTML = `<h3>${t.title || ''}${t.shape ? `<span class="shape">[${t.shape.join(', ')}]</span>` : ''}${t.note ? `<span class="note">${t.note}</span>` : ''}</h3>`;
  if (t.type === 'heat') box.appendChild(heat(t));
  else if (t.type === 'batch') { for (const [k, m] of t.mats.entries()) { const sub = document.createElement('div'); sub.style.margin = '2px 0 6px'; const lab = document.createElement('div'); lab.style.cssText = 'font-size:12px;color:#5b6372;margin:2px 0'; lab.textContent = t.labels[k]; sub.appendChild(lab); sub.appendChild(heat({ ...t, data: m, rows: (t.rowsEach && t.rowsEach[k]) || t.rows, hl: (t.hlEach && t.hlEach[k]) || t.hl, colLabelH: k === 0 ? (t.colLabelH ?? 44) : 4 })); box.appendChild(sub); } }
  else if (t.type === 'num') { const d = document.createElement('div'); d.innerHTML = t.items.map(it => `<div style="display:inline-block;margin:4px 26px 4px 0"><div style="font-size:12.5px;color:#5b6372">${it.label}</div><div class="big" style="${it.color ? 'color:' + it.color : ''}">${it.value}</div>${it.sub ? `<div style="font-size:12px;color:#5b6372">${it.sub}</div>` : ''}</div>`).join(''); box.appendChild(d); }

      tb.innerHTML = `<thead><tr>${t.columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${part.map((r, i) => `<tr class="${(t.hlRows || []).includes(q * per + i) ? 'hl' : ''}">${r.map(v => typeof v === 'number' || v === null ? `<td class="n">${fmt(v, t.digits)}</td>` : `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>`; wrap.appendChild(tb); }
    box.appendChild(wrap); }
  else if (t.type === 'line') box.appendChild(lineChart(t));
  else if (t.type === 'segs') box.appendChild(segBar(t));

  else if (t.type === 'row') { const d = document.createElement('div'); d.style.cssText = 'display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap'; for (const it of t.items) d.appendChild(renderTensor(it)); box.appendChild(d); }

/* ---------------- 코드 ---------------- */
function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function showCode(st) {
  const cd = st.code; if (!cd) { $('code').innerHTML = ''; $('fileh').textContent = ''; $('code').scrollTop = 0; return; }
  const src = S.sources[cd.file] || [];
  const lines = (cd.lines && cd.lines.length ? cd.lines : [cd.focus]).slice().sort((a, b) => a - b);
  const hl = new Set(lines), focus = cd.focus ?? lines[0];
  // 강조 줄이 멀리 떨어져 있으면 묶음(cluster)마다 따로 보여 주고 사이를 ⋯ 로 줄인다(정의부 + 호출부를 한 화면에)
  const groups = []; for (const l of lines) { const g = groups[groups.length - 1]; if (g && l - g[g.length - 1] <= 14) g.push(l); else groups.push([l]); }
  const fg = groups.find(g => g.includes(focus)) || groups[0];
  let h = '', prevHi = 0;
  for (const g of groups) {
    const main = g === fg, lo = Math.max(1, g[0] - (main ? (cd.before ?? 8) : 2)), hi = Math.min(src.length, g[g.length - 1] + (main ? (cd.after ?? 10) : 2));
    const a = Math.max(lo, prevHi + 1); if (prevHi && a > prevHi + 1) h += `<span class="ln gap"><span class="no">⋯</span>(줄 ${prevHi + 1}–${a - 1} 생략)</span>`;
    for (let i = a; i <= hi; i++) {
      const t = (src[i - 1] ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      h += `<span class="ln${hl.has(i) ? ' hl' : ''}${i === focus ? ' focus' : ''}" id="L${i}"><span class="no">${i}</span>${t || ' '}</span>`;
      const nt = cd.notes && cd.notes[String(i)]; if (nt) h += `<span class="ln note">${esc(nt)}</span>`;
    }
    prevHi = Math.max(prevHi, hi);
  }
  $('code').innerHTML = h;
  const rng = groups.map(g => g.length > 1 ? g[0] + '–' + g[g.length - 1] : '' + g[0]).join(', ');
  $('fileh').textContent = `${cd.file}  ·  ${cd.func || ''}  ·  줄 ${rng}`;
  const f = document.getElementById('L' + focus); const pre = $('code');
  if (f) pre.scrollTop = Math.max(0, f.offsetTop - pre.clientHeight * 0.35); else pre.scrollTop = 0;
}

/* ---------------- 직접 실행해 보기 ---------------- */
// 혼자 도는 파이썬 코드(실행 기록의 숫자를 그대로 넣음). 기대 출력 = 엔진 값 — 대본을 만들 때 실제로 실행해 같은지 확인했다(tools/codewalk/common.run_lab).
function tutorUrl(code) { return 'https://pythontutor.com/visualize.html#code=' + encodeURIComponent(code) + '&cumulative=false&heapPrimitives=nevernest&mode=edit&origin=opt-frontend.js&py=311&rawInputLstJSON=%5B%5D&textReferences=false'; }
function renderLab(L) {
  const d = document.createElement('details'); d.className = 'lab';
  const tut = L.tutor === undefined ? L.pure : L.tutor;   // Python Tutor 로 열 수 있는지(예전 대본은 pure 와 같음)

    + `<div class="desc">${esc(L.desc || '')}</div><pre>${esc(L.code)}</pre><div class="outh">기대 출력 (엔진 값)${L.tol ? ` — 엔진은 32비트 실수로 계산해서, 이 코드(64비트)의 출력과 끝자리가 조금 다를 수 있습니다(상대오차 ${L.tol} 이내 확인)` : ''}</div><pre class="out">${esc(L.expect)}</pre>`
    + `<div class="row">${tut ? `<a class="btn pri" target="_blank" rel="noopener" href="${tutorUrl(L.code)}">Python Tutor 에서 한 줄씩 보기 ↗</a>` : `<a class="btn pri" target="_blank" rel="noopener" href="https://colab.research.google.com/#create=true">Colab 새 노트 열기 ↗</a>`}`
    + `<button type="button" class="cp">코드 복사</button><span class="note">코드와 숫자가 그 사이트로 전송됩니다(공개 시장·경제 자료).</span></div>`;
  d.querySelector('.cp').onclick = ev => { ev.preventDefault(); (navigator.clipboard ? navigator.clipboard.writeText(L.code) : Promise.reject()).then(() => { ev.target.textContent = '복사됨'; }, () => { ev.target.textContent = '복사 실패 — 코드를 직접 선택하세요'; }); };

/* ---------------- 단계 ---------------- */
function show(i) {
  cur = Math.max(0, Math.min(S.steps.length - 1, i));
  const st = S.steps[cur];
  $('ttl').textContent = S.title; $('chap').textContent = st.chapter; $('cnt').textContent = `${cur + 1} / ${S.steps.length}`;
  $('prog').querySelector('.fill').style.width = (100 * (cur + 1) / S.steps.length) + '%';
  markDiagram(st);
  $('crumb').innerHTML = (st.stack || []).map((s, k) => k === st.stack.length - 1 ? `<b>${s}</b>` : s).join('<span class="sep">›</span>');
  showCode(st);
  const T = $('tensors'); T.innerHTML = ''; const Z = document.createElement('div'); Z.className = 'zoomer'; T.appendChild(Z);
  for (const t of st.tensors || []) Z.appendChild(renderTensor(t)); if (st.lab) Z.appendChild(renderLab(st.lab)); T.scrollTop = 0;

  $('narr').innerHTML = st.narr; $('formula').textContent = st.formula || ''; $('cap').textContent = (st.captions || [])[0] || '';
  $('hintt').textContent = st.hint || ''; $('hint').style.display = st.hint ? '' : 'none'; $('hint').open = $('autohint').checked || params.get('film') === '1' && !!st.hint;
  const ck = st.checks || []; $('checks').className = ck.every(c => c.ok) ? '' : 'bad';
  $('checks').textContent = ck.length ? '검증: ' + ck.map(c => (c.ok ? '✓ ' : '✗ ') + c.what).join(' · ') : '';
  $('selch').value = st.chapter;
  fitTensors();
  if (playing) schedule();
}
// 한 화면에 다 보이게: 넘치면 0.6 배까지 줄인다(그보다 더 넘치면 스크롤). 설명·힌트 높이가 정해진 뒤에 잰다.
function fitTensors() { const T = $('tensors'), Z = T.querySelector('.zoomer'); if (!Z) return; Z.style.zoom = 1;
  const avail = T.clientHeight - 26, need = Z.scrollHeight; if (need > avail) { Z.style.zoom = Math.max(0.6, avail / need); return; }
  // 내용이 작으면 키운다(최대 1.4배) — 표·그림의 실제 너비(가장 오른쪽 끝)와 높이가 모두 들어갈 때만
  const z0 = Z.getBoundingClientRect().left, w = Math.max(1, ...[...Z.querySelectorAll('table,canvas,svg,.big')].map(e => e.getBoundingClientRect().right - z0));
  const up = Math.min(1.4, avail / need, (T.clientWidth - 24) / w); if (up > 1.05) Z.style.zoom = up; }
function stepDur(st) { const n = (st.narr || '').replace(/<[^>]+>/g, '').length + (st.formula || '').length * 0.4; return (st.dur || Math.min(34, Math.max(7, 3 + n * 0.11))) / parseFloat($('speed').value); }
// 음성용으로 기호를 읽을 수 있는 말로(화면 글자는 그대로)
function sayable(t) {
  const M = [[/x̂/g, '엑스 햇'], [/ẑ/g, '제트 햇'], [/ĉ/g, '씨 햇'], [/ŷ/g, '와이 햇'], [/τ/g, '타우 '], [/γ_h/g, '감마 에이치'], [/γ_x/g, '감마 엑스'], [/γ/g, '감마'],
    [/σ²/g, '시그마 제곱'], [/σ/g, '시그마'], [/μ/g, '뮤'], [/α/g, '알파'], [/ε/g, '엡실론'], [/δ/g, '델타'], [/Σ/g, '합'], [/⊙/g, ' 곱하기 '], [/×/g, ' 곱하기 '], [/÷/g, ' 나누기 '],
    [/→/g, ' 에서 '], [/≥/g, ' 이상 '], [/≤/g, ' 이하 '], [/−/g, ' 빼기 '], [/·/g, ', '], [/\[(\d+), (\d+), (\d+)\]/g, '$1 곱하기 $2 곱하기 $3'], [/\[(\d+), (\d+)\]/g, '$1 곱하기 $2'], [/_/g, ' ']];

function stopAudio() { if (audioEl) { audioEl.onended = audioEl.onerror = audioEl.ontimeupdate = null; audioEl.pause(); audioEl = null; } if (!params.get('cap')) document.body.classList.remove('cap'); }
window.setCap = k => { const st = S.steps[cur], c = st.captions || []; $('cap').textContent = c[k] ?? ''; };
// 녹음된 설명 음성(S.audio: tools/narrate.py 가 만든 단계별 mp3 + 자막 줄 시각)이 있으면 그것을 재생하며 자막을 바꾼다. 없으면 브라우저 음성.
function speak(st, done) {
  const A = S.audio && S.audio.steps && S.audio.steps[String(cur)];
  if (A) {
    stopAudio(); const caps = st.captions || []; document.body.classList.add('cap'); $('cap').textContent = caps[0] || '';
    audioEl = new Audio(S.audio.dir + A.file); audioEl.playbackRate = parseFloat($('speed').value);
    audioEl.ontimeupdate = () => { const t = audioEl.currentTime; let k = 0; A.segs.forEach((g, i) => { if (t >= g[0] - 0.05) k = i; }); $('cap').textContent = caps[k] || ''; };
    audioEl.onended = () => { stopAudio(); done(); }; audioEl.onerror = () => { stopAudio(); speakTTS(st, done); };

}
function speakTTS(st, done) {

  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(st.speech && st.speech.length ? st.speech.join(' ') : sayable((st.say || st.narr).replace(/<[^>]+>/g, '')));
  u.lang = 'ko-KR'; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko')); if (v) u.voice = v;
  u.rate = parseFloat($('speed').value); u.onend = () => done(); u.onerror = () => done(); utter = u; speechSynthesis.speak(u);
}
function schedule() {
  clearTimeout(timer); if ('speechSynthesis' in window) speechSynthesis.cancel(); stopAudio();
  const st = S.steps[cur], next = () => { if (cur < S.steps.length - 1) show(cur + 1); else togglePlay(false); };
  if ($('voice').checked) speak(st, () => { timer = setTimeout(next, 900); }); else timer = setTimeout(next, stepDur(st) * 1000);
}
function togglePlay(on) { playing = on ?? !playing; $('bplay').textContent = playing ? '⏸ 멈춤' : '▶ 재생'; if (playing) schedule(); else { clearTimeout(timer); if ('speechSynthesis' in window) speechSynthesis.cancel(); stopAudio(); } }
function init() {
  drawDiagram();
  const chs = [...new Set(S.steps.map(s => s.chapter))];
  $('selch').innerHTML = chs.map(c => `<option>${c}</option>`).join('');
  $('selch').onchange = e => show(S.steps.findIndex(s => s.chapter === e.target.value));
  const pg = $('prog'); chs.forEach(c => { const i = S.steps.findIndex(s => s.chapter === c); const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (100 * i / S.steps.length) + '%'; tk.title = c; pg.appendChild(tk); });
  pg.onclick = e => { const r = pg.getBoundingClientRect(); show(Math.floor((e.clientX - r.left) / r.width * S.steps.length)); };
  $('bprev').onclick = () => show(cur - 1); $('bnext').onclick = () => show(cur + 1); $('bplay').onclick = () => togglePlay();
  $('autohint').onchange = () => show(cur); $('voice').onchange = () => { if (playing) schedule(); };
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === ' ') { e.preventDefault(); togglePlay(); } });
  window.addEventListener('resize', () => show(cur));
  show(parseInt(params.get('step') || '1') - 1);
}
window.goto = i => show(i);
init();
