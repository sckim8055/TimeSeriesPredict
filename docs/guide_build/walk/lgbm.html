p = diebold_mariano_brier(ev[\"prediction\"].values, yb, h=k); pm.update(dm_vs_zero=dm, dm_vs_zero_p=p, dm_baseline=\"brier_vs_0.5\")","        nb = ev[\"naive\"].clip(0, 1).values","        dm, p = diebold_mariano(ev[\"prediction\"].values - yb, nb - yb, h=k); pm.update(dm_vs_naive=dm, dm_vs_naive_p=p)","    return pm, ev","","","def _finish_forecast(cfg, plugin, params, ds, device, pred, fit, importances, n_folds, k, target_type, sealed, sealed_from, t0, fold_log: list | None = None) -> dict:","    \"\"\"예측 연구 모드 마무리: 체결·비용 없음. 오차 지표 + 0예측·naive(지속) 대비 DM. 봉인 처리는 매매 모드와 같은 규칙.\"\"\"","    if sealed:","        if sealed_from is None:","            raise ValueError(\"봉인 평가에는 validation.sealed_from 이 필요합니다\")","        pred = pred.where(pred.index >= sealed_from)  # 위(_run_experiment)에서 봉인 폴드로 이미 예측했다","    elif sealed_from is not None:","        pred = pred.where(pred.index < sealed_from)","    y = ds.y","    naive = cal.naive_forecast(y, k)","    level = ds.prices[\"close\"]","    # 예측 수익률 → k기간 뒤 수준값: return 이면 v(1+ŷ), logreturn 이면 v·exp(ŷ). 분류(방향)는 수준값이 정의되지 않음.","    kind = cfg.target.kind","    if kind == \"return\":","        pfl = level * (1 + pred)","    elif kind == \"logreturn\":","        pfl = level * np.exp(pred)","    else:","        pfl = pd.Series(np.nan, index=level.index)","    daily_full = pd.DataFrame({\"level\": level, \"target\": y, \"prediction\": pred, \"naive\": naive,","                               \"actual_future_level\": level.shift(-k), \"pred_future_level\": pfl.where(pred.notna())})","    if fit is not None:","        daily_full[\"fit\"] = fit","    pm, ev = forecast_metrics(daily_full, cfg.target.kind, k, target_type)","    fi_mean = np.mean(importances, axis=0).tolist() if importances else None","    degenerate = bool(fi_mean is not None and len(fi_mean) > 0 and float(np.nansum(np.abs(fi_mean))) == 0.0)","    if degenerate:","        print(\"  [경고] 모델이 어떤 입력도 쓰지 않음(중요도 전부 0) → 상수 예측\")","    return {","        \"config\": json.loads(cfg.model_dump_json()), \"config_hash\": cfg.config_hash(),","        \"model\": {\"file\": cfg.model, \"name\": plugin.NAME, \"input_shape\": plugin.INPUT_SHAPE, \"params\": params},","        \"data_version\": cfg.data_version, \"code_version\": _code_version(), \"engine_rev\": ENGINE_REV, \"n_folds\": n_folds, \"n_features\": len(ds.feature_names),","        \"feature_names\": ds.feature_names, \"feature_importance\": fi_mean, \"degenerate_model\": degenerate,","        \"sealed_evaluation\": bool(sealed), \"evaluation_period\": [str(ev.index[0].date()), str(ev.index[-1].date())],","        \"leak_warning\": ds.leak_warning, \"lag_days_used\": ds.lag_days_used, \"lag_unconfirmed\": ds.lag_unconfirmed, \"transforms_used\": ds.transforms_used,","        \"prediction_metrics\": pm, \"performance\": {}, \"period\": [str(daily_full.index[0].date()), str(daily_full.index[-1].date())],","        \"prediction_period\": [str(ev.index[0].date()), str(ev.index[-1].date())], \"n_predictions\": int(len(ev)),","        \"variable_first_date\": {c: (str(ds.X[c].first_valid_index().date()) if ds.X[c].first_valid_index() is not None else None) for c in ds.feature_names if not c.startswith(\"A_\")},","        \"device\": device, \"seconds\": round(time.time() - t0, 1), \"_daily\": daily_full,","    }","","","def trial_sharpe_variance(results_dir: str | Path, periods_per_year: int) -> float | None:","    \"\"\"지금까지 저장된 실험들의 기간 샤프 분산 (Deflated Sharpe 의 V). 같은 주기(periods_per_year)의 결과만. 2개 미만이면 None.","    results_dir 는 모드별 폴더(results/trading)여야 한다 — 2026-11-04 이주 뒤 cli 가 results/ 바로 아래를 넘겨 V 가 늘 None(근사 1/(n−1))이었다(2026-11-06 수정).","    봉인 평가 결과는 '시도'가 아니므로 뺀다.\"\"\"","    srs = []","    for p in Path(results_dir).glob(\"*.json\"):","        if p.name in (\"experiment_counter.json\", \"sealed_log.json\") or p.name.startswith(\"ablation_\"):","            continue","        try:","            r = json.loads(p.read_text(encoding=\"utf-8\"))","            ppy = {\"D\": 252, \"W\": 52, \"M\": 12}.get(r[\"config\"][\"frequency\"])","            sh = r[\"performance\"].get(\"sharpe\")","            if r.get(\"sealed_evaluation\"):","                continue","            if ppy == periods_per_year and sh is not None and np.isfinite(sh):","                srs.append(sh / np.sqrt(ppy))","        except Exception:  # noqa: BLE001","            continue","    return float(np.var(srs, ddof=1)) if len(srs) >= 2 else None","","","def results_dir(root: str | Path, mode: str) -> Path:","    \"\"\"모드별 결과 저장소: results/trading, results/forecast. 카운터·봉인 기록도 각각.","    2026-11-04 이전 결과(results/ 바로 아래)는 처음 호출 때 results/trading 으로 옮긴다(1회 이주).\"\"\"","    root = Path(root)","    d = root / (\"forecast\" if mode == \"forecast\" else \"trading\")","    d.mkdir(parents=True, exist_ok=True)","    legacy = [p for p in root.iterdir() if p.is_file() and p.suffix in (\".json\", \".parquet\", \".csv\", \".md\")]","    if legacy:","        tdir = root / \"trading\"; tdir.mkdir(exist_ok=True)","        for p in legacy:","            target = tdir / p.name","            if not target.exists():","                p.rename(target)","        print(f\"  [이주] 옛 결과 {len(legacy)}개 → results/trading/\")","    return d","","","def save_result(res: dict, out_dir: str | Path) -> Path:","    out = Path(out_dir)","    out.mkdir(parents=True, exist_ok=True)","    stem = f\"{res['config']['name'] or res['model']['file']}_{res['config_hash']}\"","    if res.get(\"sealed_evaluation\"):  # 봉인 결과는 같은 설정의 개발 결과와 이름이 같아 덮어쓰지 않도록 따로(같은 설정을 다시 열면 번호)","        stem += \"_sealed\"","        n = 2","        while (out / f\"{stem}.json\").exists():","            stem = f\"{stem.rsplit('_sealed', 1)[0]}_sealed{n}\"; n += 1","    daily = res.pop(\"_daily\")","    daily.to_parquet(out / f\"{stem}_daily.parquet\")","    (out / f\"{stem}.json\").write_text(json.dumps(res, ensure_ascii=False, indent=1, default=float), encoding=\"utf-8\")","    res[\"_daily\"] = daily","    return out / f\"{stem}.json\"",""],"engine/features.py":["\"\"\"A그룹(가격·기술지표) 파생변수. 입력은 OHLCV(거래일 인덱스), 출력은 같은 인덱스의 DataFrame.","","규칙: 모든 지표는 t일 마감 시점까지의 정보만 쓴다 (rolling·shift는 과거 방향만). 미래를 보는 연산 금지.","각 지표의 공식은 docstring에 적는다 — 논문·교재에서 그대로 인용할 수 있게.","\"\"\"","from __future__ import annotations","","import numpy as np","import pandas as pd","","","def returns(close: pd.Series, lags: tuple[int, ...] = (1, 2, 3, 5, 10, 20)) -> pd.DataFrame:","    \"\"\"과거 수익률 r_{t-l+1..t} = close_t / close_{t-l} - 1 (l일 누적).\"\"\"","    return pd.DataFrame({f\"ret_{l}\": close / close.shift(l) - 1.0 for l in lags})","","","def moving_average_ratio(close: pd.Series, windows: tuple[int, ...] = (5, 20, 60, 120)) -> pd.DataFrame:","    \"\"\"종가 / 단순이동평균(w) - 1. 수준이 아닌 비율로 두어 비정상성을 피한다.\"\"\"","    return pd.DataFrame({f\"ma_ratio_{w}\": close / close.rolling(w).mean() - 1.0 for w in windows})","","","def volatility(close: pd.Series, windows: tuple[int, ...] = (20, 60), periods_per_year: int = 252) -> pd.DataFrame:","    \"\"\"로그수익률의 롤링 표준편차 × sqrt(periods_per_year) (연율화). 주기가 주간이면 52, 월간이면 12.\"\"\"","    lr = np.log(close).diff()","    return pd.DataFrame({f\"vol_{w}\": lr.rolling(w).std() * np.sqrt(periods_per_year) for w in windows})","","","def rsi(close: pd.Series, window: int = 14) -> pd.Series:","    \"\"\"Wilder RSI. RS = EMA(상승폭)/EMA(하락폭), RSI = 100 − 100/(1+RS). 범위 0~100.\"\"\"","    d = close.diff()","    up = d.clip(lower=0).ewm(alpha=1 / window, adjust=False).mean()","    dn = (-d.clip(upper=0)).ewm(alpha=1 / window, adjust=False).mean()","    rs = up / dn.replace(0, np.nan)","    return (100 - 100 / (1 + rs)).rename(f\"rsi_{window}\")","","","def macd(close: pd.Series, fast: int = 12, slow: int = 26, signal: int = 9) -> pd.DataFrame:","    \"\"\"MACD = EMA_fast − EMA_slow, Signal = EMA_signal(MACD), Hist = MACD − Signal. 종가로 나눠 비율화.\"\"\"","    ef = close.ewm(span=fast, adjust=False).mean()","    es = close.ewm(span=slow, adjust=False).mean()","    m = ef - es","    s = m.ewm(span=signal, adjust=False).mean()","    return pd.DataFrame({\"macd\": m / close, \"macd_signal\": s / close, \"macd_hist\": (m - s) / close})","","","def volume_features(volume: pd.Series, windows: tuple[int, ...] = (5, 20)) -> pd.DataFrame:","    \"\"\"거래량 / 롤링 평균 거래량 − 1.\"\"\"","    return pd.DataFrame({f\"vol_ratio_{w}\": volume / volume.rolling(w).mean() - 1.0 for w in windows})","","","PRESETS = {","    # 주기별 창 (기간 수). 일간 기준을 주간·월간의 같은 달력 길이로 환산","    \"D\": dict(lags=(1, 2, 3, 5, 10, 20), ma=(5, 20, 60, 120), vol=(20, 60), rsi=14, macd=(12, 26, 9), volume=(5, 20)),","    \"W\": dict(lags=(1, 2, 4, 8, 13, 26), ma=(4, 13, 26, 52), vol=(13, 26), rsi=8, macd=(6, 13, 5), volume=(4, 13)),","    \"M\": dict(lags=(1, 2, 3, 6, 12), ma=(3, 6, 12, 24), vol=(6, 12), rsi=6, macd=(3, 6, 3), volume=(3, 12)),","}","","","def technical_block(ohlcv: pd.DataFrame, freq: str = \"D\", *, with_volume: bool = True) -> pd.DataFrame:","    \"\"\"A그룹 기본 세트 한 번에. 열 이름 접두어 'A_'. 창 길이는 매매 주기(freq)에 맞춘 PRESETS 사용.","    with_volume=False 면 거래량 지표를 뺀다(예측 연구 모드: 지수에는 거래량이 없음).\"\"\"","    P = PRESETS[freq]","    c = ohlcv[\"close\"].astype(float)","    ppy = {\"D\": 252, \"W\": 52, \"M\": 12}[freq]","    parts = [returns(c, P[\"lags\"]), moving_average_ratio(c, P[\"ma\"]), volatility(c, P[\"vol\"], ppy), rsi(c, P[\"rsi\"]).to_frame(),","             macd(c, *P[\"macd\"])]","    if with_volume:","        parts.append(volume_features(ohlcv[\"volume\"].astype(float), P[\"volume\"]))","    out = pd.concat(parts, axis=1)","    out.columns = [f\"A_{x}\" for x in out.columns]","    return out","","","# ---------------------------------------------------------------------------","# 기술지표 열 이름 → 한글 설명 (화면·보고서용). 숫자는 주기 수(일간이면 거래일, 월간이면 개월).","# ---------------------------------------------------------------------------","import re as _re","","_DESC_RULES = [  # 화면·계산 따라가기에 쓰는 설명. 위 함수의 식과 글자 그대로 맞출 것(2026-11-06 점검: 변동성 연율화·MACD 비율화·거래량 −1 누락 정정)","    (r\"^A_ret_(\\d+)$\", lambda m: f\"{m.group(1)}주기 수익률 = 종가_t ÷ 종가_(t−{m.group(1)}) − 1\"),","    (r\"^A_ma_ratio_(\\d+)$\", lambda m: f\"종가 ÷ {m.group(1)}주기 단순이동평균 − 1 (추세 위치)\"),","    (r\"^A_vol_(\\d+)$\", lambda m: f\"{m.group(1)}주기 로그수익률 표본표준편차(n−1) × √(연간 주기 수) (연율 변동성)\"),","    (r\"^A_rsi_(\\d+)$\", lambda m: f\"RSI({m.group(1)}) = 100 − 100 ÷ (1 + 상승 평균 ÷ 하락 평균), Wilder 평활, 0~100\"),","    (r\"^A_macd$\", lambda m: \"MACD = (단기 EMA − 장기 EMA) ÷ 종가\"),","    (r\"^A_macd_signal$\", lambda m: \"MACD 시그널 = (MACD 의 EMA) ÷ 종가\"),","    (r\"^A_macd_hist$\", lambda m: \"MACD 히스토그램 = (MACD − 시그널) ÷ 종가\"),","    (r\"^A_vol_ratio_(\\d+)$\", lambda m: f\"거래량 ÷ {m.group(1)}주기 평균거래량 − 1 (거래 활기)\"),","]","","","def feature_description(name: str) -> str:","    for pat, fn in _DESC_RULES:","        m = _re.match(pat, name)","        if m:","            return fn(m)","    return \"\"","","","def describe_feature(name: str, registry=None) -> str:","    \"\"\"기술지표면 규칙으로, 레지스트리 변수면 '이름 — 설명' 으로, '_pct' 등 변환 접미사도 풀어 쓴다.\"\"\"","    d = feature_description(name)","    if d:","        return d","    base, _, tr = name.partition(\"_\") if name.count(\"_\") == 1 and name.rsplit(\"_\", 1)[-1] in (\"pct\", \"diff\", \"log\", \"logdiff\") else (name, \"\", \"\")","    if not tr:","        m = _re.match(r\"^(.*)_(pct\\d*|diff\\d*|log|logdiff)$\", name)","        if m:","            base, tr = m.group(1), m.group(2)","    tr_desc = {\"pct\": \"변화율\", \"diff\": \"차분(전 관측 대비 변화)\", \"log\": \"로그\", \"logdiff\": \"로그수익률\"}","    t = \"\"","    if tr:","        mm = _re.match(r\"^(pct|diff)(\\d+)$\", tr)","        t = f\" · {mm.group(2)}주기 {tr_desc[mm.group(1)]}\" if mm else f\" · {tr_desc.get(tr, tr)}\"","    if registry is not None and base in registry:","        v = registry.get(base)","        return f\"{v.name}{(' — ' + v.description) if v.description else ''}{t}\"","    return (base + t) if t else \"\"",""],"models/lightgbm_model.py":["\"\"\"LightGBM (그래디언트 부스팅 트리). 표 입력. 변수 중요도(gain) 제공 → ablation 뷰의 주력.\"\"\"","import numpy as np","import lightgbm as lgb","from models.base import BaseModel","","NAME = \"LightGBM\"","INPUT_SHAPE = \"table\"","TARGET_TYPES = [\"regression\", \"classification\"]","PARAMS = {","    \"n_estimators\": {\"default_by_freq\": {\"D\": 300, \"W\": 200, \"M\": 150}, \"type\": \"int\", \"default\": 300, \"min\": 10, \"max\": 5000, \"desc\": \"트리 개수(부스팅 라운드 상한)\"},","    \"learning_rate\": {\"type\": \"float\", \"default\": 0.03, \"min\": 1e-4, \"max\": 1.0, \"desc\": \"학습률 — 작을수록 트리를 많이 필요\"},","    \"num_leaves\": {\"default_by_freq\": {\"D\": 15, \"W\": 7, \"M\": 4}, \"type\": \"int\", \"default\": 15, \"min\": 2, \"max\": 512, \"desc\": \"트리당 최대 잎 수(복잡도)\"},","    \"max_depth\": {\"default_by_freq\": {\"D\": 4, \"W\": 3, \"M\": 2}, \"type\": \"int\", \"default\": 4, \"min\": -1, \"max\": 64, \"desc\": \"트리 최대 깊이(-1 = 제한 없음)\"},","    \"min_child_samples\": {\"default_by_freq\": {\"D\": 40, \"W\": 15, \"M\": 6}, \"type\": \"int\", \"default\": 40, \"min\": 1, \"max\": 1000, \"desc\": \"잎 하나의 최소 표본 수 — 학습 표본이 적으면(월간 60개) 반드시 줄일 것, 아니면 분할이 안 되어 상수 예측(퇴화)\"},","    \"subsample\": {\"type\": \"float\", \"default\": 0.8, \"min\": 0.1, \"max\": 1.0, \"desc\": \"트리마다 쓰는 행 비율(배깅)\"},","    \"colsample_bytree\": {\"type\": \"float\", \"default\": 0.8, \"min\": 0.1, \"max\": 1.0, \"desc\": \"트리마다 쓰는 변수 비율\"},","    \"reg_lambda\": {\"type\": \"float\", \"default\": 1.0, \"min\": 0.0, \"max\": 100.0, \"desc\": \"L2 규제 강도\"},","}","","","class Model(BaseModel):","    def fit(self, X, y, X_val=None, y_val=None):","        kw = dict(self.params, subsample_freq=1, verbose=-1, random_state=0, n_jobs=1)","        cls = lgb.LGBMRegressor if self.target_type == \"regression\" else lgb.LGBMClassifier","        self.est = cls(**kw)","        if X_val is not None and len(X_val) > 10:","            self.est.fit(X, y, eval_set=[(X_val, y_val)], callbacks=[lgb.early_stopping(50, verbose=False)])","        else:","            self.est.fit(X, y)","","    def predict(self, X):","        if self.target_type == \"regression\":","            return self.est.predict(X)","        return self.est.predict_proba(X)[:, 1]","","    def feature_importance(self):","        return self.est.booster_.feature_importance(importance_type=\"gain\").astype(float)",""],"tools/codewalk/table_capture.py":["\"\"\"표 입력 모델(Ridge·LightGBM) 실제 실행 붙잡기 — 엔진의 실제 경로(prepare → build_dataset → _walkforward_predict → models/*.py)로 기록한다.","","  python -m tools.codewalk.table_capture --model ridge            (configs/f11_ridge_macro_k1.json)","  python -m tools.codewalk.table_capture --model lightgbm_model   (configs/12_lgbm_ABCD_M.json)","","기록: 데이터셋을 만드는 재료(변수 원자료·변환·발표시차·달력 정렬, 매매 모드면 일간 가격과 월간 리샘플), 마지막 폴드의 학습 표·눈금·","적합된 모델 상태(Ridge 계수 / LightGBM 나무 전체), 결정일 예측, 그리고 모든 폴드의 예측·계수(또는 중요도). 계산은 바꾸지 않는다.","\"\"\"","from __future__ import annotations","","import argparse","import json","import pickle","import sys","from pathlib import Path","","import numpy as np","import pandas as pd","","ROOT = Path(__file__).resolve().parents[2]","sys.path.insert(0, str(ROOT))","","from engine import calendar as cal  # noqa: E402","from engine.experiment import ExperimentConfig, _embargo, _walkforward_predict, make_folds, prepare  # noqa: E402","from engine.features import describe_feature  # noqa: E402","from engine.registry import Registry  # noqa: E402","from engine.store import DataVersion  # noqa: E402","","# LightGBM: 결과 목록에 있는 12_lgbm_ABCD_M 을 2026-11-07 엔진으로 다시 돌린 결과의 설정(모델 파라미터 = 월간 기본값). configs/12_lgbm_ABCD_M.json 은 그 뒤","# n_estimators 200·min_child_samples 8 로 바뀌어 결과가 없다 — 영상은 결과 화면과 맞춰 볼 수 있는 쪽을 쓴다.","DEFAULT_CFG = {\"ridge\": \"configs/f11_ridge_macro_k1.json\", \"lightgbm_model\": \"results/trading/12_lgbm_ABCD_M_v1107_0b61d18f4d03.json\"}","","","def capture(model: str = \"ridge\", config: str | None = None, data_root: Path | None = None) -> dict:","    config = config or DEFAULT_CFG[model]","    data_root = data_root or ROOT / \"data\"","    raw_cfg = json.loads((ROOT / config).read_text(encoding=\"utf-8\"))","    if \"config\" in raw_cfg and \"prediction_metrics\" in raw_cfg:   # 결과 파일을 주면 그 결과를 낸 설정 그대로(결과 화면의 숫자와 맞춰 보기 위해)","        raw_cfg = raw_cfg[\"config\"]","    reg, _ = Registry.load_master(data_root / \"variable_master.xlsx\")","    cfg = ExperimentConfig(**raw_cfg)","    dv = DataVersion(data_root, cfg.data_version)","    cfg, plugin, params, target_type, ds = prepare(cfg, dv, reg, device=\"cpu\")","    k = cfg.target.k","    folds, _ = make_folds(cfg, ds, k)","    folds = [f for f in folds if len(f.test)]","    cap: dict = {}","    _walkforward_predict(cfg, plugin, params, ds, \"cpu\", [folds[-1]], k, target_type, capture=cap)","    m = cap[\"model\"]; feats = list(ds.feature_names)","    var_ids, _ = reg.resolve_many(cfg.variable_ids) if cfg.variable_ids else ([], [])","    wide = dv.wide(var_ids) if var_ids else pd.DataFrame()","    variables = {vid: {\"raw\": wide[vid].dropna(), \"lag\": int(ds.lag_days_used[vid]), \"transform\": ds.transforms_used[vid], \"freq\": reg.get(vid).freq,","                       \"name\": reg.get(vid).name, \"unit\": reg.get(vid).unit, \"desc\": describe_feature(vid if ds.transforms_used[vid] in (\"\", \"none\") else f\"{vid}_{ds.transforms_used[vid]}\", reg)}","                 for vid in var_ids}","    out = {\"model\": model, \"config_file\": config, \"config\": json.loads(cfg.model_dump_json()), \"params\": params, \"target_type\": target_type,","           \"mode\": cfg.mode, \"k\": k, \"embargo\": _embargo(cfg, k), \"val_frac\": cfg.validation.val_frac, \"uses_val\": bool(getattr(plugin.Model, \"USES_VALIDATION\", True)),","           \"prices\": ds.prices, \"X\": ds.X, \"y\": ds.y, \"feats\": feats, \"desc\": {c: describe_feature(c, reg) for c in feats}, \"variables\": variables,","           \"n_folds\": len(folds), \"fold\": {\"train\": list(folds[-1].train), \"test\": list(folds[-1].test)},","           \"tr\": cap[\"tr\"], \"te_valid\": cap[\"te_valid\"], \"Xtr\": cap[\"Xtr\"], \"ytr\": cap[\"ytr\"], \"Xte\": cap[\"Xte\"], \"n_tr\": cap[\"n_tr\"], \"n_va\": cap[\"n_va\"],","           \"scaler_mean\": cap[\"scaler\"].mean_.copy(), \"scaler_scale\": cap[\"scaler\"].scale_.copy(), \"pred\": cap[\"pred\"]}","    if cfg.mode == \"trading\":","        out[\"daily\"] = dv.read_prices(cfg.ticker).loc[cfg.start or None:]","    if model == \"ridge\":","        sc2, est = m.pipe[0], m.pipe[-1]","        out[\"ridge\"] = {\"inner_mean\": sc2.mean_.copy(), \"inner_scale\": sc2.scale_.copy(), \"coef\": np.ravel(est.coef_).copy(), \"intercept\": float(np.ravel(est.intercept_)[0])}","    else:","        est = m.est; bst = est.booster_","        Xte = cap[\"Xte\"]","        out[\"lgbm\"] = {\"dump\": bst.dump_model(), \"best_iteration\": int(getattr(est, \"best_iteration_\", 0) or 0), \"n_trees\": bst.num_trees(),","                       \"importance_gain\": bst.feature_importance(importance_type=\"gain\").astype(float), \"importance_split\": bst.feature_importance(importance_type=\"split\").astype(float),","                       \"raw_te\": bst.predict(Xte, raw_score=True), \"contrib_te\": bst.predict(Xte, pred_contrib=True),","                       \"staged_tr\": np.array([bst.predict(cap[\"Xtr\"][: cap[\"n_tr\"]], num_iteration=i) for i in range(1, bst.num_trees() + 1)]),","                       \"leaf_tr\": bst.predict(cap[\"Xtr\"][: cap[\"n_tr\"]], pred_leaf=True), \"evals\": getattr(est, \"evals_result_\", None) or {}}","    # 모든 폴드 — 폴드마다 같은 엔진 경로로 다시 학습해 예측과 계수(또는 중요도)를 모은다","    allf = []","    for f in folds:","        c2: dict = {}","        _walkforward_predict(cfg, plugin, params, ds, \"cpu\", [f], k, target_type, capture=c2)","        if \"model\" not in c2:","            continue","        m2 = c2[\"model\"]","        row = {\"test\": [str(d.date()) for d in c2[\"te_valid\"].index], \"pred\": c2[\"pred\"].values.astype(float).tolist(), \"n_tr\": int(c2[\"n_tr\"]), \"n_va\": int(c2[\"n_va\"])}","        if model == \"ridge\":","            row[\"coef\"] = np.ravel(m2.pipe[-1].coef_).copy(); row[\"intercept\"] = float(np.ravel(m2.pipe[-1].intercept_)[0])","        else:","            row[\"gain\"] = m2.est.booster_.feature_importance(importance_type=\"gain\").astype(float); row[\"best\"] = int(getattr(m2.est, \"best_iteration_\", 0) or 0)","        allf.append(row)","    out[\"all_folds\"] = allf","    return out","","","if __name__ == \"__main__\":","    ap = argparse.ArgumentParser()","    ap.add_argument(\"--model\", default=\"ridge\", choices=[\"ridge\", \"lightgbm_model\"])","    ap.add_argument(\"--config\"); ap.add_argument(\"--out\")","    a = ap.parse_args()","    cap = capture(a.model, a.config)","    out = Path(a.out or ROOT / f\"docs/guide_build/walk/{'lgbm' if a.model == 'lightgbm_model' else a.model}_capture.pkl\")","    pickle.dump(cap, open(out, \"wb\"))","    print(\"저장:\", out, \"· 변수\", len(cap[\"feats\"]), \"· 학습행\", len(cap[\"tr\"]), \"· 폴드\", len(cap[\"all_folds\"]), \"· 예측\", dict(cap[\"pred\"].items()))",""]},"diagram":{"width":1882,"height":84,"nodes":[{"id":"tgt","label":"대상·정답","x":10,"y":14,"w":186,"h":52,"sub":"make_target"},{"id":"tech","label":"기술지표","x":218,"y":14,"w":186,"h":52,"sub":"features.py"},{"id":"exo","label":"외부 변수","x":426,"y":14,"w":186,"h":52,"sub":"변환·발표시차"},{"id":"ds","label":"재료 표 X","x":634,"y":14,"w":186,"h":52,"sub":"결정일 × 열"},{"id":"fold","label":"폴드","x":842,"y":14,"w":186,"h":52,"sub":"학습·비움·테스트"},{"id":"scale","label":"눈금","x":1050,"y":14,"w":186,"h":52,"sub":"StandardScaler"},{"id":"fit","label":"학습","x":1258,"y":14,"w":186,"h":52,"sub":"부스팅 나무"},{"id":"pred","label":"예측","x":1466,"y":14,"w":186,"h":52,"sub":"잎 값의 합"},{"id":"allf","label":"모든 폴드","x":1674,"y":14,"w":186,"h":52,"sub":"안정성·기준 비교"}],"edges":[{"from":"tgt","to":"tech"},{"from":"tech","to":"exo"},{"from":"exo","to":"ds"},{"from":"ds","to":"fold"},{"from":"fold","to":"scale"},{"from":"scale","to":"fit"},{"from":"fit","to":"pred"},{"from":"pred","to":"allf"}],"groups":[]},"checks":[{"what":"손 계산 월간 막대(시가·고가·저가·종가·거래량) = 엔진 (차이 0.0e+00 function lineChart(t) {

  const cv = document.createElement('canvas'); const dpr = Math.max(2, window.devicePixelRatio || 1); cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';

  for (let k = 0; k <= 4; k++) { const u = lo + (hi - lo) * k / 4, v = t.ylog ? Math.pow(10, u) : u; const yy = pad.t + (H - pad.t - pad.b) * (1 - k / 4);

    c.fillStyle = v.color || '#2f8f5b'; c.textAlign = 'left'; c.fillText(v.label, X(v.i) + 4, pad.t + 12 + k * 14); });

    if (s.dots) s.y.forEach((v, i) => { if (v !== null && !(t.ylog && v <= 0)) { c.fillStyle = s.color; c.beginPath(); c.arc(X(i), Y(v), 2.5, 0, 7); c.fill(); } }); }

function renderTensor(t) {

/* ---------------- 코드 ---------------- */
function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function showCode(st) {
  const cd = st.code; if (!cd) { $('code').innerHTML = ''; $('fileh').textContent = ''; $('code').scrollTop = 0; return; }
  const src = S.sources[cd.file] || [];
  const lines = (cd.lines && cd.lines.length ? cd.lines : [cd.focus]).slice().sort((a, b) => a - b);
  const hl = new Set(lines), focus = cd.focus ?? lines[0];
  // 강조 줄이 멀리 떨어져 있으면 묶음(cluster)마다 따로 보여 주고 사이를 ⋯ 로 줄인다(정의부 + 호출부를 한 화면에)
  const groups = []; for (const l of lines) { const g = groups[groups.length - 1]; if (g && l - g[g.length - 1] <= 14) g.push(l); else groups.push([l]); }
  const fg = groups.find(g => g.includes(focus)) || groups[0];
  let h = '', prevHi = 0;
  for (const g of groups) {
    const main = g === fg, lo = Math.max(1, g[0] - (main ? (cd.before ?? 8) : 2)), hi = Math.min(src.length, g[g.length - 1] + (main ? (cd.after ?? 10) : 2));
    const a = Math.max(lo, prevHi + 1); if (prevHi && a > prevHi + 1) h += `<span class="ln gap"><span class="no">⋯</span>(줄 ${prevHi + 1}–${a - 1} 생략)</span>`;
    for (let i = a; i <= hi; i++) {
      const t = (src[i - 1] ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      h += `<span class="ln${hl.has(i) ? ' hl' : ''}${i === focus ? ' focus' : ''}" id="L${i}"><span class="no">${i}</span>${t || ' '}</span>`;
      const nt = cd.notes && cd.notes[String(i)]; if (nt) h += `<span class="ln note">${esc(nt)}</span>`;
    }
    prevHi = Math.max(prevHi, hi);
  }
  $('code').innerHTML = h;
  const rng = groups.map(g => g.length > 1 ? g[0] + '–' + g[g.length - 1] : '' + g[0]).join(', ');
  $('fileh').textContent = `${cd.file}  ·  ${cd.func || ''}  ·  줄 ${rng}`;
  const f = document.getElementById('L' + focus); const pre = $('code');
  if (f) pre.scrollTop = Math.max(0, f.offsetTop - pre.clientHeight * 0.35); else pre.scrollTop = 0;
}

/* ---------------- 직접 실행해 보기 ---------------- */
// 혼자 도는 파이썬 코드(실행 기록의 숫자를 그대로 넣음). 기대 출력 = 엔진 값 — 대본을 만들 때 실제로 실행해 같은지 확인했다(tools/codewalk/common.run_lab).

/* ---------------- 단계 ---------------- */
function show(i) {

  $('ttl').textContent = S.title; $('chap').textContent = st.chapter; $('cnt').textContent = `${cur + 1} / ${S.steps.length}`;
  $('prog').querySelector('.fill').style.width = (100 * (cur + 1) / S.steps.length) + '%';
  markDiagram(st);
  $('crumb').innerHTML = (st.stack || []).map((s, k) => k === st.stack.length - 1 ? `<b>${s}</b>` : s).join('<span class="sep">›</span>');
  showCode(st);
  const T = $('tensors'); T.innerHTML = ''; const Z = document.createElement('div'); Z.className = 'zoomer'; T.appendChild(Z);
  for (const t of st.tensors || []) Z.appendChild(renderTensor(t)); if (st.lab) Z.appendChild(renderLab(st.lab)); T.scrollTop = 0;

  $('narr').innerHTML = st.narr; $('formula').textContent = st.formula || ''; $('cap').textContent = (st.captions || [])[0] || '';
  $('hintt').textContent = st.hint || ''; $('hint').style.display = st.hint ? '' : 'none'; $('hint').open = $('autohint').checked || params.get('film') === '1' && !!st.hint;

  $('checks').textContent = ck.length ? '검증: ' + ck.map(c => (c.ok ? '✓ ' : '✗ ') + c.what).join(' · ') : '';

// 한 화면에 다 보이게: 넘치면 0.6 배까지 줄인다(그보다 더 넘치면 스크롤). 설명·힌트 높이가 정해진 뒤에 잰다.
function fitTensors() { const T = $('tensors'), Z = T.querySelector('.zoomer'); if (!Z) return; Z.style.zoom = 1;
  const avail = T.clientHeight - 26, need = Z.scrollHeight; if (need > avail) { Z.style.zoom = Math.max(0.6, avail / need); return; }
  // 내용이 작으면 키운다(최대 1.4배) — 표·그림의 실제 너비(가장 오른쪽 끝)와 높이가 모두 들어갈 때만
  const z0 = Z.getBoundingClientRect().left, w = Math.max(1, ...[...Z.querySelectorAll('table,canvas,svg,.big')].map(e => e.getBoundingClientRect().right - z0));

function stepDur(st) { const n = (st.narr || '').replace(/<[^>]+>/g, '').length + (st.formula || '').length * 0.4; return (st.dur || Math.min(34, Math.max(7, 3 + n * 0.11))) / parseFloat($('speed').value); }
// 음성용으로 기호를 읽을 수 있는 말로(화면 글자는 그대로)
function sayable(t) {
  const M = [[/x̂/g, '엑스 햇'], [/ẑ/g, '제트 햇'], [/ĉ/g, '씨 햇'], [/ŷ/g, '와이 햇'], [/τ/g, '타우 '], [/γ_h/g, '감마 에이치'], [/γ_x/g, '감마 엑스'], [/γ/g, '감마'],
    [/σ²/g, '시그마 제곱'], [/σ/g, '시그마'], [/μ/g, '뮤'], [/α/g, '알파'], [/ε/g, '엡실론'], [/δ/g, '델타'], [/Σ/g, '합'], [/⊙/g, ' 곱하기 '], [/×/g, ' 곱하기 '], [/÷/g, ' 나누기 '],

function stopAudio() { if (audioEl) { audioEl.onended = audioEl.onerror = audioEl.ontimeupdate = null; audioEl.pause(); audioEl = null; } if (!params.get('cap')) document.body.classList.remove('cap'); }

// 녹음된 설명 음성(S.audio: tools/narrate.py 가 만든 단계별 mp3 + 자막 줄 시각)이 있으면 그것을 재생하며 자막을 바꾼다. 없으면 브라우저 음성.
function speak(st, done) {

  if (A) {
    stopAudio(); const caps = st.captions || []; document.body.classList.add('cap'); $('cap').textContent = caps[0] || '';
    audioEl = new Audio(S.audio.dir + A.file); audioEl.playbackRate = parseFloat($('speed').value);
    audioEl.ontimeupdate = () => { const t = audioEl.currentTime; let k = 0; A.segs.forEach((g, i) => { if (t >= g[0] - 0.05) k = i; }); $('cap').textContent = caps[k] || ''; };
    audioEl.onended = () => { stopAudio(); done(); }; audioEl.onerror = () => { stopAudio(); speakTTS(st, done); };

function speakTTS(st, done) {

  u.lang = 'ko-KR'; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ko')); if (v) u.voice = v;

}
function schedule() {

  const st = S.steps[cur], next = () => { if (cur < S.steps.length - 1) show(cur + 1); else togglePlay(false); };
  if ($('voice').checked) speak(st, () => { timer = setTimeout(next, 900); }); else timer = setTimeout(next, stepDur(st) * 1000);
}
function togglePlay(on) { playing = on ?? !playing; $('bplay').textContent = playing ? '⏸ 멈춤' : '▶ 재생'; if (playing) schedule(); else { clearTimeout(timer); if ('speechSynthesis' in window) speechSynthesis.cancel(); stopAudio(); } }
function init() {
  drawDiagram();
  const chs = [...new Set(S.steps.map(s => s.chapter))];
  $('selch').innerHTML = chs.map(c => `<option>${c}</option>`).join('');
  $('selch').onchange = e => show(S.steps.findIndex(s => s.chapter === e.target.value));
  const pg = $('prog'); chs.forEach(c => { const i = S.steps.findIndex(s => s.chapter === c); const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (100 * i / S.steps.length) + '%'; tk.title = c; pg.appendChild(tk); });
  pg.onclick = e => { const r = pg.getBoundingClientRect(); show(Math.floor((e.clientX - r.left) / r.width * S.steps.length)); };
  $('bprev').onclick = () => show(cur - 1); $('bnext').onclick = () => show(cur + 1); $('bplay').onclick = () => togglePlay();
  $('autohint').onchange = () => show(cur); $('voice').onchange = () => { if (playing) schedule(); };
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === ' ') { e.preventDefault(); togglePlay(); } });
  window.addEventListener('resize', () => show(cur));

}
window.goto = i => show(i);
init();
