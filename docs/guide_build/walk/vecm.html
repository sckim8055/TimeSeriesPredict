<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VECM 코드 따라가기 — 실제로 계산되는 순서</title>
<style>
:root{--ink:#1c2027;--ink2:#5b6372;--line:#d9dde4;--line2:#eceff3;--bg:#f3f4f6;--panel:#fff;--accent:#23466e;--acc-bg:#e8eef7;
--data:#3b6fb6;--model:#c8710f;--good:#2f8f5b;--bad:#b3261e;--warm:#fdf6e3;--warmline:#d6a63c;--code-bg:#fbfbfc;--hl:#fff1d6;--hl-line:#e3a33b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-feature-settings:"tnum" 1}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;min-height:720px}
header{display:flex;align-items:center;gap:18px;padding:10px 18px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap}
header .chap{font-size:15px;color:var(--accent);font-weight:600;white-space:nowrap}
header .cnt{font-size:13px;color:var(--ink2);white-space:nowrap}
#prog{flex:1;height:10px;background:var(--line2);border-radius:5px;position:relative;cursor:pointer;min-width:200px}
#prog .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
#prog .tick{position:absolute;top:-3px;width:2px;height:16px;background:#9aa3b2}
#diagram{background:var(--panel);border-bottom:1px solid var(--line);padding:4px 10px 2px}
#diagram svg{width:100%;height:auto;display:block}
.node rect{fill:#f7f8fa;stroke:#c9ced6;stroke-width:1.2;rx:6}
.node text{font-size:12.5px;fill:var(--ink2);text-anchor:middle;dominant-baseline:middle}
.node .sub{font-size:10.5px;fill:#8a93a3}
.node.grp rect{fill:none;stroke:#b8c2d3;stroke-dasharray:5 4}
.node.grp text{font-size:12px;fill:#7a8597;text-anchor:start;font-weight:600}
.node.on rect{fill:#fff3df;stroke:var(--model);stroke-width:2.6}
.node.on text{fill:var(--ink);font-weight:700}
.node.done rect{fill:#eef5ef;stroke:#9fc7ad}
.edge{stroke:#b6bdc8;stroke-width:1.5;fill:none}
.edge.on{stroke:var(--model);stroke-width:2.6;stroke-dasharray:7 5;animation:flow 0.9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
main{display:grid;grid-template-columns:57% 43%;min-height:0}
#tensors{overflow:auto;padding:12px 14px;border-right:1px solid var(--line);background:var(--panel)}
#codep{display:flex;flex-direction:column;min-height:0;background:var(--code-bg)}
.crumb{font-size:12.5px;color:var(--ink2);padding:8px 12px 6px;border-bottom:1px solid var(--line);line-height:1.55}
.crumb b{color:var(--accent)}
.crumb .sep{color:#b0b7c3;margin:0 4px}
.fileh{font:600 13px "D2Coding","Consolas","Menlo",monospace;padding:6px 12px;background:#eef1f5;color:var(--ink);border-bottom:1px solid var(--line)}
pre.code{position:relative;margin:0;padding:6px 0;font:13.5px/1.55 "D2Coding","Consolas","Menlo",monospace;overflow:auto;flex:1;tab-size:4}
pre.code .ln{display:block;padding:0 12px 0 0;white-space:pre}
pre.code .ln .no{display:inline-block;width:48px;text-align:right;color:#a3abb8;margin-right:12px;user-select:none}
pre.code .ln.hl{background:var(--hl);box-shadow:inset 4px 0 0 var(--hl-line)}
pre.code .ln.focus{background:#ffe2b0}
pre.code .ln.dim{color:#9aa3b2}
pre.code .ln.gap{color:#8a93a3;background:#f0f2f5;font-size:12px;padding:2px 0}
.tz{margin-bottom:14px}
.tz h3{font-size:14px;margin:0 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tz h3 .shape{font:600 12.5px "D2Coding","Consolas",monospace;color:var(--model);background:#fff3df;border-radius:4px;padding:1px 6px}
.tz h3 .note{font-size:12px;color:var(--ink2);font-weight:400}
.tz canvas{display:block;max-width:100%}
.tz .big{font-size:30px;font-weight:700;color:var(--accent)}
.tz table.t{border-collapse:collapse;font-size:13px}
.tz table.t th,.tz table.t td{border-bottom:1px solid var(--line2);padding:3px 9px;text-align:left;white-space:nowrap}
.tz table.t td.n{text-align:right;font-family:"D2Coding","Consolas",monospace;font-size:12.5px}
.tz table.t th{color:var(--ink2);font-weight:600;background:#f7f8fa}
.tz table.t td:first-child,.tz table.t th:first-child{text-align:left}
.tz table.t tr.hl td{background:#fff3df;font-weight:600}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 18px 10px;display:grid;grid-template-columns:1fr auto;gap:8px 18px}
#narr{font-size:18px;line-height:1.6;max-width:1500px}
#formula{font:15px/1.5 "D2Coding","Consolas",monospace;color:#3a2a0a;background:var(--warm);border:1px solid #efd9a4;border-radius:5px;padding:6px 10px;margin-top:6px;white-space:pre-wrap}
#formula:empty{display:none}
details#hint{margin-top:6px;font-size:14px;color:var(--ink2)}
details#hint summary{cursor:pointer;color:var(--accent);font-weight:600}
details#hint div{margin-top:4px;line-height:1.6;white-space:pre-wrap}
#checks{font-size:12.5px;color:var(--good);margin-top:4px}
#checks.bad{color:var(--bad)}
.ctrl{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ctrl .row{display:flex;gap:6px;align-items:center}
.ctrl button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 11px;cursor:pointer}
.ctrl button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctrl select{font:inherit;font-size:13px;padding:4px}
.ctrl label{font-size:13px;color:var(--ink2);display:flex;gap:4px;align-items:center}
#tip{position:fixed;pointer-events:none;background:#1c2027;color:#fff;font-size:12px;padding:4px 7px;border-radius:4px;display:none;z-index:9;white-space:pre}
body.film footer .ctrl{display:none}
body.film footer{grid-template-columns:1fr}
body.film details#hint[open] div{display:block}
pre.code .ln.note{white-space:pre-wrap;font:13px/1.45 "Pretendard Variable",Pretendard,"Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#3f4a5a;background:#f1f4f8;padding:2px 12px 3px 66px;border-left:4px solid #9fb3cf;margin:1px 0 3px}
pre.code .ln.note::before{content:"↳ ";color:#7f93b0}
#cap{display:none;font-size:25px;line-height:1.5;font-weight:600;color:var(--ink);background:#fffaf0;border-left:6px solid var(--model);padding:9px 16px;border-radius:4px;max-width:1700px;min-height:56px}
body.cap #cap{display:block}
body.cap #narr{display:none}
details.lab{border:1px solid #cfd8e6;border-radius:6px;background:#f7f9fc;padding:8px 12px;margin:4px 0 14px}
details.lab summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent)}
details.lab summary .k{font-weight:400;color:var(--ink2);font-size:12.5px;margin-left:6px}
details.lab .desc{font-size:13px;color:var(--ink2);margin:6px 0}
details.lab pre{font:12.5px/1.45 "D2Coding","Consolas",monospace;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:0;max-height:300px;overflow:auto;white-space:pre}
details.lab .outh{font-size:12.5px;color:var(--ink2);margin:8px 0 2px}
details.lab .out{font:12.5px/1.45 "D2Coding","Consolas",monospace;background:#eef5ef;border:1px solid #cfe3d5;border-radius:4px;padding:6px 10px;white-space:pre;margin:0}
details.lab .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
details.lab button,details.lab a.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--ink);text-decoration:none}
details.lab a.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
details.lab .row .note{font-size:12px;color:var(--ink2)}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl"></h1><span class="chap" id="chap"></span><div id="prog"><div class="fill"></div></div><span class="cnt" id="cnt"></span></header>
  <div id="diagram"></div>
  <main><div id="tensors"></div><div id="codep"><div class="crumb" id="crumb"></div><div class="fileh" id="fileh"></div><pre class="code" id="code"></pre></div></main>
  <footer>
    <div><div id="cap"></div><div id="narr"></div><div id="formula"></div><div id="checks"></div><details id="hint"><summary>더 자세히 (힌트)</summary><div id="hintt"></div></details></div>
    <div class="ctrl">
      <div class="row"><button id="bprev" title="이전 단계 (←)">◀ 이전</button><button id="bplay" class="pri" title="재생/멈춤 (스페이스)">▶ 재생</button><button id="bnext" title="다음 단계 (→)">다음 ▶</button></div>
      <div class="row"><select id="selch" title="장으로 이동"></select><select id="speed" title="자동 재생 속도"><option value="0.75">느리게</option><option value="1" selected>보통</option><option value="1.4">빠르게</option></select></div>
      <div class="row"><label title="녹음된 설명 음성이 있으면 그것을, 없으면 브라우저의 한국어 음성(Windows: Microsoft Heami 등)으로 읽습니다"><input type="checkbox" id="voice"> 음성 설명</label><label><input type="checkbox" id="autohint"> 힌트 펼치기</label></div>
    </div>
  </footer>
</div>
<div id="tip"></div>
<script>
const S = {"title":"VECM 코드 따라가기 — 실제로 계산되는 순서","model":"vecm","steps":[{"chapter":"0. 시작","narr":"이 영상은 <b>VECM<\/b>(벡터 오차수정모형) 이 실제로 계산되는 순서를 따라갑니다. 설정 <b>f11_vecm_k1.json<\/b>: 대상 F11(주택매매가격지수(KB))과 변수 4개(F12, M3, N19, KR3Y), 모두 5개 시계열의 <b>수준값<\/b>을 함께 모델링합니다. 생각: 여러 시계열이 각자 떠돌아도 장기적으로 함께 움직이는 관계(공적분, 장기 균형식)가 있다면, 균형에서 벗어난 만큼 다음 달에 되돌아오는 힘을 예측에 쓸 수 있다. 워크포워드 폴드 120개마다 다시 추정하며, 화면의 숫자는 마지막 폴드(결정일 2023-12-01)의 실제 실행 기록입니다.","say":"이 영상은 벡터 오차수정모형, VECM이 실제로 계산되는 순서를 따라갑니다. 대상은 KB 주택매매가격지수 F11이고, 전세가격지수, 통화량(M2), 가계대출, 국고채 3년 금리, 이렇게 변수 4개를 더해 모두 5개 시계열의 수준값을 함께 모델링합니다. 여러 시계열이 각자 떠돌아도 장기적으로 함께 움직이는 관계가 있다면, 그 관계에서 벗어난 만큼 되돌아오는 힘을 예측에 쓰자는 생각입니다. 모델 설정은 원 노트북의 VECM 설정과 같이 지난 두 달의 변화를 보고, 균형식은 1개, 상수항은 없습니다. 다만 변수와 평가 방식은 노트북과 다릅니다. 폴드 120개마다 다시 추정하며, 화면의 숫자는 마지막 폴드, 결정일 2023-12-01의 실행 기록입니다.","code":{"file":"models/vecm.py","lines":[1,4,7],"focus":1,"func":"모듈 설명","before":0,"after":12,"notes":{"4":"이 설정(상수 없음 n · 계절 0)에서는 c_in · c_out · 계절 항이 모두 없음 → Δy_t = α(β′y_(t−1)) + Γ₁Δy_(t−1) + Γ₂Δy_(t−2) + ε_t","7":"설정 파일의 model_params 가 비어 있어 모두 기본값: k_ar_diff 2 · coint_rank 1 · deterministic n · log_levels 아니오. 노트북의 실제 호출은 `VECM(훈련다, k_ar_diff=2, coint_rank=1).fit()` (이 주석은 변수 이름 '훈련다' 를 '훈련' 으로 줄여 씀)"}},"stack":["models/vecm.py"],"nodes":["lev","unit","joh","beta","gamma","pred","allf"],"edges":[],"tensors":[{"type":"table","title":"실행 설정 (configs/f11_vecm_k1.json + models/vecm.py 기본값)","columns":["항목","값","뜻"],"rows":[["대상","F11 다음 달 변화율","k = 1 — 수준 예측 v̂_(t+1) ÷ v_t − 1 로 바꿔 다른 모델과 비교"],["F12","주택전세가격지수(KB) (M, lag 32일)","변수 사전 기본 변환(pct)은 무시(수준값 필요)"],["M3","M2(말잔) (M, lag 80일)","변수 사전 기본 변환(pct)은 무시(수준값 필요)"],["N19","가계대출(예금취급기관) (M, lag 82일)","변수 사전 기본 변환(pct)은 무시(수준값 필요)"],["KR3Y","국고채 3년 금리 (D, lag 0일)","설정 파일 변환(diff)은 무시(수준값 필요)"],["k_ar_diff","2",""],["lag_select","fixed",""],["coint_rank","1",""],["rank_test","trace",""],["rank_signif","0.05",""],["deterministic","n",""],["seasons","0",""],["log_levels","False",""]]}],"formula":"Δy_t = α(β′y_(t−1)) + Γ₁Δy_(t−1) + … + Γ_pΔy_(t−p) + ε_t     (y = [F11, 변수들] 수준값, β′y = 장기 균형식, α = 되돌아오는 속도, Γ = 단기 동학)","hint":"숫자의 출처: tools/codewalk/vecm_capture.py 가 엔진의 실제 경로로 실행하며 학습 행렬과 적합된 α·β·Γ, 예측을 기록했습니다. 모델 설정의 출처: 원 노트북 2(노트북2_통계마법_ARIMA_SARIMA_VECM.ipynb)의 VECM 칸 `VECM(훈련다, k_ar_diff=2, coint_rank=1).fit()` — deterministic 인자가 없어 statsmodels 기본값 'n'(상수 없음). 이 설정의 k_ar_diff · coint_rank · 상수 없음과 같습니다. 다만 노트북의 변수는 F11, F7, K1 이고 학습 끝에서 12개월을 한 번에 예측했으므로, 변수·평가 방식은 이 실험과 다릅니다(업로드된 노트북 파일을 자료로 읽어 확인 — 저장소에는 없음. 파일이 있는 컴퓨터에서는 빌드 때 다시 대조: 검증 표의 '출처 확인' 줄).","checks":[{"what":"[출처 확인(개수에 넣지 않음)] 원 노트북 2(노트북2_통계마법_ARIMA_SARIMA_VECM.ipynb) 의 VECM 칸 = 화면 문장의 설정 (호출 · k_ar_diff · coint_rank · 결정항(statsmodels 기본값) · 변수 · 예측 길이)","ok":true,"kind":"출처"}],"lab":null,"captions":["이 영상은 벡터 오차수정모형, VECM이 실제로 계산되는 순서를 따라갑니다.","대상은 KB 주택매매가격지수 F11이고, 전세가격지수, 통화량(M2), 가계대출, 국고채 3년 금리,","이렇게 변수 4개를 더해 모두 5개 시계열의 수준값을 함께 모델링합니다.","여러 시계열이 각자 떠돌아도 장기적으로 함께 움직이는 관계가 있다면,","그 관계에서 벗어난 만큼 되돌아오는 힘을 예측에 쓰자는 생각입니다.","모델 설정은 원 노트북의 VECM 설정과 같이 지난 두 달의 변화를 보고, 균형식은 1개, 상수항은 없습니다.","다만 변수와 평가 방식은 노트북과 다릅니다.","폴드 120개마다 다시 추정하며, 화면의 숫자는 마지막 폴드, 결정일 2023-12-01의 실행 기록입니다."],"speech":["이 영상은 벡터 오차수정모형, 브이이씨엠이 실제로 계산되는 순서를 따라갑니다.","대상은 케이비 주택매매가격지수 에프 십일이고, 전세가격지수, 통화량, 가계대출, 국고채 삼년 금리,","이렇게 변수 네 개를 더해 모두 다섯 개 시계열의 수준값을 함께 모델링합니다.","여러 시계열이 각자 떠돌아도 장기적으로 함께 움직이는 관계가 있다면,","그 관계에서 벗어난 만큼 되돌아오는 힘을 예측에 쓰자는 생각입니다.","모델 설정은 원 노트북의 브이이씨엠 설정과 같이 지난 두 달의 변화를 보고, 균형식은 한 개, 상수항은 없습니다.","다만 변수와 평가 방식은 노트북과 다릅니다.","폴드 백이십개마다 다시 추정하며, 화면의 숫자는 마지막 폴드, 결정일 이천이십삼 년 십이 월의 실행 기록입니다."],"say_auto":false},{"chapter":"0. 시작","narr":"호출 순서: 엔진의 <b>levels 분기<\/b>가 [대상 수준, 변수 수준들] 행렬을 만들고 학습 창의 빈 칸 없는 행으로 <b>m.fit<\/b>(→ fit_levels) 합니다. 정답 y 를 따로 넘기지 않는 것은 대상 F11 의 수준이 이 행렬의 첫 열에 이미 들어 있기 때문입니다(정답 y_t = F11_(t+1) ÷ F11_t − 1 도 이 열에서 나옴). 테스트 결정일마다 결정월 행까지의 마지막 4행(need = p + 2)만 넣어 <b>forecast_levels<\/b> 로 한 달 뒤 수준을 재귀 계산하고, v̂_(t+1) ÷ v_t − 1 을 예측으로 씁니다. 한 폴드 안에서는 계수를 다시 추정하지 않지만, 테스트가 1개월(test_len = 1)이라 결정일마다 새 폴드에서 다시 추정합니다.","say":"코드는 이렇게 불립니다. 엔진은 대상과 변수들의 수준값을 옆으로 붙인 행렬을 만들고, 학습 창의 빈 칸 없는 행으로 모델을 적합합니다. 정답 y를 따로 넘기지 않는 것은, 대상 F11의 수준이 이 행렬의 첫 열에 이미 들어 있기 때문입니다. 결정일에는 결정월 행까지의 마지막 4개 행을 넘겨 한 달 뒤 F11의 수준을 계산하고, 결정월 값으로 나누고 1을 빼 변화율 예측으로 씁니다. 한 폴드 안에서는 계수를 다시 추정하지 않지만, 테스트가 한 달이라 결정일마다 새 폴드에서 다시 추정합니다.","code":{"file":"engine/experiment.py","lines":[431,432,433,434,435,436,437,438,439,440,441,442,443,444,445,446,447,448,449,450,451,452,453,454],"focus":438,"func":"_walkforward_predict (levels)","before":1,"after":1,"notes":{"434":"학습 부분(f.train, 비움 뒤) 59개 달에서 빈 칸 있는 행을 뺌(이 폴드 0행) → 59행 × 5열","441":"need = p + 2 = 4 → 결정월 행까지의 마지막 4행을 넘김(모델은 그중 마지막 3행만 씀)","454":"정답 종류 return → ratio − 1. 결정일 2023-12-01: +0.025%"}},"stack":["engine/experiment.py · _walkforward_predict ('levels' 분기)"],"nodes":["lev","joh","pred"],"edges":[],"tensors":[],"formula":null,"hint":null,"checks":[],"lab":null,"captions":["코드는 이렇게 불립니다.","엔진은 대상과 변수들의 수준값을 옆으로 붙인 행렬을 만들고, 학습 창의 빈 칸 없는 행으로 모델을 적합합니다.","정답 y를 따로 넘기지 않는 것은, 대상 F11의 수준이 이 행렬의 첫 열에 이미 들어 있기 때문입니다.","결정일에는 결정월 행까지의 마지막 4개 행을 넘겨 한 달 뒤 F11의 수준을 계산하고,","결정월 값으로 나누고 1을 빼 변화율 예측으로 씁니다.","한 폴드 안에서는 계수를 다시 추정하지 않지만, 테스트가 한 달이라 결정일마다 새 폴드에서 다시 추정합니다."],"speech":["코드는 이렇게 불립니다.","엔진은 대상과 변수들의 수준값을 옆으로 붙인 행렬을 만들고, 학습 창의 빈 칸 없는 행으로 모델을 적합합니다.","정답 와이를 따로 넘기지 않는 것은, 대상 에프 십일의 수준이 이 행렬의 첫 열에 이미 들어 있기 때문입니다.","결정일에는 결정월 행까지의 마지막 네 개 행을 넘겨 한 달 뒤 에프 십일의 수준을 계산하고,","결정월 값으로 나누고 일을 빼 변화율 예측으로 씁니다.","한 폴드 안에서는 계수를 다시 추정하지 않지만, 테스트가 한 달이라 결정일마다 새 폴드에서 다시 추정합니다."],"say_auto":false},{"chapter":"1. 수준값","narr":"VECM 은 변화율이 아니라 <b>수준값<\/b>을 씁니다(변환은 무시). 각 변수는 발표시차를 적용해 결정일 달력에 맞춥니다: 공개일 = 기준일 + lag 일(실제 발표일이 아니라 사전의 시차로 잡은 날), 공개일이 결정일과 같거나 이전인 마지막 값 (값은 지금 저장된 수정치를 그 공개일에 놓은 것이라, 당시 처음 발표된 값과 다를 수 있음). 예: 결정일 2023-12-01 에 쓰는 M2 는 기준일 2023-09-01 의 값(공개일 2023-11-20 = 기준일 + 80일)입니다. N19 의 시차는 변수 사전에서 확인되지 않은 값입니다(lag_confirmed = N). <b>대상 F11 에는 발표시차를 적용하지 않습니다<\/b>(forecast_info_time = stamp — 결정월 t 행에 그 달 F11 값). 변수 사전의 F11 시차 32일은 보수적으로 잡은 값으로(사전 메모: 관측 3건 공개일 − 기준일 23~26일, '발표 = 같은 달 하순'), 이 기준이면 2023-12 값은 2024-01-02 부터 쓰입니다. 메모대로 그 달 하순에 발표된다면 결정일 2023-12-01 에 2023-12 값은 공개 전이고, 2023-11 값은 이미 공개됐을 수 있습니다(실제 공개일은 이 화면에서 확인하지 않음). 정답은 2024-01 값이라 누출은 아니지만, 실제로는 그 달 F11 이 공개된 뒤에 예측하는 셈이고 변수는 결정일까지 공개된 값만 씁니다. 그래서 한 행 안에 서로 다른 달이 섞입니다: F11 결정월(t), 전세가격지수 2개월 전, M2 3개월 전, 가계대출 3개월 전, 금리 결정일 당일.","say":"VECM은 수준값을 쓰므로 변환은 무시하고, 변수는 발표 시차를 넣어 결정일까지 공개된 마지막 값을 씁니다. 예를 들어 결정일의 통화량(M2)은 2023-09-01 기준 값이고, 공개일은 기준일에 80일을 더한 2023-11-20로 봅니다. 다만 값은 지금의 수정치라, 당시 처음 발표된 값과 다를 수 있습니다. 가계대출의 시차는 변수 사전에서 확인되지 않은 값입니다. 반면 대상 F11에는 시차를 적용하지 않고 결정월 값을 그대로 씁니다. 사전 메모로는 F11이 그 달 하순에 발표되므로, 결정일에 2023-12 값은 아직 공개 전이고, 2023-11 값은 이미 공개됐을 수 있습니다. 정답은 그다음 달 값이라 누출은 아니지만, 실제로는 그 달 F11이 공개된 뒤에 예측하는 셈입니다. 그래서 한 행 안에서 F11은 결정월, 전세가격지수는 두 달 전, 통화량과 가계대출은 세 달 전 값이고, 시차가 없는 일간 금리는 결정일 당일 값입니다.","code":{"file":"engine/experiment.py","lines":[237,265,433],"focus":237,"func":"build_dataset · levels","before":2,"after":2,"notes":{"237":"변환하지 않은 원래 값(wide[vid])을 공개일(기준일 + lag 일)부터 쓰게 달력에 맞춤. M2: 2023-09-01 + 80일 = 2023-11-20","433":"열 0 = 대상 F11 의 수준(가격 자리, 발표시차 없음), 그 뒤 변수 4개의 수준 → 5열"}},"stack":["engine/experiment.py · build_dataset","engine/calendar.py · align_to_calendar"],"nodes":["lev"],"edges":[],"tensors":[{"type":"table","title":"결정일 2023-12-01 의 행 — 열마다 어느 기준일의 값인가","columns":["열","이름","주기","lag(일)","기준일","공개일","결정월과의 차이","값","단위"],"rows":[["F11","주택매매가격지수(KB)","M","적용 안 함 (사전 32)","2023-12-01","— (stamp)","결정월","94.8763","지수"],["F12","주택전세가격지수(KB)","M","32","2023-10-01","2023-11-02","2개월 전","91.5031","지수"],["M3","M2(말잔)","M","80","2023-09-01","2023-11-20","3개월 전","3834440","십억원"],["N19","가계대출(예금취급기관)","M","82 (사전 미확인)","2023-09-01","2023-11-22","3개월 전","1228284","십억원"],["KR3Y","국고채 3년 금리","D","0","2023-12-01","2023-12-01","결정일 당일","3.587","% (사전에 단위 비어 있음)"]]}],"formula":null,"hint":"F11 의 시차 32일과 메모, 변수별 확인 여부는 변수 사전(data/variable_master.xlsx)에서 읽은 값입니다(실행 기록에는 없음). 수정 관련 사전 메모 — M3: “2026년부터 M2 정의 변경(수익증권 제외 신M2) — 과거 시계열 재편제 여부 확인 필요. 엑셀은 '말잔'” · N19: “소폭 수정 있음”. fore  'ct' 열은 엔진이 계산하지 않는 값으로, 이 대본이 같은 학습 행렬에 statsmodels adfuller(regression = 'ct') 를 돌린 결과입니다. 수준이 이미 정상(I(0))인 변수가 섞이면 Johansen 검정이 공적분 차수를 부풀립니다(그 변수 하나만으로 '정상인 조합'이 됨).","checks":[],"lab":null,"captions":["VECM은 각 수준값에 단위근이 있어 혼자서는 평균으로 돌아오지 않지만, 몇 개를 묶은 조합은 정상이라고 전제합니다.","그래서 학습 창마다 수준값에 ADF 검정을 진단으로 합니다.","p 값이 0.05보다 크면 단위근이 있다는 가설을 기각하지 못합니다.","이 폴드에서는 다섯 시계열 모두 0.05보다 크고, 가장 작은 F11도 0.3161입니다.","다만 엔진의 진단은 상수만 넣은 검정식입니다.","영상에서 추세까지 넣어 따로 계산하면 F11의 p 값은 0.0058로 단위근을 기각합니다.","검정식에 따라 결론이 달라집니다.","이 진단은 기록만 하고 모델 계산에는 쓰지 않습니다."],"speech":["브이이씨엠은 각 수준값에 단위근이 있어 혼자서는 평균으로 돌아오지 않지만, 몇 개를 묶은 조합은 정상이라고 전제합니다.","그래서 학습 창마다 수준값에 에이디에프 검정을 진단으로 합니다.","피 값이 영 점 영오보다 크면 단위근이 있다는 가설을 기각하지 못합니다.","이 폴드에서는 다섯 시계열 모두 영 점 영오보다 크고, 가장 작은 에프 십일도 영 점 삼일육일입니다.","다만 엔진의 진단은 상수만 넣은 검정식입니다.","영상에서 추세까지 넣어 따로 계산하면 에프 십일의 피 값은 영 점 영영오팔로 단위근을 기각합니다.","검정식에 따라 결론이 달라집니다.","이 진단은 기록만 하고 모델 계산에는 쓰지 않습니다."],"say_auto":false},{"chapter":"3. Johansen","narr":"<b>공적분 추정(Johansen, 축소 순위 회귀)<\/b>: ① Δy_t 와 y_(t−1) 을 각각 지난 변화 Δy_(t−1), Δy_(t−2) 에 회귀해 잔차 R₀, R₁ 을 만듭니다(단기 동학을 걷어 냄). ② S₀₀ = R₀R₀′/T, S₀₁ = R₀R₁′/T, S₁₁ = R₁R₁′/T (T = 56 = 59 − 3). ③ 행렬 S₁₁^(−½) S₁₀ S₀₀⁻¹ S₀₁ S₁₁^(−½) 의 고유값 λ 는 R₁ 의 조합과 R₀ 의 조합 사이 상관의 제곱(정준상관의 제곱)이고, 큰 고유값의 고유벡터부터 S₁₁^(−½) 를 곱해 장기 균형식 β 가 됩니다. 이 설정은 가장 큰 r = 1 개만 씁니다.","say":"이제 요한센 방법으로 장기 균형식을 추정합니다. 첫째, 이번 달 변화와 지난달 수준을 각각 지난 두 달의 변화에 회귀해, 단기 움직임을 걷어 낸 잔차를 만듭니다. 둘째, 두 잔차로 공분산 행렬 세 개를 만듭니다. 쓸 수 있는 식은 59행에서 3을 뺀 56개입니다. 셋째, 화면에 있는 행렬의 고유값을 구합니다. 고유값은 지난 수준 쪽 잔차의 조합과 이번 달 변화 쪽 잔차의 조합 사이 상관의 제곱입니다. 이 설정은 가장 큰 0.476523 하나만 써서 균형식을 1개로 둡니다.","code":{"file":"models/vecm.py","lines":[82,92,93],"focus":92,"func":"fit_levels","before":12,"after":3,"notes":{"82":"자유도 = (59 − 2 − 1) − (5 × 2 + 5 + 0) = 41 ≥ 10 → 통과","92":"statsmodels VECM(k_ar_diff = 2, coint_rank = 1, deterministic = 'n', seasons = 0).fit() — 최우추정(요한센 절차)","93":"적합된 α(5×1) · β(5×1) · Γ(5×10)를 보관 — 예측은 이 세 행렬로 직접 계산"}},"stack":["engine/experiment.py · _walkforward_predict ('levels' 분기)","models/base.py · LevelsModel.fit","models/vecm.py · Model.fit_levels","statsmodels · VECM.fit (Lütkepohl 2005 7.2 — 아래는 numpy 로 다시 계산)"],"nodes":["joh"],"edges":[["unit","joh"]],"tensors":[{"type":"table","title":"고유값 λ (큰 순서) — 손 계산(VECM.fit 과 같은 순서) vs statsmodels(coint_johansen)","columns":["번호","λ (손 계산)","λ (statsmodels)"],"rows":[[1,"0.476523","0.476523"],[2,"0.311992","0.311992"],[3,"0.244228","0.244228"],[4,"0.153949","0.153949"],[5,"0.004788","0.004788"]]}],"formula":"R₀ = Δy − 회귀(Δy | ΔX),  R₁ = y₋₁ − 회귀(y₋₁ | ΔX);   고유값 문제  S₁₁^(−½) S₁₀ S₀₀⁻¹ S₀₁ S₁₁^(−½) v = λ v,   β = S₁₁^(−½) v","hint":"엔진이 부르는 VECM.fit 은 이 고유값을 안에서 계산하지만 결과(VECMResults)로 돌려주지 않습니다. 그래서 VECM.fit 과 같은 순서로 다시 계산한 손 계산 값을 statsmodels 의 다른 함수 coint_johansen 의 값과 비교합니다. 이 자료에서는 최대 8.3e-08 차이가 납니다. M2·가계대출 열을 100만으로 나눠(고유값은 열의 단위에 따라 바뀌지 않음) 같은 두 계산을 하면 차이가 1.7e-11 으로 줄어듭니다 — S₁₁ 의 조건수 9.0e+13 → 6.5e+07. coint_johansen 의 고유값은 단위를 바꿔도 2.2e-11 안에서 같으므로, <b>오차는 VECM.fit 순서의 계산 쪽<\/b>(단위가 크게 다른 열 때문에 생긴 반올림 오차)에 있습니다. 엔진의 β 도 이 쪽 계산이라 정확한 값(coint_johansen 고유벡터)과 상대 9.1e-06 다릅니다 — '4. 장기 균형' 표. 같은 숫자를 행 우선 배열로 넣기만 해도(같은 식, 내부 계산 순서만 달라짐) β 가 상대 1.4e-05, 이 결정일의 예측이 3.7e-10 달라집니다 — 예측에는 무시할 크기입니다. 아래 β·α·Γ 는 VECM.fit 과 같은 순서·같은 배열로 계산해 엔진 값과 맞춥니다.","checks":[{"what":"[독립 대조(다른 경로)] 손 계산 고유값(VECM.fit 순서) = statsmodels coint_johansen 고유값 (다른 구현 — 차이는 위 힌트의 반올림 오차) (차이 8.3e-08, 허용 1e-06)","ok":true,"kind":"독립","vs":"coint_johansen"}],"lab":null,"captions":["이제 요한센 방법으로 장기 균형식을 추정합니다.","첫째, 이번 달 변화와 지난달 수준을 각각 지난 두 달의 변화에 회귀해, 단기 움직임을 걷어 낸 잔차를 만듭니다.","둘째, 두 잔차로 공분산 행렬 세 개를 만듭니다.","쓸 수 있는 식은 59행에서 3을 뺀 56개입니다.","셋째, 화면에 있는 행렬의 고유값을 구합니다.","고유값은 지난 수준 쪽 잔차의 조합과 이번 달 변화 쪽 잔차의 조합 사이 상관의 제곱입니다.","이 설정은 가장 큰 0.476523 하나만 써서 균형식을 1개로 둡니다."],"speech":["이제 요한센 방법으로 장기 균형식을 추정합니다.","첫째, 이번 달 변화와 지난달 수준을 각각 지난 두 달의 변화에 회귀해, 단기 움직임을 걷어 낸 잔차를 만듭니다.","둘째, 두 잔차로 공분산 행렬 세 개를 만듭니다.","쓸 수 있는 식은 오십구행에서 삼을 뺀 쉰여섯 개입니다.","셋째, 화면에 있는 행렬의 고유값을 구합니다.","고유값은 지난 수준 쪽 잔차의 조합과 이번 달 변화 쪽 잔차의 조합 사이 상관의 제곱입니다.","이 설정은 가장 큰 영 점 사칠육오이삼 하나만 써서 균형식을 한 개로 둡니다."],"say_auto":false},{"chapter":"3. Johansen","narr":"<b>몇 개의 균형식이 있나 — 요한센 검정<\/b>: 대각합(trace) 검정은 '균형식이 r 개 이하' 를 r = 0, 1, … 차례로 검정해 처음 기각하지 못하는 r 을 고릅니다. 이 폴드에서는 5% 기준으로 <b>r = 3<\/b> 이 나옵니다. 그러나 설정은 원 노트북 2 와 같이 <b>r = 1 로 고정<\/b>입니다(coint_rank = 1) — 엔진은 이 검정을 하지 않고, 표는 엔진의 자동 선택과 같은 조건(결정항 없음, 차분 시차 2)으로 따로 계산한 정보용입니다. 120개 폴드의 대각합 검정: r = 2 가 8개, r = 3 이 55개, r = 4 가 43개, r = 5 가 14개. r = 5(변수 수)는 모든 수준값이 정상이라는 뜻이라 VECM 의 단위근(I(1)) 전제와 맞지 않습니다(자동 선택이면 엔진이 4 로 줄임). <b>검정에 따라 결과가 달라집니다<\/b>: 최대고유값(maxeig — 엔진이 rank_test 로 지원) 검정은 이 폴드에서 r = 1, 120개 폴드 중 21개에서 r = 1. 소표본 보정(통계량 × (T − K·(p+1))/T = × 0.7321)을 한 대각합 검정은 이 폴드에서 r = 1, 33개 폴드에서 r = 1.","say":"균형식의 개수는 요한센 검정으로 고를 수 있습니다. 대각합 검정은 균형식 개수에 대한 가설을 0개부터 하나씩 늘려 가며 검정하고, 처음으로 기각하지 못한 개수를 고릅니다. 이 폴드에서는 5% 기준으로 3개가 나옵니다. 그러나 이 설정은 원 노트북의 VECM 설정과 같이 1개로 고정되어 있어, 엔진은 이 검정을 하지 않습니다. 표는 따로 계산한 정보용입니다. 120개 폴드에서 대각합 검정이 고른 개수는 2개가 8번, 3개가 55번, 4개가 43번, 5개가 14번입니다. 5개는 모든 수준값이 정상이라는 뜻이라, 단위근 전제와 맞지 않습니다. 검정을 바꾸면 결과가 달라집니다. 최대고유값 검정은 이 폴드에서 1개를 고르고, 120개 폴드 중 21개에서 1개를 고릅니다. 표본 크기를 보정한 대각합 검정은 이 폴드에서 1개, 33개 폴드에서 1개입니다.","code":{"file":"models/vecm.py","lines":[86,87,88,89,90],"focus":87,"func":"fit_levels · 차수","before":3,"after":3,"notes":{"86":"설정값 coint_rank = 1","88":"coint_rank = 0 일 때만 실행 — 이 설정에서는 건너뜀. 자동일 때의 조건: det_order -1(상수 없음) · k_ar_diff 2 · trace · 0.05","89":"r 상한 = 변수 수 − 1 = 4 (검정이 5개 = 모두 정상을 고르면 4개로 줄임)"}},"stack":["statsmodels · coint_johansen / select_coint_rank (정보용)"],"nodes":["joh"],"edges":[],"tensors":[{"type":"table","title":"이 폴드의 검정 (결정항 없음, coint_johansen — 실행 기록)","columns":["귀무가설: 균형식 ≤","대각합","임계값 95%","판단","최대고유값","임계값 95%","판단","보정 대각합 (× 0.7321)","판단"],"rows":[[0,"82.500","60.063","기각","36.247","30.443","기각","60.401","기각"],[1,"46.253","40.175","기각","20.941","24.159","기각 못 함","33.864","기각 못 함"],[2,"25.311","24.276","기각","15.681","17.796","기각 못 함","18.532","기각 못 함"],[3,"9.631","12.321","기각 못 함","9.362","11.225","기각 못 함","7.051","기각 못 함"],[4,"0.269","4.130","기각 못 함","0.269","4.130","기각 못 함","0.197","기각 못 함"]]},{"type":"table","title":"120개 폴드에서 검정이 고르는 r (5%, 설정은 1 고정 — 영상 계산)","columns":["r","대각합","최대고유값","보정 대각합"],"rows":[[0,0,0,1],[1,0,21,33],[2,8,34,46],[3,55,32,23],[4,43,27,8],[5,14,6,9]]}],"formula":"대각합(r) = −T Σ_(i>r) ln(1 − λ_i),   최대고유값(r) = −T ln(1 − λ_(r+1));   통계량 > 임계값(5%) 이면 'r 개 이하' 기각","hint":"coint_rank = 0 으로 두면 엔진이 폴드마다 rank_test(trace 또는 maxeig)로 r 을 고릅니다(configs/f11_vecm_auto_k1.json). 검정이 r = 변수 수(전부 정상)를 고르면 엔진은 r = 변수 수 − 1 로 줄입니다. 폴드별 수는 실행 기록의 수준값 행렬과 폴드 날짜로 학습 창을 다시 만들어 statsmodels 로 계산했습니다(재구성한 창의 대각합 r 과 β 가 기록과 같음 — 검증 줄). 보정 대각합은 엔진에 없는 계산으로, 통계량에 (T − K·(p+1))/T 를 곱하는 소표본 보정을 이 화면에서만 적용한 것입니다. 작은 표본에서 요한센 검정에 유한 표본 편의가 있다는 연구가 있습니다(예: Cheung·Lai 1993, Oxford Bulletin of Economics and Statistics 55(3):313–328). 편의의 방향·크기를 이 자료에서 확인하지는 않았습니다.","checks":[{"what":"[식 확인·재현(같은 식·같은 순서)] 대각합 통계량 = −T Σ ln(1−λ): 같은 λ 로 식·T(= 56) 확인 (상대 차이 1.7e-16)","ok":true,"kind":"식","vs":"엔진"},{"what":"[식 확인·재현(같은 식·같은 순서)] 로그우도 비: VECM.fit 을 r = 1~5 로 맞춘 2(llf_K − llf_r)·2(llf_(r+1) − llf_r) = coint_johansen 의 대각합·최대고유값 통계량 (r = 1~4) — statsmodels 의 VECMResults.llf 는 VECM.fit 과 같은 고유값(_sij)으로 만든 닫힌 식이라, 앞 화면의 고유값 대조를 식만 바꿔 다시 한 것 (상대 차이 3.4e-07, 허용 1e-05)","ok":true,"kind":"식","vs":"엔진"},{"what":"[재실행 = 기록] 폴드별 학습 창 재구성: select_coint_rank 를 다시 불러 대각합 r = 기록(120개 폴드) (차이 0.0e+00)","ok":true,"kind":"재실행","vs":"엔진"},{"what":"[식 확인·재현(같은 식·같은 순서)] 폴드별 학습 창 재구성: VECM.fit 순서의 손 계산 β = 엔진 β (120개 폴드, 상대 최대 — 같은 순서의 재현) (차이 0.0e+00)","ok":true,"kind":"식","vs":"엔진"},{"what":"[식 확인·재현(같은 식·같은 순서)] 직접 실행해 보기 '대각합 통계량과 균형식 개수 고르기를 직접 계산' 출력 = statsmodels(coint_johansen) 값 — 같은 λ·같은 식","ok":true,"kind":"식"}],"lab":{"title":"대각합 통계량과 균형식 개수 고르기를 직접 계산","desc":"고유값으로 '균형식 ≤ r' 마다 −T Σ ln(1 − λ) 를 더하고 5% 임계값과 비교해, 처음으로 기각하지 못한 r 을 고릅니다. 통계량은 statsmodels(coint_johansen) 값과 같아야 합니다. 이 설정은 r 을 1 로 고정하므로 엔진은 이 계산을 하지 않습니다(정보용).","kind":"식","ref_label":"statsmodels(coint_johansen) 값 — 같은 λ·같은 식","code":"import math\n\n# 마지막 폴드 학습 창의 고유값 λ (큰 순서) — statsmodels coint_johansen, 실행 기록 그대로\nlam = [0.4765227912041426, 0.3119918328381783, 0.24422804582298707, 0.15394868137478032, 0.004788104786831511]\nT = 56          # 식의 수 = 학습 행 수 − (차분 시차 + 1)\n# 귀무가설 '균형식 ≤ r' 마다의 5% 임계값 (결정항 없음, coint_johansen 의 표)\ncv95 = [60.0627, 40.1749, 24.2761, 12.3212, 4.1296]\n\nchosen = None\nfor r in range(len(lam)):\n    stat = 0.0\n    for i in range(r, len(lam)):\n        stat += -T * math.log(1 - lam[i])     # 대각합 통계량 = −T Σ_(i>r) ln(1 − λ_i)\n    reject = stat > cv95[r]\n    print(\"균형식 ≤\", r, f\"통계량 {stat:.3f}\", f\"임계값 {cv95[r]:.3f}\", \"기각\" if reject else \"기각 못 함\")\n    if not reject and chosen is None:\n        chosen = r                             # 처음으로 기각하지 못한 r\nprint(\"고른 r =\", chosen if chosen is not None else len(lam))\n","expect":"균형식 ≤ 0 통계량 82.500 임계값 60.063 기각\n균형식 ≤ 1 통계량 46.253 임계값 40.175 기각\n균형식 ≤ 2 통계량 25.311 임계값 24.276 기각\n균형식 ≤ 3 통계량 9.631 임계값 12.321 기각 못 함\n균형식 ≤ 4 통계량 0.269 임계값 4.130 기각 못 함\n고른 r = 3","got":null,"err":null,"pure":true,"tutor":true,"ok":true,"tol":null},"captions":["균형식의 개수는 요한센 검정으로 고를 수 있습니다.","대각합 검정은 균형식 개수에 대한 가설을 0개부터 하나씩 늘려 가며 검정하고, 처음으로 기각하지 못한 개수를 고릅니다.","이 폴드에서는 5% 기준으로 3개가 나옵니다.","그러나 이 설정은 원 노트북의 VECM 설정과 같이 1개로 고정되어 있어, 엔진은 이 검정을 하지 않습니다.","표는 따로 계산한 정보용입니다.","120개 폴드에서 대각합 검정이 고른 개수는 2개가 8번, 3개가 55번, 4개가 43번, 5개가 14번입니다.","5개는 모든 수준값이 정상이라는 뜻이라, 단위근 전제와 맞지 않습니다.","검정을 바꾸면 결과가 달라집니다.","최대고유값 검정은 이 폴드에서 1개를 고르고, 120개 폴드 중 21개에서 1개를 고릅니다.","표본 크기를 보정한 대각합 검정은 이 폴드에서 1개, 33개 폴드에서 1개입니다."],"speech":["균형식의 개수는 요한센 검정으로 고를 수 있습니다.","대각합 검정은 균형식 개수에 대한 가설을 영 개부터 하나씩 늘려 가며 검정하고, 처음으로 기각하지 못한 개수를 고릅니다.","이 폴드에서는 오 퍼센트 기준으로 세 개가 나옵니다.","그러나 이 설정은 원 노트북의 브이이씨엠 설정과 같이 한 개로 고정되어 있어, 엔진은 이 검정을 하지 않습니다.","표는 따로 계산한 정보용입니다.","백이십개 폴드에서 대각합 검정이 고른 개수는 두 개가 여덟 번, 세 개가 쉰다섯 번, 네 개가 마흔세 번, 다섯 개가 열네 번입니다.","다섯 개는 모든 수준값이 정상이라는 뜻이라, 단위근 전제와 맞지 않습니다.","검정을 바꾸면 결과가 달라집니다.","최대고유값 검정은 이 폴드에서 한 개를 고르고, 백이십개 폴드 중 스물한 개에서 한 개를 고릅니다.","표본 크기를 보정한 대각합 검정은 이 폴드에서 한 개, 서른세 개 폴드에서 한 개입니다."],"say_auto":false},{"chapter":"4. 장기 균형","narr":"<b>β (장기 균형식)<\/b>는 첫 원소가 1 이 되게 맞춥니다: β′y = F11 + Σ β_j × 변수_j. 이 모형은 상수가 없어(deterministic = n) <b>오차수정항은 β′y_(t−1) 그대로<\/b>이고, 균형은 β′y = 0 입니다. <b>α<\/b>는 오차수정항이 1 단위 클 때 각 변수의 다음 달 변화에 더해지는 양입니다. F11 의 α = -0.04275 — β′y 가 양수면 다음 달 F11 을 낮추는 쪽으로 작용합니다. 학습 창 59개월의 β′y 는 0.386 ~ 6.377(평균 3.204) 로 늘 양수였습니다 — 이 창 안에서 β′y = 0(균형)에 닿은 달은 없습니다(120개 폴드 중 60개 폴드에서 학습 창의 β′y 가 0 을 한 번도 지나지 않음). 결정일 2023-12-01 의 β′y = 0.4395. <b>상수가 없어서 α·β′y 가 평균적으로 0 이 아닌 몫(상수 같은 역할)까지 맡습니다<\/b>: 학습 창 56개 식의 평균으로 M2 의 월 변화 약 20조 원(19.93조) 중 α·β′y 몫이 24조 원(24.33조)으로 오히려 크고, 단기 항 몫이 -5조 원(-4.93조)입니다. F11 은 월 변화 0.3009 중 α·β′y 몫 -0.1381 · 단기 항 몫 0.4296. 그래서 α 를 순수한 '되돌아오는 속도' 로만 읽을 수는 없습니다. 표의 '정확한 β' 는 coint_johansen 고유벡터로, 엔진 β 와 상대 9.1e-06 다릅니다 — 엔진 β 의 여섯째 자리는 믿기 어렵습니다(예측에 실제로 쓰인 값은 엔진 β).","say":"장기 균형식 베타는 F11의 계수가 1이 되게 맞춥니다. 상수가 없는 모형이라 균형식의 값 그대로가 오차수정항이고, 이 값이 0이면 균형입니다. 알파는 오차수정항이 한 단위 클 때 각 변수의 다음 달 변화에 더해지는 양입니다. F11의 알파는 -0.04275로 음수라서, 오차수정항이 양수면 F11을 낮추는 쪽으로 작용합니다. 그런데 이 폴드의 학습 창에서 이 값은 0.386부터 6.377까지 늘 양수였고, 120개 폴드 중 60개 폴드에서도 0을 한 번도 지나지 않았습니다. 상수가 없으니 이 항이 평균적으로 상수 같은 몫까지 맡습니다. 예를 들어 통화량의 평균 월 변화는 약 20조 원인데, 이 항의 몫이 24조 원으로 오히려 크고 단기 항이 -5조 원으로 그만큼을 덜어 냅니다. 그래서 알파를 순수한 되돌아오는 속도로만 읽을 수는 없습니다.","code":{"file":"models/vecm.py","lines":[145,148],"focus":145,"func":"forecast_levels · 오차수정항","before":3,"after":4,"notes":{"145":"오차수정항 = β′y_t (상수가 없어 c_in = None → 더하는 것 없음). 결정일 2023-12-01: 0.4395","148":"α × 오차수정항: F11 은 -0.04275 × 0.4395 = -0.01879"}},"stack":["engine/experiment.py · _walkforward_predict ('levels' 분기)","models/base.py · LevelsModel.fit","models/vecm.py · Model.fit_levels","statsmodels · VECMResults.alpha / beta"],"nodes":["beta"],"edges":[["joh","beta"]],"tensors":[{"type":"table","title":"β 와 α (원래 단위) · 결정일 2023-12-01 의 β_j × 값","columns":["열","이름","엔진 β (예측에 쓰임)","정확한 β (coint_johansen 고유벡터)","β 손 계산 (VECM.fit 순서)","α","α 손 계산","β_j × 결정일 값"],"rows":[["F11","주택매매가격지수(KB)","1","1","1","-0.0427473","-0.0427473","94.8763" Δy_t        — 식의 왼쪽\nY1 = y[:, P - 1:-1]                # y_(t−1)     — 지난달 수준\nT = dY.shape[1]                    # 쓸 수 있는 식의 수\ndX = np.zeros((p * K, T))          # [Δy_(t−1); Δy_(t−2)] — 지난 두 달의 변화\nfor j in range(T):\n    dX[:, j] = np.concatenate([dy[:, P + j - 2 - i] for i in range(p)])\nXXi = np.linalg.inv(dX @ dX.T)\nR0 = dY - dY @ dX.T @ XXi @ dX      # ① 단기 움직임을 걷어 낸 잔차\nR1 = Y1 - Y1 @ dX.T @ XXi @ dX\nS00, S01, S11 = R0 @ R0.T / T, R0 @ R1.T / T, R1 @ R1.T / T   # ②\n\nu, s, v = np.linalg.svd(S11, full_matrices=False)\nS11_h = np.linalg.inv(u @ (np.sqrt(s)[:, None] * v))         # S₁₁^(−½)\nA = S01 @ S11_h\nlam, V = np.linalg.eig(A.T @ np.linalg.inv(S00) @ A)         # ③ 고유값 문제\no = np.argsort(lam)[::-1]\nlam, V = lam[o], V[:, o]                                      # 큰 순서\n\nbeta = np.real_if_close((V[:, :r].T @ S11_h).T)\nbeta = beta @ np.linalg.inv(beta[:r])                         # 첫 원소(F11) = 1\nalpha = S01 @ beta @ np.linalg.inv(beta.T @ S11 @ beta)\n\nfor name, b, a in zip(names, beta[:, 0], alpha[:, 0]):\n    print(name, f\"β {b:.5g}\", f\"α {a:.5g}\")\n","expect":"F11 β 1 α -0.042747\nF12 β -0.35937 α -0.0095342\nM3 β -1.181e-05 α 7532.2\nN19 β -1.3863e-05 α 441.46\nKR3Y β 0.21135 α 0.033367","got":null,"err":null,"pure":false,"tutor":false,"ok":true,"tol":null},"captions":["장기 균형식 베타는 F11의 계수가 1이 되게 맞춥니다.","상수가 없는 모형이라 균형식의 값 그대로가 오차수정항이고, 이 값이 0이면 균형입니다.","알파는 오차수정항이 한 단위 클 때 각 변수의 다음 달 변화에 더해지는 양입니다.","F11의 알파는 -0.04275로 음수라서, 오차수정항이 양수면 F11을 낮추는 쪽으로 작용합니다.","그런데 이 폴드의 학습 창에서 이 값은 0.386부터 6.377까지 늘 양수였고,","120개 폴드 중 60개 폴드에서도 0을 한 번도 지나지 않았습니다.","상수가 없으니 이 항이 평균적으로 상수 같은 몫까지 맡습니다.","예를 들어 통화량의 평균 월 변화는 약 20조 원인데,","이 항의 몫이 24조 원으로 오히려 크고 단기 항이 -5조 원으로 그만큼을 덜어 냅니다.","그래서 알파를 순수한 되돌아오는 속도로만 읽을 수는 없습니다."],"speech":["장기 균형식 베타는 에프 십일의 계수가 일이 되게 맞춥니다.","상수가 없는 모형이라 균형식의 값 그대로가 오차수정항이고, 이 값이 영이면 균형입니다.","알파는 오차수정항이 한 단위 클 때 각 변수의 다음 달 변화에 더해지는 양입니다.","에프 십일의 알파는 마이너스 영 점 영사이칠오로 음수라서, 오차수정항이 양수면 에프 십일을 낮추는 쪽으로 작용합니다.","그런데 이 폴드의 학습 창에서 이 값은 영 점 삼팔육부터 육 점 삼칠칠까지 늘 양수였고,","백이십개 폴드 중 예순 개 폴드에서도 영을 한 번도 지나지 않았습니다.","상수가 없으니 이 항이 평균적으로 상수 같은 몫까지 맡습니다.","예를 들어 통화량의 평균 월 변화는 약 이십조 원인데,","이 항의 몫이 이십사조 원으로 오히려 크고 단기 항이 마이너스 오조 원으로 그만큼을 덜어 냅니다.","그래서 알파를 순수한 되돌아오는 속도로만 읽을 수는 없습니다."],"say_auto":false},{"chapter":"4. 단기 동학","narr":"<b>Γ (단기 동학)<\/b>: 지난 2개월의 변화 Δy 가 이번 달 변화에 주는 영향입니다. Γ_i 의 행 = 이번 달 변하는 변수, 열 = i달 전 변화의 변수. α·β 를 정한 뒤 남은 부분을 최소제곱으로 구합니다. 예: F11 행의 ΔF11 열 — Γ₁ 0.87627, Γ₂ 0.13717. 계수의 크기는 변수 단위에 따라 달라 열끼리 바로 비교할 수 없습니다. 검증: β 를 엔진 값으로 두고 ΔY 를 [β′Y₋₁; ΔX] 에 한꺼번에 최소제곱 회귀해도(np.linalg.lstsq — 다른 계산법) 같은 α·Γ 가 나옵니다.","say":"감마는 단기 움직임으로, 지난 두 달의 변화가 이번 달 변화에 주는 영향입니다. 행은 이번 달에 변하는 변수, 열은 몇 달 전 어느 변수의 변화인지를 뜻합니다. 알파와 베타를 먼저 정한 뒤, 이번 달 변화에서 오차수정항 몫을 빼고 남은 부분을 최소제곱으로 구합니다. 예를 들어 지난달 F11 변화가 이번 달 F11 변화에 주는 계수는 0.87627, 두 달 전 것은 0.13717입니다. 계수 크기는 변수 단위에 따라 달라서, 열끼리 바로 비교할 수는 없습니다.","code":{"file":"models/vecm.py","lines":[144,148],"focus":148,"func":"forecast_levels · 단기 동학","before":4,"after":3,"notes":{"148":"gamma(5 × 10) = [Γ₁ | Γ₂]. 예측할 때 gamma[:, 0:5] = Γ₁ 은 dy[0] = Δy_t 에, gamma[:, 5:10] = Γ₂ 는 dy[1] = Δy_(t−1) 에 곱함"}},"stack":["engine/experiment.py · _walkforward_predict ('levels' 분기)","models/base.py · LevelsModel.fit","models/vecm.py · Model.fit_levels","statsmodels · VECMResults.gamma"],"nodes":["gamma"],"edges":[["beta","gamma"]],"tensors":[{"type":"table","title":"Γ_1 (1달 전 변화 → 이번 달 변화)","columns":["","ΔF11","ΔF12","ΔM3","ΔN19","ΔKR3Y"],"rows":[["F11","0.8763","-0.009969","3.979e-06","1.844e-06","-0.1106"],["F12","0.09392","0.5696","-2.951e-06","-5.546e-07","0.1937"],["M3","-2915","4134","-0.2043","1.058","-4112"],["N19","2365","1264","0.04676","0.07743","-5703"],["KR3Y","0.2164","0.04299","2.659e-07","-1.455e-05","-0.2769"]]},{"type":"table","title":"Γ_2 (2달 전 변화 → 이번 달 변화)","columns":["","ΔF11","ΔF12","ΔM3","ΔN19","ΔKR3Y"],"rows":[["F11","0.1372","-0.1118","2.624e-06","3.716e-06","-0.06485"],["F12","0.6822","-0.1351","-2.655e-06","-3.122e-06","0.1855"],["M3","2932","-7630","-0.1817","0.1131","-1.99e 난 변화의 변수)\nalpha = [-0.0427472994141629, -0.00953421602807294, 7532.1717031421285, 441.4628104614597, 0.03336708112325944]\nbeta = [0.9999999999999999, -0.35936620049389456, -1.1809910945652576e-05, -1.3862751049027185e-05, 0.21135356909132344]\nG1 = [\n    [0.8762736823425679, -0.009969030995187273, 3.978997920129735e-06, 1.8444645220255172e-06, -0.11059935486485938],\n    [0.09391821391102964, 0.5696394436031804, -2.9509313863504393e-06, -5.545955324623141e-07, 0.19374996666356326],\n    [-2915.270347177555, 4133.993616119279, -0.20427803966066416, 1.0576063572250354, -4112.332612851839],\n    [2365.2810596520317, 1264.0230997104425, 0.04676156638479537, 0.07743037853600719, -5703.311163876542],\n    [0.2164283139795261, 0.042987334591638234, 2.659244574704036e-07, -1.4552518663188311e-05, -0.27685005650250716],\n]\nG2 = [\n    [0.1371686221707702, -0.11179513366882517, 2.623635351194762e-06, 3.7160955793409588e-06, -0.06484588682182842],\n    [0.6821689383062518, -0.1350699740209329, -2.6550263911452883e-06, -3.1218412133449726e-06, 0.18554516153671613],\n    [2932.1104413729786, -7629.57623186991, -0.18171244836706726, 0.11307240737866811, -19898.97918173244],\n    [1312.35783247475, 978.2192172913028, -0.028154930146452744, 0.010602138905903842, -3557.324469563225],\n    [-0.20316208389302345, 0.07697106429008492, 7.195825678269982e-07, -9.472262787216719e-06, -0.03608101509329297],\n]\n\nK = len(y_0)\ndy1 = [y_0[j] - y_1[j] for j in range(K)]     # Δy_t      (이번 달 변화)\ndy2 = [y_1[j] - y_2[j] for j in range(K)]     # Δy_(t−1)  (지난달 변화)\n\nect = 0.0\nfor j in range(K):\n    ect += beta[j] * y_0[j]                   # 오차수정항 β′y_t (상수 없음)\n\ny_next = []\nfor i in range(K):\n    d = alpha[i] * ect                        # 되돌림 몫\n    for j in range(K):\n        d += G1[i][j] * dy1[j] + G2[i][j] * dy2[j]   # 단기 움직임 몫\n    y_next.append(y_0[i] + d)                 # ŷ_(t+1) = y_t + Δŷ\n\npred = y_next[0] / y_0[0] - 1                 # 엔진: 대상 수준 → 변화율\nprint(\"다음 달 F11
